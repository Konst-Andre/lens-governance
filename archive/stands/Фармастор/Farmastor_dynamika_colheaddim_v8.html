<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef3f1" id="metaTheme">
<meta name="color-scheme" content="light dark">
<title>Фармастор · Динаміка HARNESS v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== ФАРМАСТОР Динаміка HARNESS v4 — УНІФІКОВАНА ВЕРХІВКА (1 картка, 3 зони) · 2 композиції B/A ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mutL:46;
  --seg-dur:500ms; --seg-ease:cubic-bezier(.34,1.80,.64,1);
  --bg:#eef3f1; --bg-soft:#e4ece9; --card:#ffffff; --surface-2:#f4f8f6; --surface-3:#eef4f1;
  --text:#182c28; --text-2:#3c574f; --muted:#6b8c84; --border:#d4e5df; --border-subtle:#e1ebe7;
  --ok:#1f9d57; --crit:#c0392b; --warn:#c8811b;
  --accent:hsl(162 82% 27%); --accent-soft:hsl(162 64% 88%); --accent-ink:hsl(162 82% 16%);
  --cardBg:var(--card); --counterFill:55; --ebInk:10; --rowGap:6;
  --colW:38px; --colD:50px; --colGap:6px;
  --chH:25; --chRad:6; --Lbg:20; --Lbord:70; --Ldrop:7;   /* colhead-ДІМ · LIGHT+геом · DEVICE-LOCK Konst 19.07 */
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0d1512; --bg-soft:#151e1a; --card:#18221e; --surface-2:#1c2723; --surface-3:#212d28;
  --text:#e8f0ec; --text-2:#a7c0b8; --muted:#7c968d; --border:#2a3833; --border-subtle:#222e29;
  --ok:#33c06f; --crit:#e0685c; --warn:#e0a94a;
  --accent:hsl(163 46% 46%); --accent-soft:hsl(163 37% 17%); --accent-ink:hsl(163 46% 68%);
  --Dlift:10; --Dridge:16; --Dgrane:12; --Dbord:7;   /* dark-tile HARNESS-LOCK · Konst device 22:49 v4_2 */
  --Dbg:12; --DbordC:10; --DridgeC:14; --Ddip:28;     /* colhead-ДІМ · DARK · DEVICE-LOCK Konst 19.07 */
  color-scheme:dark;
}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}   /* shell-фікс: скрол на .scroll, не на body (Cookbook 497/1163, A9) */
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

.hdr{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;background:var(--bg);position:sticky;top:0;z-index:30}
.hdr .back{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#fff 55%,var(--bg));border:1px solid rgba(20,50,42,.12);color:var(--accent);font-size:18px}
[data-theme="dark"] .hdr .back{background:color-mix(in srgb,#fff 6%,var(--surface-3));border-color:rgba(255,255,255,.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.096)}
.hdr .htitle{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hdr .hsub{font-size:12px;color:var(--muted);font-weight:600}

/* .scroll ЯВНИЙ фон (план HIGH-1: webview не автозатемнює жолоби) */
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:150px;background:var(--bg)}   /* min-height:0 = знімає флекс-пастку min-height:auto (тепер .scroll реально скролиться → sticky пінится) */

/* ============================================================= */
/* ===== SUMMARY-КАРТКА — 1 полотно, 3 інтегровані зони ========= */
/* ============================================================= */
.sumcard{margin:4px 12px 14px;background:var(--card);border-radius:18px;border:1px solid var(--border-subtle);
  box-shadow:0 1px 3px rgba(20,50,42,.05),0 7px 20px rgba(20,50,42,.055);overflow:hidden}
[data-theme="dark"] .sumcard{background:color-mix(in srgb,#fff 4%,var(--surface-2));border-color:var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}                                                 /* A45: тон-lift, не drop */

/* зона-дільник (тонкий, внутрішній — A48-мова) */
.sum-div{height:1px;background:var(--border-subtle);margin:0 14px}
[data-theme="dark"] .sum-div{background:var(--border)}

/* ---- ЗОНА 1: статус + tally + дата ---- */
.sum-top{padding:14px 14px 13px}
.sum-top.mode-b{display:flex;gap:12px;align-items:stretch}
.st-col{flex:1;min-width:0}
.st-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.st-line .st-head{flex:1 1 auto;min-width:0}
.st-line .dpill{flex:0 0 auto}

/* статус-голова (слово + тренд-іконка, колір за вердиктом) */
.st-head{display:flex;align-items:center;gap:9px;min-width:0}
.st-ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.st-ico svg{width:19px;height:19px}
.st-word{font-size:19px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.st-txt{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.st-cap{font:600 10.5px/1.05 var(--font);color:var(--muted);letter-spacing:.1px;white-space:nowrap;margin-top:2px}
.st-head.up .st-ico{background:color-mix(in srgb,var(--accent) 13%,var(--card));color:var(--accent)}
.st-head.up .st-word{color:var(--accent)}
.st-head.down .st-ico{background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn)}
.st-head.down .st-word{color:var(--warn)}
.st-head.flat .st-ico{background:color-mix(in srgb,var(--muted) 15%,var(--card));color:var(--muted)}
.st-head.flat .st-word{color:var(--text-2)}
[data-theme="dark"] .st-head.up .st-ico{background:color-mix(in srgb,var(--accent) 22%,var(--surface-3))}
[data-theme="dark"] .st-head.down .st-ico{background:color-mix(in srgb,var(--warn) 22%,var(--surface-3))}
[data-theme="dark"] .st-head.flat .st-ico{background:color-mix(in srgb,var(--muted) 20%,var(--surface-3))}

/* 3 плитки-tally — ПІДНЯТІ (A66/A45): відрізняються від інсет-well рядків */
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mode-a .tally{margin-top:13px}
.tile{border-radius:13px;padding:9px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),color-mix(in srgb,var(--card) 93%,#000));
  border:1px solid var(--border-subtle);box-shadow:0 1px 2px rgba(20,50,42,.045),0 6px 16px rgba(20,50,42,.06)}   /* A66: drop blur ≥14 = lift, не «потемнів край» */
/* ТЕМНА — tone-lift (var-driven bench): плитка СВІТЛІША за картку + видимий ридж + нижня грань · drop мертвий (A45) */
[data-theme="dark"] .tile{
  background:color-mix(in srgb,#fff calc(var(--Dlift)*1%),var(--surface-3));
  border-color:color-mix(in srgb,var(--border),#fff calc(var(--Dbord)*1%));
  box-shadow:inset 0 1.3px 0 rgba(255,255,255,calc(var(--Dridge)*.01)),inset 0 -1px 0 rgba(0,0,0,calc(var(--Dgrane)*.01))}
.tile .ti-top{display:flex;align-items:center;gap:5px;min-width:0}
.tile .ti-ic{width:15px;height:15px;flex:0 0 15px}.tile .ti-ic svg{width:15px;height:15px;display:block}
.tile .ti-n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1}
.tile .ti-l{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tile.better .ti-ic{color:var(--accent)}.tile.better .ti-n{color:var(--accent)}
.tile.worse .ti-ic{color:var(--warn)}.tile.worse .ti-n{color:var(--warn)}
.tile.same .ti-ic{color:var(--muted)}.tile.same .ti-n{color:var(--text-2)}
/* важіль: плоскі плитки (sanity-check матеріалу) */
body[data-tilemat="flat"] .tile{background:var(--surface-2);border-color:var(--border-subtle);box-shadow:none}
[data-theme="dark"] body[data-tilemat="flat"] .tile{background:var(--surface-3);box-shadow:none}

/* ДАТА — варіант B: вертикальний стовп-пігулка (well-афорданс, тапабельний) */
.dcol{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-width:76px;padding:9px 10px;border-radius:14px;cursor:pointer;position:relative;
  background:color-mix(in srgb,var(--bg-soft) 82%,var(--card));border:1px solid var(--border-subtle);
  box-shadow:inset 0 1px 2px rgba(20,50,42,.12)}
[data-theme="dark"] .dcol{background:color-mix(in srgb,var(--card),#000 20%);border-color:color-mix(in srgb,var(--border),#000 14%);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.08)}
.dcol .dc-ic{width:19px;height:19px;color:var(--muted);margin-bottom:3px}.dcol .dc-ic svg{width:19px;height:19px;display:block}
.dcol .dc-d{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;color:var(--text)}
.dcol .dc-s{font-size:12px;color:var(--muted);line-height:.7}
.dcol .dc-crt{position:absolute;top:6px;right:7px;width:12px;height:12px;color:var(--muted)}.dcol .dc-crt svg{width:12px;height:12px;display:block}

/* ДАТА — варіант A: горизонтальна пігулка-діапазон */
.dpill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px 7px 11px;border-radius:11px;cursor:pointer;flex:0 0 auto;
  font-family:var(--font);font-variant-numeric:tabular-nums;font-size:13px;font-weight:800;letter-spacing:-.2px;color:var(--text);
  background:color-mix(in srgb,var(--bg-soft) 82%,var(--card));border:1px solid var(--border-subtle);
  box-shadow:inset 0 1px 2px rgba(20,50,42,.10)}
[data-theme="dark"] .dpill{background:color-mix(in srgb,var(--card),#000 18%);border-color:color-mix(in srgb,var(--border),#000 12%);
  box-shadow:inset 0 1.5px 4px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.07)}
.dpill .dp-ic{width:15px;height:15px;color:var(--muted);flex:0 0 15px}.dpill .dp-ic svg{width:15px;height:15px;display:block}
.dpill .dp-c{width:13px;height:13px;color:var(--muted);flex:0 0 13px}.dpill .dp-c svg{width:13px;height:13px;display:block}

/* ---- ЗОНА 3: СТАТУС-ФІЛЬТР (тунель) — персист. сегмент + thumb (A54) ---- */
.sum-fil{padding:11px 12px 12px}
.sfilter{display:flex;gap:0;padding:3px;border-radius:12px;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--bg-soft) 82%,var(--card));
  box-shadow:inset 0 1px 2px rgba(20,50,42,.15);border:1px solid var(--border-subtle)}
[data-theme="dark"] .sfilter{background:color-mix(in srgb,var(--card),#000 20%);border-color:color-mix(in srgb,var(--border),#000 16%);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.08)}
.sfilter button{flex:1;border:none;background:transparent;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text-2);
  padding:8px 4px;border-radius:9px;cursor:pointer;position:relative;z-index:1;transition:color .15s}
.sfilter button.on{color:#fff}
.sf-thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;z-index:0;opacity:0;pointer-events:none;
  background:var(--accent);box-shadow:0 1px 3px -1px color-mix(in srgb,var(--accent) 40%,transparent);
  transition:transform var(--seg-dur) var(--seg-ease),width var(--seg-dur) var(--seg-ease)}
[data-theme="dark"] .sf-thumb{background:linear-gradient(180deg,hsl(163 55% 34%),hsl(163 55% 30%))}
.sf-thumb.no-anim{transition:none}
@media(prefers-reduced-motion:reduce){.sf-thumb{transition:none}}

/* ============ РЕЮЗ FILL-акордеона (ЗАЛОЧЕНА анатомія — не чіпати) ============ */
.cat-div{display:flex;align-items:center;gap:8px;margin:16px 16px 2px;font:800 12px/1 var(--font);letter-spacing:.5px;text-transform:uppercase;color:var(--text-2)}
.cat-div:first-child{margin-top:6px}
.cat-div .cat-tier{font:700 11px/1 var(--font);color:var(--muted);letter-spacing:.2px;text-transform:none}

.brand{margin:8px 12px 0;background:var(--cardBg);border-radius:16px;position:relative;border:1px solid var(--border-subtle);box-shadow:0 1px 3px rgba(20,50,42,.05)}
[data-theme="dark"] .brand{border-color:var(--border);box-shadow:none;background:color-mix(in srgb,#fff 3%,var(--surface-2))}
.bhdr{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;cursor:pointer}
.bhdr .arr{font-size:13px;color:var(--accent);width:14px;flex:0 0 14px;transition:transform .2s}
.brand.collapsed .bhdr .arr{transform:rotate(-90deg)}
.bhdr .bnm{font-size:15px;font-weight:800;color:var(--text);flex:1;letter-spacing:-.2px}
.bhdr .bcnt{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 9px;border-radius:9px;font:700 12px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text-2);background:color-mix(in srgb,var(--surface-2) calc(var(--counterFill)*1%),var(--card));border:1px solid var(--border-subtle)}
[data-theme="dark"] .bhdr .bcnt{background:color-mix(in srgb,var(--surface-3) calc(var(--counterFill)*1%),var(--card));border-color:var(--border)}
.bwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
.brand.collapsed .bwrap{grid-template-rows:0fr}
.brand.collapsed .colhead{display:none}
.bbody{overflow:hidden;min-height:0}

/* ===== colhead-ДІМ (реопен-борг HIGH-3): власна поверхня під дату+зміну ===== */
.colhead{display:flex;align-items:flex-end;padding:3px 14px 7px;position:relative}
.colhead .spacer{flex:1;min-width:0;display:flex;align-items:flex-end}
.colhead .ch-lbl{font:700 9.5px/1 var(--font);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:0 0 5px 3px;display:none}
[data-chscope="full"] .colhead .ch-lbl{display:block;padding:0 0 0 4px;font-size:11px}
.colhead .hcols{display:grid;grid-template-columns:var(--colW) var(--colW) var(--colD);gap:var(--colGap);
  min-height:calc(var(--chH)*1px);align-items:center;padding:0 6px;border-radius:calc(var(--chRad)*1px);
  background:color-mix(in srgb,var(--bg-soft) calc(var(--Lbg)*1%),var(--card));                 /* ДІМ LIGHT: tint */
  border:1px solid color-mix(in srgb,var(--border) calc(var(--Lbord)*1%),transparent);          /* + border (manifest) */
  box-shadow:0 1px calc(var(--Ldrop)*1px) rgba(20,50,42,.10)}                                    /* + drop (light lift) */
[data-theme="dark"] .colhead .hcols{                                                            /* ДІМ DARK: tone-lift + ridge + dip · drop=0 */
  background:color-mix(in srgb,var(--surface-3),#fff calc(var(--Dbg)*1%));
  border-color:color-mix(in srgb,var(--border),#fff calc(var(--DbordC)*1%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--DridgeC)*.01)),inset 0 -1px 0 rgba(0,0,0,calc(var(--Ddip)*.01))}
.colhead .hc{font:800 11px/1 var(--font);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.colhead .hc.hd{color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-size:9.5px}

/* scope=full: увесь рядок = одна поверхня-дім (дата-мітки + ліва підказка) */
[data-chscope="full"] .colhead{margin:0 11px;padding:0 10px;min-height:calc(var(--chH)*1px);align-items:center;border-radius:calc(var(--chRad)*1px);
  background:color-mix(in srgb,var(--bg-soft) calc(var(--Lbg)*1%),var(--card));
  border:1px solid color-mix(in srgb,var(--border) calc(var(--Lbord)*1%),transparent);
  box-shadow:0 1px calc(var(--Ldrop)*1px) rgba(20,50,42,.10)}
[data-theme="dark"][data-chscope="full"] .colhead{
  background:color-mix(in srgb,var(--surface-3),#fff calc(var(--Dbg)*1%));
  border-color:color-mix(in srgb,var(--border),#fff calc(var(--DbordC)*1%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--DridgeC)*.01)),inset 0 -1px 0 rgba(0,0,0,calc(var(--Ddip)*.01))}
[data-chscope="full"] .colhead .hcols{background:none;border:none;box-shadow:none;min-height:auto;padding:0}
[data-chscope="full"] .colhead .spacer{align-items:center}

/* ===== G · ГЛОБАЛЬНИЙ ДІМ (один зверху #list, над усіма брендами) ===== */
/* геометрія: margin12 + border1 + padding14 = 27px inset → hcols прав.край = viewport−27 = точно над .dyn рядків */
.gdome{display:flex;align-items:center;margin:4px 12px 2px;padding:0 14px;min-height:calc(var(--chH)*1px);border-radius:calc(var(--chRad)*1px);position:relative;z-index:20;
  background:color-mix(in srgb,var(--bg-soft) calc(var(--Lbg)*1%),var(--card));                 /* ДІМ LIGHT (ті самі важелі) */
  border:1px solid color-mix(in srgb,var(--border) calc(var(--Lbord)*1%),transparent);
  box-shadow:0 1px calc(var(--Ldrop)*1px) rgba(20,50,42,.10)}
[data-theme="dark"] .gdome{                                                                    /* ДІМ DARK: tone-lift+ridge+dip · drop=0 */
  background:color-mix(in srgb,var(--surface-3),#fff calc(var(--Dbg)*1%));
  border-color:color-mix(in srgb,var(--border),#fff calc(var(--DbordC)*1%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--DridgeC)*.01)),inset 0 -1px 0 rgba(0,0,0,calc(var(--Ddip)*.01))}
.gdome .spacer{flex:1;min-width:0;display:flex;align-items:center}
.gdome .ch-lbl{display:block;font:700 11px/1 var(--font);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:0 0 0 4px}
.gdome .hcols{display:grid;grid-template-columns:var(--colW) var(--colW) var(--colD);gap:var(--colGap);align-items:center;flex:0 0 auto}
.gdome .hc{font:800 11px/1 var(--font);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.gdome .hc.hd{color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-size:9.5px}
/* toggle-видимість G⇄P */
[data-domescope="global"] .colhead{display:none}
[data-domescope="perbrand"] .gdome{display:none}
/* sticky G: глобальний дім пінится (керовано chSticky для device-порівняння) */
[data-domescope="global"][data-chsticky="on"] .gdome{position:sticky;top:0}

/* sticky P: per-brand дім пінится в межах свого бренду (scope=perbrand) */
[data-domescope="perbrand"][data-chsticky="on"] .colhead{position:sticky;top:0;z-index:6;background:var(--cardBg);padding-top:6px;padding-bottom:6px}
[data-theme="dark"][data-domescope="perbrand"][data-chsticky="on"] .colhead{background:color-mix(in srgb,#fff 3%,var(--surface-2))}

.ebrow{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 6px;background:var(--cardBg);border-top:2px solid var(--border-subtle);margin:0 7px}   /* НЕ sticky: жив у .bbody{overflow:hidden} → sticky не працював + давав зазор; тепер нормальний дільник */
[data-theme="dark"] .ebrow{border-top-color:var(--border);background:color-mix(in srgb,#fff 3%,var(--surface-2))}
.bbody>.ebrow:first-child{border-top:none;padding-top:9px}   /* перший eyebrow під домом — без лінії-колізії */
.ebrow .eb{position:relative;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.2px;color:color-mix(in srgb,var(--accent) calc(var(--ebInk)*1%),var(--text-2));padding-left:11px}
.ebrow .eb::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:3px;background:var(--accent)}
.ebrow .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 8px;border-radius:9px;font:700 11px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text-2);background:color-mix(in srgb,var(--surface-2) calc(var(--counterFill)*1%),var(--card));border:1px solid var(--border-subtle)}
[data-theme="dark"] .ebrow .cnt{background:color-mix(in srgb,var(--surface-3) calc(var(--counterFill)*1%),var(--card));border-color:var(--border)}

.rows{padding:0 6px 6px}
.row{display:flex;align-items:center;gap:10px;padding:11px 8px;position:relative;margin-bottom:calc(var(--rowGap)*1px)}
.row+.row::before{content:'';position:absolute;top:calc(var(--rowGap)*-.5px - .5px);left:8px;right:8px;height:1px;background:var(--border-subtle)}
.row .info{flex:1;min-width:0}
.row .rn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.2;min-width:0}
.row .rv{font-size:14px;font-weight:700;letter-spacing:-.1px;overflow-wrap:break-word;min-width:0;color:var(--text)}
.rn-tag{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap;flex:0 0 auto}
.row .rpk{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;flex:0 0 auto;padding:1.5px 7px;border-radius:7px;color:var(--text);background:var(--surface-2);border:1px solid var(--border-subtle)}
[data-theme="dark"] .row .rpk{background:var(--surface-3);border-color:var(--border)}
.row .rfd{font-size:11px;font-weight:600;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.row .rm{font-size:11.5px;margin-top:3px;font-weight:500;color:color-mix(in srgb,var(--muted) calc(var(--mutL)*1%),var(--text-2))}
.row .rm .nm{color:var(--text-2);font-weight:700}
.row .rm .normchg{color:var(--warn);font-weight:700}
.row.lv-crit{--sig:var(--crit)} .row.lv-low{--sig:var(--warn)} .row.lv-ok{--sig:var(--accent)} .row.lv-none{--sig:var(--muted)}

.dyn{display:grid;grid-template-columns:var(--colW) var(--colW) var(--colD);gap:var(--colGap);align-items:center;flex:0 0 auto}
.well{height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--bg-soft) 68%,var(--card));border:1px solid var(--border-subtle);box-shadow:inset 0 1px 2px rgba(20,50,42,.10)}
[data-theme="dark"] .well{background:color-mix(in srgb,var(--card),#000 22%);border-color:color-mix(in srgb,var(--border),#000 18%);box-shadow:inset 0 1.5px 3px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.07)}
.well.was{font-size:14px;font-weight:700;color:var(--muted)}
.well.now{font-size:16px;font-weight:800;color:var(--text)}
.well.na{color:var(--muted);font-weight:600}

.dbox{height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--sig)}
.row.lv-none .dbox{color:var(--muted)}
/* T2 «гніздо-Δ» (ЗАЛОЧЕНО) */
.dbox{font-size:17px;font-weight:800;
  background:color-mix(in srgb,var(--sig) 14%,var(--card));
  border:1px solid color-mix(in srgb,var(--sig) 44%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1.5px 3px color-mix(in srgb,var(--sig) 20%,transparent)}
[data-theme="dark"] .dbox{
  background:color-mix(in srgb,var(--sig) 24%,var(--surface-3));
  border-color:color-mix(in srgb,var(--sig) 50%,transparent);
  box-shadow:inset 0 1.2px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.22)}
.row.lv-none .dbox{background:var(--surface-2);border-color:var(--border-subtle);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
[data-theme="dark"] .row.lv-none .dbox{background:var(--surface-3);border-color:var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.newbadge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:3px 6px;border-radius:7px;white-space:nowrap;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 16%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
[data-theme="dark"] .newbadge{background:color-mix(in srgb,var(--accent) 26%,var(--surface-3));border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-ink)}

/* ============ ПАНЕЛЬ ============ */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 24px rgba(0,0,0,.14);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:52dvh;display:flex;flex-direction:column}
[data-theme="dark"] .panel{background:var(--surface-2)}
.panel.folded{transform:translateY(calc(100% - 44px))}
.pbody{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
.panel .grip{display:flex;align-items:center;justify-content:space-between;height:24px;padding:10px 12px 6px;flex:0 0 auto;cursor:pointer;border-bottom:1px solid var(--border-subtle)}
.panel .grip .gt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.panel .grip .gc{font-size:14px;color:var(--muted);transition:transform .28s}
.panel.folded .grip .gc{transform:rotate(180deg)}
.prow{display:flex;gap:6px;margin-bottom:7px;align-items:center;flex-wrap:wrap}
.prow .plabel{font-size:11px;font-weight:700;color:var(--muted);width:66px;flex:0 0 66px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:2px;gap:2px;border:1px solid var(--border-subtle)}
[data-theme="dark"] .seg{background:var(--bg-soft);border-color:var(--border)}
.seg button{border:none;background:transparent;font-family:var(--font);font-size:12px;font-weight:700;color:var(--text-2);padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.copybtn{margin-left:auto;border:none;background:var(--accent);color:#fff;font-family:var(--font);font-weight:800;font-size:12px;padding:7px 14px;border-radius:9px;cursor:pointer}
.copyta{width:100%;margin-top:4px;font-family:monospace;font-size:10px;padding:5px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);display:none}
.copyta.show{display:block}
.slg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.slg label{display:flex;align-items:center;gap:8px}
.slg label>span{width:54px;flex:0 0 54px;font:700 10.5px/1 monospace;color:var(--muted)}
.slg input[type=range]{flex:1;height:20px;accent-color:var(--accent);min-width:0}
.slg .sv{width:28px;flex:0 0 28px;text-align:right;font:700 11px/1 monospace;color:var(--accent-ink)}
</style>
</head>
<body>

<div class="hdr">
  <div class="back">‹</div>
  <div style="flex:1">
    <div class="htitle">Динаміка залишків</div>
    <div class="hsub">Аптека №14 · Proxima 30841 · OTC B · IW C</div>
  </div>
</div>

<div class="scroll">
  <!-- ЄДИНА summary-картка: 3 інтегровані зони, нічого не висить на фоні -->
  <div class="sumcard">
    <div id="sumTop"></div>
    <div class="sum-div"></div>
    <div class="sum-fil">

  </div>
  <div id="list"></div>
</div>

<div class="panel" id="panel">
  <div class="grip" id="grip"><span class="gt">Harness · дім + назви ▾</span><span class="gc">▾</span></div>
  <div class="pbody">
  <div class="prow"><span class="plabel">Список</span><div class="seg" data-k="listLen"><button data-v="short">коротк.</button><button data-v="long">весь ~83</button></div></div>
  <div class="prow"><span class="plabel">Дім-scope</span><div class="seg" data-k="domescope"><button data-v="global">глоб.</button><button data-v="perbrand">per-brand</button></div><div class="seg" data-k="chSticky"><button data-v="off">sticky off</button><button data-v="on">sticky on</button></div></div>
  <div class="prow" style="align-items:flex-start"><span class="plabel">Дім ☀ світла</span><div class="slg" id="chLight">
    <label><span>Lbg</span><input type="range" min="0" max="45" step="1" data-var="Lbg"><b class="sv"></b></label>
    <label><span>Lbord</span><input type="range" min="0" max="100" step="1" data-var="Lbord"><b class="sv"></b></label>
    <label><span>Ldrop</span><input type="range" min="0" max="16" step="1" data-var="Ldrop"><b class="sv"></b></label>
  </div></div>
  <div class="prow" style="align-items:flex-start"><span class="plabel">Дім ☾ темна</span><div class="slg" id="chDark">
    <label><span>Dbg</span><input type="range" min="0" max="26" step="1" data-var="Dbg"><b class="sv"></b></label>
    <label><span>DbordC</span><input type="range" min="0" max="30" step="1" data-var="DbordC"><b class="sv"></b></label>
    <label><span>DridgeC</span><input type="range" min="0" max="30" step="1" data-var="DridgeC"><b class="sv"></b></label>
    <label><span>Ddip</span><input type="range" min="0" max="45" step="1" data-var="Ddip"><b class="sv"></b></label>
  </div></div>
  <div class="prow" style="align-items:flex-start"><span class="plabel">Дім геом.</span><div class="slg" id="chGeom">
    <label><span>chH</span><input type="range" min="22" max="44" step="1" data-var="chH"><b class="sv"></b></label>
    <label><span>chRad</span><input type="range" min="0" max="16" step="1" data-var="chRad"><b class="sv"></b></label>
  </div></div>
  <div class="prow"><span class="plabel">Тема</span><div class="seg" data-k="theme"><button data-v="light">☀ світла</button><button data-v="dark">☾ темна</button></div><button class="copybtn" id="copyBtn">📋 копі</button></div>
  <textarea class="copyta" id="copyTa" readonly></textarea>
  </div>
</div>

<script>
var MODE={ topmode:'A', tilemat:'raised', theme:'light', crossnorm:'warn', newmode:'new', sfilter:'all', cap:'on', vstate:'up', labels:'near',
  listLen:'short', chScope:'full', chSticky:'on', domescope:'global' };

/* ===== SVG ===== */
var UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
var DN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';
var EQ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14"/></svg>';
var TREND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>';
var TRENDDN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M17 17h4v-4"/></svg>';
var CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>';
var CRT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

/* ===== MOCK · РЕАЛЬНІ короткі назви (джерело §2 multibrand) · f/t/nF/nT синтез з edge-кейсами ===== */
var CATS=[
 { c:'OTC', tier:'OTC B', brands:[
   { b:'Стрепсілс', subgroups:[ { sub:null, items:[
     { n:'Інтенсив спрей', pk:'15 мл', f:0, t:2, nF:3, nT:3 },
     { n:'Плюс спрей', pk:'20 мл', f:3, t:1, nF:3, nT:3 },
     { n:'Інтенсив · мед-лимон', pk:'№16', f:8, t:8, nF:8, nT:8 },
     { n:'Плюс', pk:'№16', f:4, t:0, nF:4, nT:4 },
     { n:'Ментол-евкаліпт', pk:'№24', f:2, t:5, nF:6, nT:6 },
     { n:'Вітамін C', pk:'№24', f:7, t:4, nF:5, nT:5 },
     { n:'Мед-лимон', pk:'№24', f:6, t:6, nF:6, nT:6 },
     { n:'Лимон · б/цукру', pk:'№16', f:2, t:null, nF:3, nT:3 },
     { n:'Полуниця · для дітей', pk:'№24', f:null, t:3, nF:3, nT:3 },
     { n:'Оригінальний', pk:'№24', f:1, t:3, nF:3, nT:3 },
     { n:'Інтенсив · апельсин, б/цукру', pk:'№16', f:2, t:2, nF:2, nT:2 }
   ] } ] },
   { b:'Нурофен', subgroups:[
     { sub:'Таблетки / капсули', items:[
       { n:'Експрес Ультракап', fd:'капс.', pk:'№10', f:3, t:3, nF:3, nT:3 },
       { n:'Експрес Форте', fd:'капс.', pk:'№10', f:4, t:1, nF:4, nT:3 },
       { n:'Форте', fd:'таб. 400 мг', pk:'№12', f:8, t:8, nF:8, nT:8 },
       { n:'Форте', fd:'таб. 400 мг', pk:'№24', f:6, t:4, nF:6, nT:6 },
       { n:'', fd:'таб. 200 мг', pk:'№12', f:6, t:6, nF:6, nT:6 },
       { n:'Інтенсив', fd:'таб.', pk:'№6', f:null, t:2, nF:2, nT:2 }
     ] },
     { sub:'Суспензія', items:[
       { n:'Форте · 100 мл', fd:'4%', pk:'полуниця', f:8, t:3, nF:8, nT:8 },
       { n:'100 мл', pk:'полуниця', f:6, t:6, nF:6, nT:6 },
       { n:'Супозиторії', pk:'№10', f:2, t:null, nF:2, nT:2 }
     ] }
   ] },
   { b:'Гавіскон', subgroups:[ { sub:null, items:[
     { n:'Подвійної дії', pk:'№24', f:3, t:3, nF:3, nT:3 },
     { n:'М\u2019ятна суспензія', pk:'150 мл', f:2, t:0, nF:2, nT:2 },
     { n:'Форте м\u2019ятна саше', pk:'№20', f:2, t:1, nF:2, nT:2 }
   ] } ] }
 ]},
 { c:'IW', tier:'IW C', brands:[
   { b:'Durex', subgroups:[ { sub:null, items:[
     { n:'Invisible', pk:'№12', f:3, t:2, nF:4, nT:2 },
     { n:'Classic', pk:'№3', f:0, t:1, nF:3, nT:3 },
     { n:'Real Feel', pk:'№12', f:5, t:2, nF:4, nT:4 }
   ] } ] },
   { b:'Contex', subgroups:[ { sub:null, items:[
     { n:'Classic', pk:'№12', f:4, t:3, nF:3, nT:3 },
     { n:'Long Love', pk:'№3', f:2, t:2, nF:3, nT:3 }
   ] } ] },
   { b:'Evitest / Eviplan', subgroups:[ { sub:null, items:[
     { n:'Evitest №1', pk:'', f:6, t:5, nF:6, nT:6 },
     { n:'Eviplan 5+1', pk:'', f:null, t:3, nF:3, nT:3 }
   ] } ] }
 ]}
];

/* ===== ДОВГИЙ СПИСОК (інфляція ×4 → форсить overflow: sticky-дім тепер тестовний) ===== */
function buildLong(){
  return CATS.map(function(cat){
    return { c:cat.c, tier:cat.tier, brands:cat.brands.map(function(br){
      return { b:br.b, subgroups:br.subgroups.map(function(sg){
        var out=[];
        sg.items.forEach(function(it){
          out.push(it);
          for(var k=2;k<=4;k++){
            var nf=(it.f===null)?null:Math.max(0,it.f+((k%2)?1:-1)*(k-1));
            var nt=(it.t===null)?null:Math.max(0,it.t+((k%2)?-1:1)*(k-1));
            out.push({n:it.n,fd:it.fd,pk:it.pk,f:nf,t:nt,nF:it.nF,nT:it.nT});
          }
        });
        return {sub:sg.sub,items:out};
      })};
    })};
  });
}
var LONG=buildLong();
function DATA(){ return MODE.listLen==='long'?LONG:CATS; }

/* ===== ЛОГІКА (ЗАЛОЧЕНО) ===== */
function moveLevel(f,t,nF,nT){
  var absF=(f===null),absT=(t===null);
  if(absF||absT)return'na';
  if(f===t)return'still';
  if(t===0)return'crit';
  var dF=Math.abs(f-nF),dT=Math.abs(t-nT);
  if(dT<dF)return'closer';
  if(dT>dF)return(t<nT&&dT>=nT)?'crit':'farther';
  return MODE.crossnorm==='warn'?'farther':'still';
}
function lvClass(lv){ return lv==='closer'?'lv-ok':lv==='farther'?'lv-low':lv==='crit'?'lv-crit':'lv-none'; }
function sign(d){ return d>0?'+'+d:''+d; }
function passFilter(lv){
  if(MODE.sfilter==='all')return true;
  if(MODE.sfilter==='moved')return lv!=='still';
  return lv==='farther'||lv==='crit';
}
function fmt(v){ return v===null?'—':(''+v); }

function dynHTML(it,lv){
  var absF=(it.f===null),absT=(it.t===null);
  var was='<div class="well was'+(absF?' na':'')+'">'+fmt(it.f)+'</div>';
  var now='<div class="well now'+(absT?' na':'')+'">'+fmt(it.t)+'</div>';
  var dcell;
  if(absF&&!absT){ dcell=MODE.newmode==='new'?'<span class="newbadge">новий</span>':'<div class="dbox"></div>'; }
  else if(absT){ dcell='<div class="dbox"></div>'; }
  else { var d=it.t-it.f; dcell='<div class="dbox">'+((lv==='still')?'0':sign(d))+'</div>'; }
  return '<div class="dyn">'+was+now+dcell+'</div>';
}
function rowHTML(it){
  var lv=moveLevel(it.f,it.t,it.nF,it.nT);
  var normNote=(it.nF!==it.nT)?'<span class="normchg">MSL '+it.nF+'→'+it.nT+'</span>':'MSL <span class="nm">'+it.nT+'</span>';
  var nameMain=it.n||it.fd||'';
  var fdSuf=(it.n&&it.fd)?'<span class="rfd">'+it.fd+'</span>':'';
  var pkChip=it.pk?'<span class="rpk">'+it.pk+'</span>':'';
  var tag=(fdSuf||pkChip)?'<span class="rn-tag">'+fdSuf+pkChip+'</span>':'';
  return '<div class="row '+lvClass(lv)+'">'+
    '<div class="info"><div class="rn"><span class="rv">'+nameMain+'</span>'+tag+'</div>'+
    '<div class="rm">'+normNote+'</div></div>'+dynHTML(it,lv)+'</div>';
}

/* ===== ВЕРДИКТ tally ===== */
function tally(){
  var b=0,w=0,s=0;
  DATA().forEach(function(cat){cat.brands.forEach(function(br){br.subgroups.forEach(function(sg){sg.items.forEach(function(it){
    var lv=moveLevel(it.f,it.t,it.nF,it.nT);
    if(lv==='closer')b++; else if(lv==='farther'||lv==='crit')w++; else if(lv==='still')s++;
  });});});});
  return {b:b,w:w,s:s};
}

/* ===== SUMMARY-ВЕРХІВКА (2 композиції) ===== */
function tileHTML(cls,svg,n,label){
  return '<div class="tile '+cls+'"><div class="ti-top"><span class="ti-ic">'+svg+'</span><span class="ti-n">'+n+'</span></div><span class="ti-l">'+label+'</span></div>';
}
function tallyHTML(v){
  var L=MODE.labels==='norm'?['до норми','від норми','без змін']:['ближче','далі','без змін'];
  return '<div class="tally">'+tileHTML('better',UP,v.b,L[0])+tileHTML('worse',DN,v.w,L[1])+tileHTML('same',EQ,v.s,L[2])+'</div>';
}
function stHeadHTML(wcls,word,cap){
  var ico=wcls==='up'?TREND:wcls==='down'?TRENDDN:EQ;
  var capH=cap?'<span class="st-cap">відносно MSL</span>':'';
  return '<div class="st-head '+wcls+'"><span class="st-ico">'+ico+'</span><div class="st-txt"><span class="st-word">'+word+'</span>'+capH+'</div></div>';
}
function dcolHTML(){ return '<div class="dcol" role="button" aria-label="Період"><span class="dc-crt">'+CRT+'</span><span class="dc-ic">'+CAL+'</span><span class="dc-d">18.06</span><span class="dc-s">—</span><span class="dc-d">02.07</span></div>'; }
function dpillHTML(){ return '<button class="dpill" aria-label="Період"><span class="dp-ic">'+CAL+'</span><span>18.06–02.07</span><span class="dp-c">'+CRT+'</span></button>'; }

function renderSummaryTop(){
  var v=tally();
  var wcls=MODE.vstate, word=wcls==='up'?'Покращилось':wcls==='down'?'Погіршилось':'Без змін';
  var cap=(MODE.cap==='on');
  var html;
  if(MODE.topmode==='B'){
    html='<div class="sum-top mode-b"><div class="st-col">'+stHeadHTML(wcls,word,cap)+tallyHTML(v)+'</div>'+dcolHTML()+'</div>';
  }else{
    html='<div class="sum-top mode-a"><div class="st-line">'+stHeadHTML(wcls,word,cap)+dpillHTML()+'</div>'+tallyHTML(v)+'</div>';
  }
  document.getElementById('sumTop').innerHTML=html;
}

/* ===== КОЛОНК-ХЕДЕР ===== */
function colheadHTML(){
  return '<div class="colhead"><div class="spacer"><span class="ch-lbl">SKU</span></div><div class="hcols"><div class="hc">18.06</div><div class="hc">02.07</div><div class="hc hd">ЗМІНА</div></div></div>';
}
function gdomeHTML(){   /* G: один глобальний дім зверху списку */
  return '<div class="gdome"><div class="spacer"><span class="ch-lbl">SKU</span></div><div class="hcols"><div class="hc">18.06</div><div class="hc">02.07</div><div class="hc hd">ЗМІНА</div></div></div>';
}

/* ===== СПИСОК ===== */
function applyChrome(){
  document.documentElement.setAttribute('data-theme',MODE.theme);
  document.body.setAttribute('data-tilemat',MODE.tilemat);
  document.body.setAttribute('data-chscope',MODE.chScope);
  document.body.setAttribute('data-chsticky',MODE.chSticky);
  document.body.setAttribute('data-domescope',MODE.domescope);
  var meta=document.getElementById('metaTheme'); if(meta)meta.setAttribute('content',MODE.theme==='dark'?'#0d1512':'#eef3f1');
}
function renderList(){
  applyChrome();
  var html=gdomeHTML();   /* G-дім завжди в DOM; ховається CSS-ом у scope=perbrand */
  DATA().forEach(function(cat){
    html+='<div class="cat-div">'+cat.c+' <span class="cat-tier">· '+cat.tier+'</span></div>';
    cat.brands.forEach(function(br){
      var visSubs=br.subgroups.map(function(sg){
        return { sub:sg.sub, items:sg.items.filter(function(it){ return passFilter(moveLevel(it.f,it.t,it.nF,it.nT)); }) };
      }).filter(function(sg){ return sg.items.length; });
      if(!visSubs.length) return;
      var total=visSubs.reduce(function(a,sg){return a+sg.items.length;},0);
      html+='<div class="brand"><div class="bhdr"><span class="arr">▾</span><span class="bnm">'+br.b+'</span><span class="bcnt">'+total+'</span></div>'+colheadHTML()+'<div class="bwrap"><div class="bbody">';
      visSubs.forEach(function(sg){
        if(sg.sub) html+='<div class="ebrow"><span class="eb">'+sg.sub+'</span><span class="cnt">'+sg.items.length+'</span></div>';
        html+='<div class="rows">';
        sg.items.forEach(function(it){ html+=rowHTML(it); });
        html+='</div>';
      });
      html+='</div></div></div>';
    });
  });
  document.getElementById('list').innerHTML=html;
  document.querySelectorAll('.bhdr').forEach(function(h){ h.onclick=function(){ h.parentElement.classList.toggle('collapsed'); }; });
}

/* ===== СЕГМЕНТ THUMB (A54 — persist DOM) ===== */
function placeThumb(snap){
  var seg=document.getElementById('sfilter'), t=seg.querySelector('.sf-thumb'), act=seg.querySelector('button.on');
  if(!t||!act){ if(t)t.style.opacity='0'; return; }
  var sr=seg.getBoundingClientRect(), r=act.getBoundingClientRect();
  if(r.width===0){ t.style.opacity='0'; return; }
  var apply=function(){ t.style.width=r.width+'px'; t.style.transform='translateX('+(r.left-sr.left-3)+'px)'; t.style.opacity='1'; };
  if(snap){ t.classList.add('no-anim'); apply(); requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.remove('no-anim');});}); }
  else apply();
}
function setFilter(f){
  MODE.sfilter=f;
  document.querySelectorAll('.sfilter button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-f')===f); });
  placeThumb(false);
  renderList();
}

/* ===== ПАНЕЛЬ ===== */
function syncSegs(){
  document.querySelectorAll('.panel .seg').forEach(function(seg){
    var k=seg.getAttribute('data-k');
    seg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===MODE[k]); });
  });
}
document.querySelectorAll('.sfilter button').forEach(function(b){ b.onclick=function(){ setFilter(b.getAttribute('data-f')); }; });
document.querySelector('.sfilter button[data-f="all"]').classList.add('on');

document.querySelectorAll('.panel .seg').forEach(function(seg){
  var k=seg.getAttribute('data-k');
  seg.querySelectorAll('button').forEach(function(b){ b.onclick=function(){
    MODE[k]=b.getAttribute('data-v'); syncSegs();
    if(k==='tilemat'){ applyChrome(); return; }
    renderSummaryTop();
    if(k==='theme'){ applyChrome(); renderList(); }
    else if(k==='listLen'){ renderList(); }
    else if(k==='chScope'||k==='chSticky'||k==='domescope'){ applyChrome(); }
    requestAnimationFrame(function(){ placeThumb(true); });
  }; });
});
document.getElementById('grip').onclick=function(){ document.getElementById('panel').classList.toggle('folded'); };
/* ===== BENCH матеріалу плиток (dark) ===== */
var MAT={Dlift:10,Dridge:16,Dgrane:12,Dbord:7};
function applyMat(){
  for(var k in MAT){ document.documentElement.style.setProperty('--'+k,MAT[k]); }
  document.querySelectorAll('#matSl input').forEach(function(inp){
    var v=inp.getAttribute('data-var'); inp.value=MAT[v];
    inp.parentElement.querySelector('.sv').textContent=MAT[v];
  });
}
document.querySelectorAll('#matSl input').forEach(function(inp){
  inp.addEventListener('input',function(){
    var v=inp.getAttribute('data-var'); MAT[v]=+inp.value;
    document.documentElement.style.setProperty('--'+v,inp.value);
    inp.parentElement.querySelector('.sv').textContent=inp.value;
  });
});
/* ===== BENCH colhead-ДОМУ (LIGHT + DARK окремо + геом.) ===== */
var CH={Lbg:20,Lbord:70,Ldrop:7,Dbg:12,DbordC:10,DridgeC:14,Ddip:28,chH:25,chRad:6};   /* DEVICE-LOCK Konst 19.07 */
function applyCH(){
  for(var k in CH){ document.documentElement.style.setProperty('--'+k,CH[k]); }
  document.querySelectorAll('#chLight input,#chDark input,#chGeom input').forEach(function(inp){
    var v=inp.getAttribute('data-var'); inp.value=CH[v]; inp.parentElement.querySelector('.sv').textContent=CH[v];
  });
}
document.querySelectorAll('#chLight input,#chDark input,#chGeom input').forEach(function(inp){
  inp.addEventListener('input',function(){
    var v=inp.getAttribute('data-var'); CH[v]=+inp.value;
    document.documentElement.style.setProperty('--'+v,inp.value);
    inp.parentElement.querySelector('.sv').textContent=inp.value;
  });
});
document.getElementById('copyBtn').onclick=function(){
  var s='domescope='+MODE.domescope+' · chScope='+MODE.chScope+' chSticky='+MODE.chSticky+' · listLen='+MODE.listLen+' · theme='+MODE.theme+
        ' || ДІМ☀ Lbg='+CH.Lbg+' Lbord='+CH.Lbord+' Ldrop='+CH.Ldrop+
        ' · ДІМ☾ Dbg='+CH.Dbg+' DbordC='+CH.DbordC+' DridgeC='+CH.DridgeC+' Ddip='+CH.Ddip+
        ' · геом chH='+CH.chH+' chRad='+CH.chRad+
        ' || плитки Dlift='+MAT.Dlift+' Dridge='+MAT.Dridge+' Dgrane='+MAT.Dgrane+' Dbord='+MAT.Dbord;
  var ta=document.getElementById('copyTa'); ta.value=s; ta.classList.add('show');
  try{ navigator.clipboard.writeText(s); }catch(e){} ta.select();
};

/* init */
applyChrome(); applyMat(); applyCH(); syncSegs(); renderSummaryTop(); renderList();
requestAnimationFrame(function(){ placeThumb(true); });
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){ placeThumb(true); }); }
window.addEventListener('resize',function(){ requestAnimationFrame(function(){ placeThumb(true); }); });
</script>
