<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef3f1" id="metaTheme">
<title>Фармастор · Динаміка HARNESS v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== ФАРМАСТОР Динаміка HARNESS v3 — гібрид well+Δ · персист. сегмент+thumb (A54) ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mutL:46;
  --seg-dur:500ms; --seg-ease:cubic-bezier(.34,1.80,.64,1);
  --bg:#eef3f1; --bg-soft:#e4ece9; --card:#ffffff; --surface-2:#f4f8f6; --surface-3:#eef4f1;
  --text:#182c28; --text-2:#3c574f; --muted:#6b8c84; --border:#d4e5df; --border-subtle:#e1ebe7;
  --ok:#1f9d57; --crit:#c0392b; --warn:#c8811b;
  --accent:hsl(162 82% 27%); --accent-soft:hsl(162 64% 88%); --accent-ink:hsl(162 82% 16%);
  --cardBg:var(--card); --counterFill:55; --ebInk:10; --rowGap:6;
  --colW:38px; --colD:50px; --colGap:6px;
}
[data-theme="dark"]{
  --bg:#0d1512; --bg-soft:#151e1a; --card:#18221e; --surface-2:#1c2723; --surface-3:#212d28;
  --text:#e8f0ec; --text-2:#a7c0b8; --muted:#7c968d; --border:#2a3833; --border-subtle:#222e29;
  --ok:#33c06f; --crit:#e0685c; --warn:#e0a94a;
  --accent:hsl(163 46% 46%); --accent-soft:hsl(163 37% 17%); --accent-ink:hsl(163 46% 68%);
}

body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

.hdr{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;background:var(--bg);position:sticky;top:0;z-index:30}
.hdr .back{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#fff 55%,var(--bg));border:1px solid rgba(20,50,42,.12);color:var(--accent);font-size:18px}
[data-theme="dark"] .hdr .back{background:color-mix(in srgb,#fff 6%,var(--surface-3));border-color:rgba(255,255,255,.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.096)}
.hdr .htitle{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hdr .hsub{font-size:12px;color:var(--muted);font-weight:600}

.scroll{flex:1;overflow-y:auto;padding-bottom:150px}

/* ==== VERDICT ==== */
.vhdr{margin:2px 12px 4px;background:var(--cardBg);border-radius:16px;padding:12px 14px;border:1px solid var(--border-subtle);box-shadow:0 1px 3px rgba(20,50,42,.06)}
[data-theme="dark"] .vhdr{border-color:var(--border);box-shadow:none;background:color-mix(in srgb,#fff 4%,var(--surface-2))}
.vhdr .vword{font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.vhdr .vword .vlabel{color:var(--muted);font-weight:600;font-size:12.5px}
.vhdr .vword.up .vval{color:var(--accent)} .vhdr .vword.down .vval{color:var(--warn)} .vhdr .vword.flat .vval{color:var(--muted)}
.vhdr .vcounts{display:flex;gap:14px;margin-top:9px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.vhdr .vc{display:inline-flex;align-items:center;gap:5px;color:var(--text-2)}
.vhdr .vc .vn{font-weight:800}
.vhdr .vc.better .vn{color:var(--accent)} .vhdr .vc.worse .vn{color:var(--warn)} .vhdr .vc.same .vn{color:var(--muted)}
.vhdr .vc svg{width:13px;height:13px}

/* ==== from→to band ==== */
.fromto{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 12px 9px;font-size:13px;font-weight:700;color:var(--text-2)}
.fromto .dt{padding:5px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border-subtle);font-variant-numeric:tabular-nums}
[data-theme="dark"] .fromto .dt{background:var(--surface-3);border-color:var(--border)}
.fromto .ar{color:var(--muted);font-size:15px} .fromto .cv{color:var(--muted);font-size:11px}

/* ==== СТАТУС-ФІЛЬТР — персист. сегмент + ковзний thumb (A54, well-трек) ==== */
.sfilter{display:flex;gap:0;margin:0 12px 12px;padding:3px;border-radius:12px;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--bg-soft) 82%,var(--card));
  box-shadow:inset 0 1px 2px rgba(20,50,42,.15);border:1px solid var(--border-subtle)}          /* світла: inset-well (deboss), не плоска вирізка */
[data-theme="dark"] .sfilter{background:color-mix(in srgb,var(--card),#000 20%);border-color:color-mix(in srgb,var(--border),#000 16%);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.08)}                /* темна: dip+ridge */
.sfilter button{flex:1;border:none;background:transparent;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text-2);
  padding:8px 4px;border-radius:9px;cursor:pointer;position:relative;z-index:1;transition:color .15s}
.sfilter button.on{color:#fff}
.sf-thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;z-index:0;opacity:0;pointer-events:none;
  background:var(--accent);box-shadow:0 1px 3px -1px color-mix(in srgb,var(--accent) 40%,transparent);
  transition:transform var(--seg-dur) var(--seg-ease),width var(--seg-dur) var(--seg-ease)}
[data-theme="dark"] .sf-thumb{background:linear-gradient(180deg,hsl(163 55% 34%),hsl(163 55% 30%))}
.sf-thumb.no-anim{transition:none}
@media(prefers-reduced-motion:reduce){.sf-thumb{transition:none}}

/* ============ РЕЮЗ FILL-акордеона ============ */
.cat-div{display:flex;align-items:center;gap:8px;margin:16px 16px 2px;font:800 12px/1 var(--font);letter-spacing:.5px;text-transform:uppercase;color:var(--text-2)}
.cat-div:first-child{margin-top:6px}
.cat-div .cat-tier{font:700 11px/1 var(--font);color:var(--muted);letter-spacing:.2px;text-transform:none}

.brand{margin:8px 12px 0;background:var(--cardBg);border-radius:16px;position:relative;border:1px solid var(--border-subtle);box-shadow:0 1px 3px rgba(20,50,42,.05)}
[data-theme="dark"] .brand{border-color:var(--border);box-shadow:none;background:color-mix(in srgb,#fff 3%,var(--surface-2))}
.bhdr{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;cursor:pointer}
.bhdr .arr{font-size:13px;color:var(--accent);width:14px;flex:0 0 14px;transition:transform .2s}
.brand.collapsed .bhdr .arr{transform:rotate(-90deg)}
.bhdr .bnm{font-size:15px;font-weight:800;color:var(--text);flex:1;letter-spacing:-.2px}
.bhdr .bcnt{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 9px;border-radius:9px;font:700 12px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text-2);background:color-mix(in srgb,var(--surface-2) calc(var(--counterFill)*1%),var(--card));border:1px solid var(--border-subtle)}
[data-theme="dark"] .bhdr .bcnt{background:color-mix(in srgb,var(--surface-3) calc(var(--counterFill)*1%),var(--card));border-color:var(--border)}
.bwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
.brand.collapsed .bwrap{grid-template-rows:0fr}
.bbody{overflow:hidden;min-height:0}

/* колонк-хедер — дати ×11px */
.colhead{display:flex;align-items:flex-end;padding:2px 14px 7px}
.colhead .spacer{flex:1}
.colhead .hcols{display:grid;grid-template-columns:var(--colW) var(--colW) var(--colD);gap:var(--colGap)}
.colhead .hc{font:800 11px/1 var(--font);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.colhead .hc.hd{color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-size:9.5px}

/* eyebrow (sticky) */
.ebrow{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 6px;background:var(--cardBg);border-top:2px solid var(--border-subtle);margin:0 7px;position:sticky;top:0;z-index:5}
[data-theme="dark"] .ebrow{border-top-color:var(--border);background:color-mix(in srgb,#fff 3%,var(--surface-2))}
.ebrow .eb{position:relative;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.2px;color:color-mix(in srgb,var(--accent) calc(var(--ebInk)*1%),var(--text-2));padding-left:11px}
.ebrow .eb::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:3px;background:var(--accent)}
.ebrow .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 8px;border-radius:9px;font:700 11px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text-2);background:color-mix(in srgb,var(--surface-2) calc(var(--counterFill)*1%),var(--card));border:1px solid var(--border-subtle)}
[data-theme="dark"] .ebrow .cnt{background:color-mix(in srgb,var(--surface-3) calc(var(--counterFill)*1%),var(--card));border-color:var(--border)}

.rows{padding:0 6px 6px}
.row{display:flex;align-items:center;gap:10px;padding:11px 8px;position:relative;margin-bottom:calc(var(--rowGap)*1px)}
.row+.row::before{content:'';position:absolute;top:calc(var(--rowGap)*-.5px - .5px);left:8px;right:8px;height:1px;background:var(--border-subtle)}
.row .info{flex:1;min-width:0}
.row .rn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.2;min-width:0}
.row .rv{font-size:14px;font-weight:700;letter-spacing:-.1px;overflow-wrap:break-word;min-width:0;color:var(--text)}
.rn-tag{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap;flex:0 0 auto}
.row .rpk{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;flex:0 0 auto;padding:1.5px 7px;border-radius:7px;color:var(--text);background:var(--surface-2);border:1px solid var(--border-subtle)}
[data-theme="dark"] .row .rpk{background:var(--surface-3);border-color:var(--border)}
.row .rm{font-size:11.5px;margin-top:3px;font-weight:500;color:color-mix(in srgb,var(--muted) calc(var(--mutL)*1%),var(--text-2))}
.row .rm .nm{color:var(--text-2);font-weight:700}
.row .rm .normchg{color:var(--warn);font-weight:700}
.row.lv-crit{--sig:var(--crit)} .row.lv-low{--sig:var(--warn)} .row.lv-ok{--sig:var(--accent)} .row.lv-none{--sig:var(--muted)}

.dyn{display:grid;grid-template-columns:var(--colW) var(--colW) var(--colD);gap:var(--colGap);align-items:center;flex:0 0 auto}

/* gнізда залишку — нейтральний інсет-well */
.well{height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--bg-soft) 68%,var(--card));border:1px solid var(--border-subtle);box-shadow:inset 0 1px 2px rgba(20,50,42,.10)}
[data-theme="dark"] .well{background:color-mix(in srgb,var(--card),#000 22%);border-color:color-mix(in srgb,var(--border),#000 18%);box-shadow:inset 0 1.5px 3px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.07)}
.well.was{font-size:14px;font-weight:700;color:var(--muted)}
.well.now{font-size:16px;font-weight:800;color:var(--text)}
.well.na{color:var(--muted);font-weight:600}

/* Δ-герой — окремий матеріал (різниця) */
.dbox{height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--sig)}
.row.lv-none .dbox{color:var(--muted)}

/* T2 «гніздо-Δ» — тоноване кольором + ПІДНЯТЕ (об'ємне на обох темах) */
body[data-dtreat="T2"] .dbox{font-size:17px;font-weight:800;
  background:color-mix(in srgb,var(--sig) 14%,var(--card));
  border:1px solid color-mix(in srgb,var(--sig) 44%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1.5px 3px color-mix(in srgb,var(--sig) 20%,transparent)}   /* світла: топ-глянець + drop */
[data-theme="dark"] body[data-dtreat="T2"] .dbox{
  background:color-mix(in srgb,var(--sig) 24%,var(--surface-3));
  border-color:color-mix(in srgb,var(--sig) 50%,transparent);
  box-shadow:inset 0 1.2px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.22)}   /* темна A66.1: top-ridge emboss + нижня грань + drop */
body[data-dtreat="T2"] .row.lv-none .dbox{background:var(--surface-2);border-color:var(--border-subtle);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
[data-theme="dark"] body[data-dtreat="T2"] .row.lv-none .dbox{background:var(--surface-3);border-color:var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* T1 «чіп+» */
body[data-dtreat="T1"] .dbox{font-size:14px;font-weight:800;height:auto;padding:6px 4px;border-radius:9px;background:var(--cardBg);border:1px solid color-mix(in srgb,var(--sig) 55%,transparent)}
body[data-dtreat="T1"] .row.lv-none .dbox{border-color:var(--border-subtle)}

/* T3 «голе число» */
body[data-dtreat="T3"] .dbox{font-size:20px;font-weight:800;letter-spacing:-.5px;background:none;border:none;box-shadow:none}

.newbadge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:3px 6px;border-radius:7px;white-space:nowrap;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 16%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
[data-theme="dark"] .newbadge{background:color-mix(in srgb,var(--accent) 26%,var(--surface-3));border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-ink)}

/* ============ ПАНЕЛЬ ============ */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 24px rgba(0,0,0,.14);padding:10px 12px calc(10px + env(safe-area-inset-bottom));transition:transform .28s cubic-bezier(.32,.72,0,1)}
[data-theme="dark"] .panel{background:var(--surface-2)}
.panel.folded{transform:translateY(calc(100% - 42px))}
.panel .grip{display:flex;align-items:center;justify-content:space-between;height:22px;margin-bottom:8px;cursor:pointer}
.panel .grip .gt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.panel .grip .gc{font-size:14px;color:var(--muted);transition:transform .28s}
.panel.folded .grip .gc{transform:rotate(180deg)}
.prow{display:flex;gap:6px;margin-bottom:7px;align-items:center;flex-wrap:wrap}
.prow .plabel{font-size:11px;font-weight:700;color:var(--muted);width:66px;flex:0 0 66px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:2px;gap:2px;border:1px solid var(--border-subtle)}
[data-theme="dark"] .seg{background:var(--bg-soft);border-color:var(--border)}
.seg button{border:none;background:transparent;font-family:var(--font);font-size:12px;font-weight:700;color:var(--text-2);padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.copybtn{margin-left:auto;border:none;background:var(--accent);color:#fff;font-family:var(--font);font-weight:800;font-size:12px;padding:7px 14px;border-radius:9px;cursor:pointer}
.copyta{width:100%;margin-top:4px;font-family:monospace;font-size:10px;padding:5px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);display:none}
.copyta.show{display:block}
</style>
</head>
<body>

<div class="hdr">
  <div class="back">‹</div>
  <div style="flex:1">
    <div class="htitle">Динаміка залишків</div>
    <div class="hsub">Аптека №14 · Proxima 30841 · OTC B · IW C</div>
  </div>
</div>

<div class="scroll">
  <div id="verdict"></div>
  <div class="fromto"><span class="dt">18 черв.</span><span class="ar">→</span><span class="dt">2 лип.</span><span class="cv">(остан. 2)</span></div>
  <!-- ПЕРСИСТЕНТНИЙ сегмент (thumb не перебудовується) -->
  <div class="sfilter" id="sfilter">
    <span class="sf-thumb" aria-hidden="true"></span>
    <button data-f="all">Усі</button>
    <button data-f="moved">Змінилось</button>
    <button data-f="problem">Проблемні</button>
  </div>
  <div id="list"></div>
</div>

<div class="panel" id="panel">
  <div class="grip" id="grip"><span class="gt">Harness — керування</span><span class="gc">▾</span></div>
  <div class="prow"><span class="plabel">Δ-вигляд</span><div class="seg" data-k="dtreat"><button data-v="T1">T1 чіп+</button><button data-v="T2">T2 гніздо</button><button data-v="T3">T3 голе</button></div></div>
  <div class="prow"><span class="plabel">Підписи</span><div class="seg" data-k="labels"><button data-v="dates">дати</button><button data-v="words">слова</button></div></div>
  <div class="prow"><span class="plabel">Тема</span><div class="seg" data-k="theme"><button data-v="light">☀ світла</button><button data-v="dark">☾ темна</button></div><button class="copybtn" id="copyBtn">📋 копі</button></div>
  <div class="prow"><span class="plabel">Перетин норми</span><div class="seg" data-k="crossnorm"><button data-v="warn">warn</button><button data-v="still">still</button></div></div>
  <div class="prow"><span class="plabel">absent→є</span><div class="seg" data-k="newmode"><button data-v="new">«новий»</button><button data-v="dash">порожньо</button></div></div>
  <textarea class="copyta" id="copyTa" readonly></textarea>
</div>

<script>
var MODE={ dtreat:'T2', labels:'dates', theme:'light', crossnorm:'warn', newmode:'new', sfilter:'all' };

/* ===== MOCK: бренд → subgroups[] → items[] ===== */
var CATS=[
 { c:'OTC', tier:'OTC B', brands:[
   { b:'Стрепсілс', subgroups:[ { sub:null, items:[
     { n:'Стрепсілс Інтенсив спрей, фл. 15 мл', pk:'фл.15мл', f:0, t:2, nF:3, nT:3 },
     { n:'Стрепсілс Плюс №16', pk:'№16', f:3, t:1, nF:3, nT:3 },
     { n:'Стрепсілс з ментолом та евкаліптом №24', pk:'№24', f:2, t:0, nF:3, nT:3 },
     { n:'Стрепсілс з медом та лимоном №24', pk:'№24', f:5, t:1, nF:3, nT:3 },  /* ПЕРЕТИН норми (5→1, дист.2=2) — видно warn/still угорі */
     { n:'Стрепсілс з вітаміном С №24', pk:'№24', f:7, t:4, nF:3, nT:3 },
     { n:'Стрепсілс оригінальний №24', pk:'№24', f:1, t:3, nF:3, nT:3 },
     { n:'Стрепсілс без цукру з лимоном №16', pk:'№16', f:2, t:2, nF:2, nT:2 }  /* still */
   ] } ] },
   { b:'Нурофен', subgroups:[
     { sub:'Таблетки / капсули', items:[
       { n:'Нурофен Експрес капсули №16', pk:'№16', f:5, t:1, nF:3, nT:3 },
       { n:'Нурофен таблетки №24', pk:'№24', f:4, t:null, nF:3, nT:3 },
       { n:'Нурофен форте №12', pk:'№12', f:null, t:3, nF:3, nT:3 }
     ] },
     { sub:'Суспензія', items:[
       { n:'Нурофен для дітей суспензія полуниця, фл. 100 мл', pk:'100мл', f:6, t:5, nF:4, nT:4 }
     ] }
   ] }
 ]},
 { c:'IW', tier:'IW C', brands:[
   { b:'Durex', subgroups:[ { sub:null, items:[
     { n:'Durex Invisible №12', pk:'№12', f:3, t:2, nF:4, nT:2 },
     { n:'Durex Classic №3', pk:'№3', f:0, t:1, nF:3, nT:3 }
   ] } ] }
 ]}
];

/* ===== ЛОГІКА ===== */
function moveLevel(f,t,nF,nT){
  var absF=(f===null),absT=(t===null);
  if(absF||absT)return'na';
  if(f===t)return'still';
  if(t===0)return'crit';
  var dF=Math.abs(f-nF),dT=Math.abs(t-nT);
  if(dT<dF)return'closer';
  if(dT>dF)return(t<nT&&dT>=nT)?'crit':'farther';
  return MODE.crossnorm==='warn'?'farther':'still';
}
function lvClass(lv){ return lv==='closer'?'lv-ok':lv==='farther'?'lv-low':lv==='crit'?'lv-crit':'lv-none'; }
function sign(d){ return d>0?'+'+d:''+d; }
function passFilter(lv){
  if(MODE.sfilter==='all')return true;
  if(MODE.sfilter==='moved')return lv!=='still';
  return lv==='farther'||lv==='crit';
}
function fmt(v){ return v===null?'—':(''+v); }

/* ===== РЕНДЕР ПРАВОЇ ЧАСТИНИ ===== */
function dynHTML(it,lv){
  var absF=(it.f===null),absT=(it.t===null);
  var was='<div class="well was'+(absF?' na':'')+'">'+fmt(it.f)+'</div>';
  var now='<div class="well now'+(absT?' na':'')+'">'+fmt(it.t)+'</div>';
  var dcell;
  if(absF&&!absT){ dcell=MODE.newmode==='new'?'<span class="newbadge">новий</span>':'<div class="dbox"></div>'; }
  else if(absT){ dcell='<div class="dbox"></div>'; }
  else { var d=it.t-it.f; dcell='<div class="dbox">'+((lv==='still')?'0':sign(d))+'</div>'; }
  return '<div class="dyn">'+was+now+dcell+'</div>';
}
function rowHTML(it){
  var lv=moveLevel(it.f,it.t,it.nF,it.nT);
  var normNote=(it.nF!==it.nT)?'<span class="normchg">MSL '+it.nF+'→'+it.nT+'</span>':'MSL <span class="nm">'+it.nT+'</span>';
  return '<div class="row '+lvClass(lv)+'">'+
    '<div class="info"><div class="rn"><span class="rv">'+it.n+'</span><span class="rn-tag"><span class="rpk">'+it.pk+'</span></span></div>'+
    '<div class="rm">'+normNote+'</div></div>'+dynHTML(it,lv)+'</div>';
}

/* ===== ВЕРДИКТ ===== */
function tally(){
  var b=0,w=0,s=0;
  CATS.forEach(function(cat){cat.brands.forEach(function(br){br.subgroups.forEach(function(sg){sg.items.forEach(function(it){
    var lv=moveLevel(it.f,it.t,it.nF,it.nT);
    if(lv==='closer')b++; else if(lv==='farther'||lv==='crit')w++; else if(lv==='still')s++;
  });});});});
  return {b:b,w:w,s:s};
}
function renderVerdict(){
  var v=tally(),word,wcls;
  if(v.w>v.b){word='погіршилось';wcls='down';} else if(v.b>v.w){word='покращилось';wcls='up';} else {word='без змін';wcls='flat';}
  var up='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  var dn='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';
  var eq='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 9h14M5 15h14"/></svg>';
  document.getElementById('verdict').innerHTML='<div class="vhdr"><div class="vword '+wcls+'"><span class="vlabel">Загалом:</span><span class="vval">'+word+'</span></div>'+
    '<div class="vcounts">'+
      '<span class="vc better"><span style="color:var(--accent)">'+up+'</span><span class="vn">'+v.b+'</span> ближче до норми</span>'+
      '<span class="vc worse"><span style="color:var(--warn)">'+dn+'</span><span class="vn">'+v.w+'</span> далі</span>'+
      '<span class="vc same"><span style="color:var(--muted)">'+eq+'</span><span class="vn">'+v.s+'</span> без змін</span>'+
    '</div></div>';
}

/* ===== КОЛОНК-ХЕДЕР ===== */
function colheadHTML(){
  var a,b; if(MODE.labels==='dates'){ a='18.06'; b='02.07'; } else { a='БУЛО'; b='СТАЛО'; }
  return '<div class="colhead"><div class="spacer"></div><div class="hcols"><div class="hc">'+a+'</div><div class="hc">'+b+'</div><div class="hc hd">ЗМІНА</div></div></div>';
}

/* ===== РЕНДЕР СПИСКУ ===== */
function renderList(){
  document.documentElement.setAttribute('data-theme',MODE.theme);
  document.body.setAttribute('data-dtreat',MODE.dtreat);
  var meta=document.getElementById('metaTheme'); if(meta)meta.setAttribute('content',MODE.theme==='dark'?'#0d1512':'#eef3f1');
  var html='';
  CATS.forEach(function(cat){
    html+='<div class="cat-div">'+cat.c+' <span class="cat-tier">· '+cat.tier+'</span></div>';
    cat.brands.forEach(function(br){
      var visSubs=br.subgroups.map(function(sg){
        return { sub:sg.sub, items:sg.items.filter(function(it){ return passFilter(moveLevel(it.f,it.t,it.nF,it.nT)); }) };
      }).filter(function(sg){ return sg.items.length; });
      if(!visSubs.length) return;
      var total=visSubs.reduce(function(a,sg){return a+sg.items.length;},0);
      html+='<div class="brand"><div class="bhdr"><span class="arr">▾</span><span class="bnm">'+br.b+'</span><span class="bcnt">'+total+'</span></div>'+colheadHTML()+'<div class="bwrap"><div class="bbody">';
      visSubs.forEach(function(sg){
        if(sg.sub) html+='<div class="ebrow"><span class="eb">'+sg.sub+'</span><span class="cnt">'+sg.items.length+'</span></div>';
        html+='<div class="rows">';
        sg.items.forEach(function(it){ html+=rowHTML(it); });
        html+='</div>';
      });
      html+='</div></div></div>';
    });
  });
  document.getElementById('list').innerHTML=html;
  document.querySelectorAll('.bhdr').forEach(function(h){ h.onclick=function(){ h.parentElement.classList.toggle('collapsed'); }; });
}

/* ===== СЕГМЕНТ THUMB (A54 placeThumb — persist DOM) ===== */
function placeThumb(snap){
  var seg=document.getElementById('sfilter'), t=seg.querySelector('.sf-thumb'), act=seg.querySelector('button.on');
  if(!t||!act){ if(t)t.style.opacity='0'; return; }
  var sr=seg.getBoundingClientRect(), r=act.getBoundingClientRect();
  if(r.width===0){ t.style.opacity='0'; return; }
  var apply=function(){ t.style.width=r.width+'px'; t.style.transform='translateX('+(r.left-sr.left-3)+'px)'; t.style.opacity='1'; };
  if(snap){ t.classList.add('no-anim'); apply(); requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.remove('no-anim');});}); }
  else apply();
}
function setFilter(f){
  MODE.sfilter=f;
  document.querySelectorAll('.sfilter button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-f')===f); });
  placeThumb(false);
  renderList();
}

/* ===== ПАНЕЛЬ ===== */
function syncSegs(){
  document.querySelectorAll('.seg').forEach(function(seg){
    var k=seg.getAttribute('data-k');
    seg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===MODE[k]); });
  });
}

/* сегмент-фільтр — bound ОДИН раз (persist) */
document.querySelectorAll('.sfilter button').forEach(function(b){ b.onclick=function(){ setFilter(b.getAttribute('data-f')); }; });
document.querySelector('.sfilter button[data-f="all"]').classList.add('on');

document.querySelectorAll('.seg').forEach(function(seg){
  var k=seg.getAttribute('data-k');
  seg.querySelectorAll('button').forEach(function(b){ b.onclick=function(){
    MODE[k]=b.getAttribute('data-v'); syncSegs();
    if(k==='crossnorm') renderVerdict();
    renderList();
    if(k==='theme') requestAnimationFrame(function(){ placeThumb(true); });
  }; });
});
document.getElementById('grip').onclick=function(){ document.getElementById('panel').classList.toggle('folded'); };
document.getElementById('copyBtn').onclick=function(){
  var s='dtreat='+MODE.dtreat+' · labels='+MODE.labels+' · theme='+MODE.theme+' · crossnorm='+MODE.crossnorm+' · newmode='+MODE.newmode+' · sfilter='+MODE.sfilter;
  var ta=document.getElementById('copyTa'); ta.value=s; ta.classList.add('show');
  try{ navigator.clipboard.writeText(s); }catch(e){} ta.select();
};

/* init */
renderVerdict(); syncSegs(); renderList();
requestAnimationFrame(function(){ placeThumb(true); });
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){ placeThumb(true); }); }
window.addEventListener('resize',function(){ requestAnimationFrame(function(){ placeThumb(true); }); });
</script>
</body>
