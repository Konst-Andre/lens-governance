<!doctype html><html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фармастор · FILL-tail harness v1 (меню A58 + count-бар track)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#eef3f1;--bg-soft:#e4ece9;--card:#ffffff;--surface-2:#f4f8f6;--surface-3:#eef4f1;
  --text:#182c28;--text-2:#3c574f;--muted:#6b8c84;--border:#d4e5df;--border-subtle:#e1ebe7;
  --ok:#1f9d57;--crit:#c0392b;--warn:#c8811b;
  --accent:hsl(162 82% 27%);--accent-soft:hsl(162 64% 88%);--accent-ink:hsl(162 82% 16%);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --font:'Manrope',-apple-system,system-ui,sans-serif;--rs:14px;}
[data-theme="dark"]{
  --bg:#0d1512;--bg-soft:#151e1a;--card:#18221e;--surface-2:#1c2723;--surface-3:#212d28;
  --text:#e8f0ec;--text-2:#a7c0b8;--muted:#7c968d;--border:#2a3833;--border-subtle:#222e29;
  --ok:#33c06f;--crit:#e0685c;--warn:#e0a94a;
  --accent:hsl(163 46% 46%);--accent-soft:hsl(163 37% 17%);--accent-ink:hsl(163 46% 68%);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:#20262b;color:#dfe6e2;padding:0 0 220px}
h1{font-size:15px;font-weight:800;margin:14px 16px 2px;color:#eef}
.sub{font-size:12px;color:#9fb0a8;margin:0 16px 12px}

/* ===== two-theme stage ===== */
.stage{display:flex;gap:10px;padding:0 10px}
.pane{flex:1;min-width:0;border-radius:16px;overflow:hidden;background:var(--bg);border:1px solid rgba(255,255,255,.06)}
.pane-lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
  padding:9px 12px 4px;background:var(--bg)}

/* ===== count-bar demo (FILL header sub-row) ===== */
.mh{padding:8px 12px 14px;background:var(--bg);border-bottom:1px solid var(--border-subtle)}
.mh-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tchip{font:700 11px/1 var(--font);color:var(--text-2);background:var(--surface-2);
  border:1px solid var(--border-subtle);border-radius:8px;padding:5px 8px}
[data-theme="dark"] .tchip{background:var(--surface-3);border-color:var(--border)}
.pcount{font:700 11px/1 var(--font);color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
/* track — per-theme via vars set by JS */
.trk{flex:1;min-width:70px;height:6px;border-radius:6px;position:relative;overflow:hidden}
.pane[data-theme="light"] .trk{
  background:color-mix(in srgb,var(--bg-soft),var(--border) calc(var(--LtrkMix)*1%));
  box-shadow:inset 0 1px calc(var(--Linset)*1px) rgba(20,50,42,var(--LinsetOp)),
             inset 0 -1px 0 rgba(20,50,42,var(--LfloorOp));
  border:1px solid color-mix(in srgb,var(--border),transparent calc(100% - var(--Lborder)*1%))}
.pane[data-theme="dark"] .trk{
  background:color-mix(in srgb,var(--bg),#fff calc(var(--Dlift)*1%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,var(--Dridge)),
             inset 0 -1px 0 rgba(0,0,0,var(--Dfloor))}
.trk>i{display:block;height:100%;border-radius:6px;width:var(--fillpct)}
.pane[data-theme="light"] .trk>i{background:var(--accent)}
.pane[data-theme="dark"] .trk>i{background:hsl(163 calc(var(--DfillS)*1%) calc(var(--DfillL)*1%))}

/* ===== redesigned menu (A58 grouped-cards) ===== */
.sheet-demo{background:var(--card);padding:6px 0 16px}
[data-theme="dark"] .sheet-demo{background:var(--surface-2)}
.grip{width:38px;height:4px;border-radius:4px;background:var(--border);margin:6px auto 6px}
.eb{font:800 10.5px/1 var(--font);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 16px 7px}
.gcard{margin:0 12px;background:var(--surface-3);border:1px solid var(--border-subtle);border-radius:var(--rs);overflow:hidden}
[data-theme="dark"] .gcard{background:var(--surface-3);border-color:var(--border)}
.mi{display:flex;align-items:center;gap:12px;padding:12px 13px;border-bottom:1px solid var(--border-subtle);cursor:pointer}
[data-theme="dark"] .mi{border-bottom-color:var(--border)}
.mi:last-child{border-bottom:none}
.mi-ic{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:9px;
  background:var(--surface-2);color:var(--text-2)}
[data-theme="dark"] .mi-ic{background:color-mix(in srgb,var(--surface-3),#fff 4%)}
.mi-ic svg{width:16px;height:16px}
.mi-tx{flex:1;min-width:0}
.mi-tx b{display:block;font:700 13.5px/1.15 var(--font);color:var(--text)}
.mi-tx span{display:block;font:600 11px/1.2 var(--font);color:var(--muted);margin-top:2px}
.mi-chev{color:var(--muted);flex-shrink:0}
.mi-chev svg{width:16px;height:16px}
.doact{font:800 11px/1 var(--font);color:var(--accent-ink);flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 9px;border-radius:8px}
[data-theme="dark"] .doact{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.mi.danger .mi-ic{color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent)}
.mi.danger b{color:var(--crit)}

/* theme switcher — variant A: segmented */
.thseg{display:flex;gap:0;margin:0 13px;padding:3px;background:var(--surface-2);border-radius:11px;border:1px solid var(--border-subtle)}
[data-theme="dark"] .thseg{background:color-mix(in srgb,var(--bg),#000 15%);border-color:var(--border)}
.thseg button{flex:1;border:none;background:transparent;padding:8px 4px;border-radius:9px;cursor:pointer;
  font:700 12px/1 var(--font);color:var(--muted);transition:.15s}
.thseg button.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px -1px color-mix(in srgb,var(--accent) 40%,transparent)}
[data-theme="dark"] .thseg button.on{background:linear-gradient(180deg,hsl(163 55% 34%),hsl(163 55% 30%));color:#fff}
.throw{display:flex;align-items:center;gap:12px;padding:11px 13px 3px}
.throw .mi-ic{margin-right:0}
.thlbl{flex:1;font:700 13.5px/1 var(--font);color:var(--text)}
/* theme switcher — variant B: pills */
.thpills{display:flex;gap:7px;margin:11px 13px 3px}
.thpills button{flex:1;border:1px solid var(--border);background:var(--surface-2);padding:9px 4px;border-radius:10px;cursor:pointer;
  font:700 12px/1 var(--font);color:var(--text-2);transition:.15s}
[data-theme="dark"] .thpills button{background:var(--surface-3);border-color:var(--border)}
.thpills button.on{background:var(--accent);color:#fff;border-color:transparent}
[data-theme="dark"] .thpills button.on{background:linear-gradient(180deg,hsl(163 55% 34%),hsl(163 55% 30%))}
.hidden{display:none!important}

/* ===== dock controls ===== */
.dock{position:fixed;left:0;right:0;bottom:0;background:#171c20;border-top:1px solid #2c343a;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-height:210px;overflow-y:auto;z-index:50}
.dock h2{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8aa;margin:6px 2px 4px}
.lever{display:flex;align-items:center;gap:8px;margin:5px 0}
.lever label{font-size:11px;color:#c3cdd4;width:62px;flex-shrink:0}
.lever input[type=range]{flex:1}
.lever .val{font-size:11px;color:#9fd9c9;width:38px;text-align:right;font-variant-numeric:tabular-nums}
.togs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.togs button{font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid #38424a;
  background:#20272c;color:#c3cdd4;cursor:pointer}
.togs button.on{background:#2a8c84;color:#fff;border-color:transparent}
.dock-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.copy{width:100%;margin-top:8px;padding:9px;border:none;border-radius:9px;background:#2a8c84;color:#fff;font-weight:800;font-size:12px;cursor:pointer}
.caret{position:fixed;right:14px;bottom:calc(214px + env(safe-area-inset-bottom));z-index:51;background:#2a8c84;color:#fff;
  border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:bottom .2s}
.caret.min{bottom:12px}
.dock.min{transform:translateY(100%)}
</style></head>
<body>

<h1>Фармастор · FILL-tail harness v1</h1>
<p class="sub">Меню A58-редизайн (обидві теми) + count-бар track (A45-манифест per-theme). Керування знизу.</p>

<div class="stage" id="stage"></div>

<button class="caret" id="caret" onclick="toggleDock()">▾ керування</button>
<div class="dock" id="dock">
  <div class="dock-grid">
    <div>
      <h2>Count-бар · СВІТЛА (border+inset)</h2>
      <div class="lever"><label>LtrkMix</label><input type="range" id="LtrkMix" min="0" max="80" value="34"><span class="val" id="LtrkMix_v"></span></div>
      <div class="lever"><label>Lborder</label><input type="range" id="Lborder" min="0" max="100" value="70"><span class="val" id="Lborder_v"></span></div>
      <div class="lever"><label>Linset</label><input type="range" id="Linset" min="0" max="4" step=".5" value="1.5"><span class="val" id="Linset_v"></span></div>
      <div class="lever"><label>LinsetOp</label><input type="range" id="LinsetOp" min="0" max="30" value="10"><span class="val" id="LinsetOp_v"></span></div>
      <div class="lever"><label>LfloorOp</label><input type="range" id="LfloorOp" min="0" max="20" value="6"><span class="val" id="LfloorOp_v"></span></div>
    </div>
    <div>
      <h2>Count-бар · ТЕМНА (lift+ridge+floor+fill)</h2>
      <div class="lever"><label>Dlift</label><input type="range" id="Dlift" min="0" max="30" value="10"><span class="val" id="Dlift_v"></span></div>
      <div class="lever"><label>Dridge</label><input type="range" id="Dridge" min="0" max="30" value="10"><span class="val" id="Dridge_v"></span></div>
      <div class="lever"><label>Dfloor</label><input type="range" id="Dfloor" min="0" max="60" value="30"><span class="val" id="Dfloor_v"></span></div>
      <div class="lever"><label>DfillS</label><input type="range" id="DfillS" min="30" max="70" value="55"><span class="val" id="DfillS_v"></span></div>
      <div class="lever"><label>DfillL</label><input type="range" id="DfillL" min="38" max="60" value="52"><span class="val" id="DfillL_v"></span></div>
    </div>
  </div>
  <h2>Демо-стан бару</h2>
  <div class="lever"><label>fill %</label><input type="range" id="fillpct" min="0" max="100" value="0"><span class="val" id="fillpct_v"></span></div>
  <div class="togs" id="fillPresets">
    <button data-fill="0" class="on">0/83 (порожній)</button>
    <button data-fill="7">6/83</button>
    <button data-fill="50">41/83</button>
    <button data-fill="100">83/83</button>
  </div>
  <h2>Меню · перемикач теми</h2>
  <div class="togs" id="thVariant"><button data-th="seg" class="on">A · сегмент 3-в-1</button><button data-th="pills">B · пігулки</button></div>
  <h2>Меню · лейбл Excel</h2>
  <div class="togs" id="xlLabel"><button data-xl="Excel онлайн" class="on">Excel онлайн</button><button data-xl="Онлайн-форма">Онлайн-форма</button><button data-xl="Форма замовлення">Форма замовлення</button></div>
  <button class="copy" onclick="copyVals()">📋 Копіювати значення</button>
</div>

<script>
var ICON={
  excel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
  csv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'};

var thVar='seg', xlText='Excel онлайн';

function menuHtml(theme){
  var thBlock = thVar==='seg'
   ? '<div class="throw"><span class="mi-ic">'+ICON.theme+'</span><span class="thlbl">Тема</span></div>'+
     '<div class="thseg"><button>Авто</button><button class="on">Світла</button><button>Темна</button></div>'
   : '<div class="throw"><span class="mi-ic">'+ICON.theme+'</span><span class="thlbl">Тема</span></div>'+
     '<div class="thpills"><button>Авто</button><button class="on">Світла</button><button>Темна</button></div>';
  return ''+
  '<div class="grip"></div>'+
  '<div class="eb">Вигляд</div>'+
  '<div class="gcard" style="padding-bottom:8px">'+thBlock+'</div>'+
  '<div class="eb">Дії</div>'+
  '<div class="gcard">'+
    '<div class="mi"><span class="mi-ic">'+ICON.excel+'</span><span class="mi-tx"><b>'+xlText+'</b><span>Форма замовлення для вставки</span></span><span class="doact">Відкрити</span></div>'+
    '<div class="mi"><span class="mi-ic">'+ICON.csv+'</span><span class="mi-tx"><b>Експорт CSV</b><span>Ця аптека</span></span><span class="doact">CSV</span></div>'+
  '</div>'+
  '<div class="eb">Сеанс</div>'+
  '<div class="gcard">'+
    '<div class="mi"><span class="mi-ic">'+ICON.info+'</span><span class="mi-tx"><b>Про додаток</b><span>v2.4.0 · node8.b10</span></span><span class="mi-chev">'+ICON.chev+'</span></div>'+
    '<div class="mi danger"><span class="mi-ic">'+ICON.trash+'</span><span class="mi-tx"><b>Очистити всі дані</b><span>Усі аптеки та візити · з підтвердженням</span></span><span class="mi-chev">'+ICON.chev+'</span></div>'+
  '</div>';
}
function paneHtml(theme){
  var f=+document.getElementById('fillpct').value;
  var cnt=Math.round(f/100*83);
  return '<div class="pane-lbl">'+(theme==='light'?'☀ Світла':'☾ Темна')+'</div>'+
  '<div class="mh"><div class="mh-row">'+
    '<span class="tchip">OTC C</span><span class="tchip">IW D</span>'+
    '<div class="trk"><i></i></div>'+
    '<span class="pcount">'+cnt+' / 83</span>'+
  '</div></div>'+
  '<div class="sheet-demo">'+menuHtml(theme)+'</div>';
}
function render(){
  var st=document.getElementById('stage');
  st.innerHTML='';
  ['light','dark'].forEach(function(t){
    var p=document.createElement('div');p.className='pane';p.setAttribute('data-theme',t);
    p.innerHTML=paneHtml(t);
    st.appendChild(p);
  });
  applyVars();
}
function applyVars(){
  var g=function(id){return document.getElementById(id).value;};
  var f=+g('fillpct');
  document.querySelectorAll('.pane').forEach(function(p){
    p.style.setProperty('--fillpct',f+'%');
    // light
    p.style.setProperty('--LtrkMix',g('LtrkMix'));
    p.style.setProperty('--Lborder',g('Lborder'));
    p.style.setProperty('--Linset',g('Linset'));
    p.style.setProperty('--LinsetOp',(+g('LinsetOp')/100));
    p.style.setProperty('--LfloorOp',(+g('LfloorOp')/100));
    // dark
    p.style.setProperty('--Dlift',g('Dlift'));
    p.style.setProperty('--Dridge',(+g('Dridge')/100));
    p.style.setProperty('--Dfloor',(+g('Dfloor')/100));
    p.style.setProperty('--DfillS',g('DfillS'));
    p.style.setProperty('--DfillL',g('DfillL'));
  });
  // update readouts
  ['LtrkMix','Lborder','Linset','LinsetOp','LfloorOp','Dlift','Dridge','Dfloor','DfillS','DfillL','fillpct'].forEach(function(id){
    document.getElementById(id+'_v').textContent=document.getElementById(id).value;});
  // update pcount live without full rerender
  var cnt=Math.round(f/100*83);
  document.querySelectorAll('.pcount').forEach(function(e){e.textContent=cnt+' / 83';});
}
// range wiring
['LtrkMix','Lborder','Linset','LinsetOp','LfloorOp','Dlift','Dridge','Dfloor','DfillS','DfillL','fillpct'].forEach(function(id){
  document.getElementById(id).addEventListener('input',applyVars);});
// fill presets
document.getElementById('fillPresets').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#fillPresets button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');
  document.getElementById('fillpct').value=b.getAttribute('data-fill');applyVars();});
// theme-switcher variant
document.getElementById('thVariant').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#thVariant button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');
  thVar=b.getAttribute('data-th');render();});
// excel label
document.getElementById('xlLabel').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#xlLabel button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');
  xlText=b.getAttribute('data-xl');render();});

function copyVals(){
  var g=function(id){return document.getElementById(id).value;};
  var s='FILL-tail harness values\n'+
  '— theme-switcher: '+thVar+'\n— excel-label: "'+xlText+'"\n'+
  'COUNT-BAR light: LtrkMix '+g('LtrkMix')+' · Lborder '+g('Lborder')+' · Linset '+g('Linset')+' · LinsetOp '+g('LinsetOp')+' · LfloorOp '+g('LfloorOp')+'\n'+
  'COUNT-BAR dark: Dlift '+g('Dlift')+' · Dridge '+g('Dridge')+' · Dfloor '+g('Dfloor')+' · DfillS '+g('DfillS')+' · DfillL '+g('DfillL')+'\n'+
  'demo fill: '+g('fillpct')+'%';
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){alert('Скопійовано ✓');}).catch(function(){fb(s);});}
  else fb(s);
}
function fb(s){var ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('Скопійовано ✓');}catch(e){}document.body.removeChild(ta);}

function toggleDock(){var d=document.getElementById('dock'),c=document.getElementById('caret');
  d.classList.toggle('min');c.classList.toggle('min');
  c.textContent=d.classList.contains('min')?'▴ керування':'▾ керування';}

render();
</script>
</body></html>
