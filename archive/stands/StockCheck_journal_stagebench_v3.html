<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StockCheck · journal stage-bench v3</title>
<!-- живе доки: F1 не закрито device-проходом v3 і рішення не перенесені в порт b29 (wsd 1.8)
     база значень: StockCheck_port_b28.html р.93/486 (--hcOtc*/--hcIw*) · р.505-508 (.tier) — грепнуто, не з пам'яті (Д-В)
     v3 проти v2:
       a · hdrPos у картці/над карткою + ВИДИМЕ гасіння важелів, скасованих іншим важелем (П-8-bis)
       b · divInset → divL/divR (однобічність, недоправлена в D-1)
       c · ringSide × tierHome — три компоновки рядка одним важелем
       d · dark: cardFloor (підлога картки) + tagBdS/tagBdL (рамка плити)
       e · rowH оголошує себе мертвим, коли вміст вищий за підлогу
       f · P3 = набір Konst 01.08 · P4 = ставка Claude
       g · тир кольором із b28 (OTC зелений H160/162 · IW синій H210), per-theme S/L
       h · chevOp/chevSz per-theme — шеврон нейтральний, але керований
       D-7 · .jr-meta overflow:hidden різав inline-плиту зверху → meta розщеплено на .jr-mt + .jr-mtier -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#101315;color:#e6ebe8;font:600 13px/1.35 'Manrope',-apple-system,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
#stageWrap{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:10px 0 4px;background:radial-gradient(120% 60% at 50% 0%,#1a2023,#0c0f11)}
#frameHost{flex:none;display:flex;justify-content:center;overflow:hidden} /* v2-фікс: висота = frameH × zoom (нема мертвого простору) */
.frame{transform-origin:top center;flex:none;
  padding:6px;border-radius:44px;background:linear-gradient(160deg,#3a4247,#181c1f);
  box-shadow:0 0 0 1px #4b555a,0 18px 40px -12px #000}
/* v2-ФІКС iOS-кліпу: композитний скролер (-webkit-overflow-scrolling) виходить
   з-під border-radius предка. mask + isolation повертають обрізання. */
.screenbox{position:relative;overflow:hidden;border-radius:38px;background:var(--bg);
  isolation:isolate;
  -webkit-mask-image:-webkit-radial-gradient(#fff,#000);mask-image:radial-gradient(#fff,#000)}
.homeind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:134px;height:5px;border-radius:5px;background:var(--text);opacity:.28;z-index:60;pointer-events:none}
.sbar{position:absolute;top:0;left:0;right:0;height:var(--sat);z-index:55;pointer-events:none;
  display:flex;align-items:center;justify-content:space-between;padding:0 30px;
  font:800 14px/1 'Manrope',sans-serif;color:var(--text)}
.sbar .r{display:flex;gap:5px;align-items:center;opacity:.85;font-size:11px}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:56;background:#000;border-radius:20px}
.dev-xs .notch{width:150px;height:30px;top:0;border-radius:0 0 20px 20px}
.dev-p15 .notch{width:122px;height:36px}

#dock{flex:none;background:#181c1f;border-top:1px solid #2b3236;
  padding-bottom:env(safe-area-inset-bottom,0px);max-height:56vh;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid #23292d;flex:none;overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tg{flex:none;display:flex;background:#0f1315;border:1px solid #2b3236;border-radius:9px;overflow:hidden}
.tg button{border:0;background:transparent;color:#8a9a95;font:800 11px/1 'Manrope',sans-serif;padding:7px 9px;cursor:pointer;white-space:nowrap}
.tg button.on{background:#2c6d5c;color:#eafff8}
.bbt{flex:none;border:1px solid #2b3236;background:#0f1315;color:#cfe0da;border-radius:9px;
  font:800 11px/1 'Manrope',sans-serif;padding:7px 9px;cursor:pointer;white-space:nowrap}
.bbt.hot{background:#2c6d5c;border-color:#3f9b81;color:#eafff8}
#zi{flex:none;font:800 11px/1 'Manrope',sans-serif;color:#7f918c;min-width:38px;text-align:center}
#cats{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.cat>summary{list-style:none;cursor:pointer;padding:9px 12px;font:800 11.5px/1 'Manrope',sans-serif;
  letter-spacing:.7px;color:#7fb8a6;background:#14181a;border-bottom:1px solid #23292d;
  display:flex;justify-content:space-between;align-items:center}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::after{content:'▾';color:#4d5a56;font-size:11px}
.cat[open]>summary::after{content:'▴'}
.cat .body{padding:8px 12px 10px;display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.lv{display:flex;flex-direction:column;gap:2px;min-width:0}
.lv.wide{grid-column:1/-1}
.lv label{font:700 10px/1.1 'Manrope',sans-serif;color:#8a9a95;display:flex;justify-content:space-between;gap:6px}
.lv label b{color:#cfe0da;font-weight:800;font-variant-numeric:tabular-nums}
.lv input[type=range]{width:100%;height:22px;accent-color:#3f9b81;background:transparent}
.seg{display:flex;background:#0f1315;border:1px solid #2b3236;border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:#8a9a95;font:800 10px/1 'Manrope',sans-serif;padding:7px 2px;cursor:pointer}
.seg button.on{background:#2c6d5c;color:#eafff8}
.note{grid-column:1/-1;font:600 10px/1.4 'Manrope',sans-serif;color:#6f817c}
/* П-8-bis: важіль, скасований іншим важелем, гаситься ВИДИМО і називає винуватця.
   Без імені винуватця сірий важіль читається як поламаний стенд. */
.lv.off{opacity:.34}
.lv.off input[type=range],.lv.off .seg{pointer-events:none;filter:grayscale(1)}
.lv .why{font:700 9px/1.25 'Manrope',sans-serif;color:#c9924f;margin-top:1px}
.lv label b.dead{color:#c9924f}
#betOut{grid-column:1/-1;width:100%;height:60px;background:#0b0e0f;color:#9fb5ae;border:1px solid #2b3236;
  border-radius:8px;font:600 10px/1.35 ui-monospace,monospace;padding:6px;resize:none}

/* ═════════ ПРОДУКТОВІ ТОКЕНИ (b28 1:1) ═════════ */
[data-theme]{--font:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  --r-chip:8px;--r-pill:9px;--spring:cubic-bezier(.34,1.56,.64,1)}
[data-theme="light"]{
  --bg:#eef3f1;--bg-soft:#e4ece9;--card:#ffffff;--surface-2:#f4f8f6;--surface-3:#eef4f1;
  --text:#182c28;--text-2:#3c574f;--muted:#6b8c84;--border:#d4e5df;--border-subtle:#e1ebe7;
  --accent:hsl(162 82% 27%);--accent-soft:hsl(162 64% 88%);--accent-ink:hsl(162 82% 16%);
  --comet-a:hsl(162 72% 30%);--comet-b:hsl(162 55% 66%);--ringTrack:#d9e7e2;
  --b-bc:var(--surface-2);--b-chip:#f7fbf9;--b-act:var(--surface-2);
  --b-srch:color-mix(in srgb,var(--bg-soft) 82%,var(--card));
  --m-bc-bg:linear-gradient(180deg,color-mix(in srgb,var(--b-bc) 90%,#fff),color-mix(in srgb,var(--b-bc) 90%,#000));
  --m-chip-bg:linear-gradient(180deg,color-mix(in srgb,var(--b-chip) 90%,#fff),color-mix(in srgb,var(--b-chip) 90%,#000));
  --m-act-bg:linear-gradient(180deg,color-mix(in srgb,var(--b-act) 90%,#fff),color-mix(in srgb,var(--b-act) 90%,#000));
  --m-srch-bg:var(--b-srch);
  --m-bc-sh:0 1px 2px rgba(20,50,42,.056),0 1.3px 3px rgba(20,50,42,.140);
  --m-chip-sh:0 1px 2px rgba(20,50,42,.056),0 1.3px 3px rgba(20,50,42,.140);
  --m-act-sh:0 1px 2px rgba(20,50,42,.072),0 1.3px 3px rgba(20,50,42,.180);
  --m-srch-sh:inset 0 1px 2px rgba(20,50,42,.200);
  --m-tray-bg:transparent;--m-tray-sh:inset 0 2.0px 5.9px rgba(20,50,42,.154);
  --islBg:rgba(245,249,247,.82);--islBd:rgba(20,50,42,.137);
  --islSh:0 5px 16px -6px rgba(20,50,42,.18),0 2px 6px rgba(20,50,42,.08)}
[data-theme="dark"]{
  --bg:#0d1512;--bg-soft:#151e1a;--card:#18221e;--surface-2:#1c2723;--surface-3:#212d28;
  --text:#e8f0ec;--text-2:#a7c0b8;--muted:#7c968d;--border:#2a3833;--border-subtle:#222e29;
  --accent:hsl(163 46% 46%);--accent-soft:hsl(163 37% 17%);--accent-ink:hsl(163 46% 68%);
  --comet-a:hsl(162 48% 42%);--comet-b:hsl(162 40% 68%);--ringTrack:#2a3833;
  --m-bc-bg:linear-gradient(180deg,#3f4a45,#26302c);
  --m-chip-bg:linear-gradient(180deg,#404c46,#24302a);
  --m-act-bg:linear-gradient(180deg,#4a5450,#212b27);
  --m-srch-bg:#111916;
  --m-bc-sh:inset 0 1px 0 rgba(255,255,255,.120),inset 0 -1px 0 rgba(0,0,0,.200);
  --m-chip-sh:inset 0 1px 0 rgba(255,255,255,.140),inset 0 -1px 0 rgba(0,0,0,.200);
  --m-act-sh:inset 0 1px 0 rgba(255,255,255,.170),inset 0 -1px 0 rgba(0,0,0,.220);
  --m-srch-sh:inset 0 2px 5px rgba(0,0,0,.550),inset 0 -1px 0 rgba(255,255,255,.120);
  --m-tray-bg:rgba(24,34,30,.23);
  --m-tray-sh:inset 0 2.4px 2.7px rgba(0,0,0,.374),inset 0 -1px 0 rgba(255,255,255,.100);
  --islBg:rgba(38,51,46,.82);--islBd:rgba(255,255,255,.091);
  --islSh:0 6px 18px -8px rgba(0,0,0,.40)}

.app{position:absolute;inset:0;overflow:hidden;background:var(--bg);font-family:var(--font)}
.screen{position:absolute;inset:0;overflow:hidden}
.home-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none}
.isl-spacer{flex:none;height:200px}
.pressable.is-pressed{transition-duration:.06s}
.isl{position:absolute;top:0;left:12px;right:12px;z-index:20;border-radius:0 0 24px 24px;overflow:hidden;
  padding-top:calc(var(--sat) + 10px);background:var(--islBg);
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);
  border:1px solid var(--islBd);border-top-color:transparent;box-shadow:var(--islSh)}
.isl-brand{display:flex;align-items:center;gap:9px;padding:0 12px 10px;overflow:hidden;min-height:0}
.isl-head{display:grid;grid-template-rows:1fr;overflow:hidden}
.sc-brand{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.sc-brand .sc-ic{flex:none;display:grid;place-items:center;width:34px;height:34px}
.sc-comet{display:block}
.sc-brand .sc-wm{font:800 24px/1 var(--font);letter-spacing:-1.2px;white-space:nowrap}
.sc-wm .s1{color:var(--text)} .sc-wm .s2{color:var(--accent)}
.isl-actions{display:flex;align-items:center;gap:8px;flex:none}
.netbtn,.isl-menu{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--m-act-bg);border:1px solid var(--border);cursor:pointer;padding:0;
  box-shadow:var(--m-act-sh);transition:transform .22s var(--spring)}
.netbtn.is-pressed,.isl-menu.is-pressed{transform:scale(.9)}
.isl-menu svg{width:19px;height:19px;display:block;color:var(--text-2)}
.ntile{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(180deg,rgb(89,170,109),rgb(66,158,89));
  box-shadow:0 2px 5px rgba(20,50,42,.10);--ntile-gl:#ffffff}
[data-theme="dark"] .ntile{background:linear-gradient(180deg,rgb(77,153,96),rgb(68,136,85));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.10);--ntile-gl:rgb(233,241,235)}
.ntile svg{display:block}
.ntile .bscale{display:grid;place-items:center;transform:scale(1.55)}
.toparea{--chipH:30px;--chipGap:6px;--chipPadX:14px;--chipRad:10px;--searchH:40px;
  background:transparent;padding:10px 0 12px;display:flex;flex-direction:column}
.tray{display:flex;flex-direction:column;gap:10px;margin:0 6px;padding:8px 0;border-radius:22px;
  background:var(--m-tray-bg);box-shadow:var(--m-tray-sh)}
.bcrow{display:flex;align-items:center;gap:8px;padding:0 14px}
.bc{display:inline-flex;align-items:center;gap:6px;background:var(--m-bc-bg);border:1px solid var(--border);
  border-radius:var(--chipRad);padding:7px 12px;font:800 13px/1 var(--font);color:var(--text);cursor:pointer;
  white-space:nowrap;box-shadow:var(--m-bc-sh)}
.bc .bc-c{color:var(--accent);font-weight:800}
.chiprow{display:flex;gap:var(--chipGap);overflow-x:auto;padding:0 14px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:var(--chipH);display:inline-flex;align-items:center;justify-content:center;
  padding:0 var(--chipPadX);border-radius:var(--chipRad);border:1px solid var(--border);
  background:var(--m-chip-bg);color:var(--text-2);--pcs:.90;
  font:700 12.5px/1 var(--font);white-space:nowrap;cursor:pointer;box-shadow:var(--m-chip-sh);
  transition:transform 80ms cubic-bezier(.4,0,.6,1),background .12s}
.chip.is-pressed{transform:scale(var(--pcs))}
.chip.on{background:linear-gradient(180deg,hsl(162 82% 31%),hsl(162 82% 26%));border-color:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(13,110,90,.32)}
[data-theme="dark"] .chip.on{background:linear-gradient(180deg,hsl(163 46% 50%),hsl(163 46% 44%));color:#08120e;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.srch{margin:0 14px;height:var(--searchH);display:flex;align-items:center;gap:9px;border-radius:12px;padding:0 12px;
  background:var(--m-srch-bg);border:1px solid var(--border);box-shadow:var(--m-srch-sh)}
.srch .si{width:16px;height:16px;flex:0 0 auto;color:var(--muted);display:flex}
.srch .si svg{width:100%;height:100%;display:block}
.srch input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:600 14px/1 var(--font);outline:none}
.srch input::placeholder{color:var(--muted)}
.srch .clr{flex:0 0 auto;position:relative;display:none;place-items:center;cursor:pointer;
  width:var(--clrSz);height:var(--clrSz);border-radius:50%;padding:0;background:transparent;border:0;color:var(--muted)}
.srch .clr::after{content:"";position:absolute;inset:calc((var(--clrSz) - 44px)/2)}
.srch .clr svg{width:calc(var(--clrSz) * .62);height:calc(var(--clrSz) * .62);display:block}
.srch.has-q .clr{display:grid}
.clr-ring .srch .clr{border:1px solid var(--border);background:color-mix(in srgb,var(--card) 55%,transparent)}
.clr-solid .srch .clr{background:color-mix(in srgb,var(--muted) 26%,transparent);color:var(--text-2)}
.clr-off .srch .clr{display:none!important}
.srch .clr.is-pressed{transform:scale(.86);transition:transform .06s}

/* ═════════ ЖУРНАЛ v3 ═════════ */
/* відтінки тирів 1:1 з b28 р.93/486: світла OTC 160/55/40 · IW 210/48/44;
   темна OTC 162/46/55 · IW 210/48/60. Тон (H) фіксований, важелі — S і L. */
[data-theme="light"]{--jrOtcH:160;--jrIwH:210}
[data-theme="dark"]{--jrOtcH:162;--jrIwH:210}
.jr{padding:0 0 48px}
.jr-grp+.jr-grp{margin-top:0}
.jr-hdr{display:flex;align-items:baseline;gap:8px;
  margin:var(--jrHdrGapT) 0 var(--jrHdrGapB);padding:var(--jrHdrPadY) var(--jrPadX);
  background:var(--jrHdrBg);
  font:800 var(--jrHdrSz)/1.1 var(--font);color:var(--jrHdrCol);
  text-transform:var(--jrHdrCase);letter-spacing:var(--jrHdrLs)}
.jr-grp:first-child .jr-hdr{margin-top:2px}
.jr-hdr .n{margin-left:auto;font:700 calc(var(--jrHdrSz) - .5px)/1 var(--font);
  color:color-mix(in srgb,var(--muted) 78%,var(--bg));text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.jr.sticky .jr-hdr{position:sticky;top:var(--jrStickyTop);z-index:8}
.jr.hdr-blur .jr-hdr{-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%)}
.jr.hdr-well .jr-hdr{margin-left:12px;margin-right:12px;border-radius:11px;
  padding-left:12px;padding-right:12px;border:1px solid var(--border-subtle)}
[data-theme="dark"] .jr.hdr-well .jr-hdr{border-color:var(--border)}

.jr-row{display:flex;align-items:center;gap:var(--jrGap);width:100%;min-height:var(--jrRowH);
  padding:var(--jrRowPadY) var(--jrPadX);background:transparent;border:none;
  font-family:var(--font);cursor:pointer;text-align:left;position:relative}
/* b · інсет роздільника РОЗЩЕПЛЕНО: лівий якір (текст/паддінг) і правий — різні величини.
   Симетричний divInset із D-1 був надкорекцією однобічного варіанта v1. */
.jr-row::after{content:"";position:absolute;left:var(--jrDivL);right:var(--jrDivR);bottom:0;height:1px;
  background:color-mix(in srgb,var(--border) calc(var(--jrBdA)*1%),transparent)}
.jr.div-none .jr-row::after{display:none}
.jr.lastdiv-off .jr-grp .jr-row:last-child::after{display:none}
.jr-row.is-pressed{background:color-mix(in srgb,var(--accent) 9%,transparent)}

.jr-ring{flex:0 0 auto;position:relative;width:var(--jrRingSz);height:var(--jrRingSz);display:grid;place-items:center;order:1}
/* c · ringSide через flex order — DOM лишається стабільним (жодного перебудування рядка) */
.jr.ring-right .jr-ring{order:5}
.jr-ring svg{display:block;position:absolute;inset:0}
.jr-ring .rn{position:relative;font:800 calc(var(--jrRingSz)*.33)/1 var(--font);
  color:var(--text-2);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.jr.comp-table .jr-ring{display:none}

.jr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center;order:2}
.jr-name{font:700 var(--jrNameSz)/1.28 var(--font);
  color:color-mix(in srgb,var(--text) calc(var(--jrValL)*1%),var(--bg))}
.jr.fit-ell .jr-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr.fit-c2 .jr-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jr.fit-full .jr-name{white-space:normal}
/* D-7: overflow:hidden потрібен еліпсису орієнтира — і він же різав плиту тира зверху
   (line-box 11.5×1.3=14.95px проти плити 19.5px). Розщеплення знімає конфлікт:
   текст несе еліпсис, тир живе сусіднім flex:none боксом. */
.jr-meta{font:600 var(--jrMetaSz)/1.3 var(--font);
  color:color-mix(in srgb,var(--muted) calc(var(--jrMutL)*1%),var(--bg));
  display:flex;align-items:center;gap:5px;min-width:0}
.jr-mt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.jr.fit-ell .jr-mt{white-space:nowrap}
.jr-mtier{flex:0 0 auto;display:flex;align-items:center;gap:5px}
.jr-tail{flex:0 0 auto;display:flex;align-items:center;gap:6px;order:3}
.jr-tail:empty{display:none}
/* g · ink — те саме представлення, що на активній картці b28 (.tier .otc/.iw, р.507-508).
   Плита тримається на РАМЦІ (ΔL* 10.6 світла / 7.6 темна), а не на заливці (2.8/2.9) —
   тому важіль рамки, а не фону. */
.jr-tag{font:800 9.5px/1 var(--font);text-transform:uppercase;letter-spacing:.5px;
  padding:4px 7px;border-radius:7px;white-space:nowrap;
  color:var(--text-2);background:var(--surface-2);border:1px solid var(--jrTagBd)}

/* ══════════ П-8-bis · ГАСІННЯ СКАСОВАНИХ ВАЖЕЛІВ ══════════
   Одиниця чесності стенду — не важіль, а КОМБІНАЦІЯ. N сегментів оголошують
   N-вимірний простір; якщо частина клітинок не рендериться, панель збрехала,
   хоча кожен окремий важіль чесний. Тому тут — карта пар, а не перевірка елементів. */
function gates(){
  var g={},off=function(id,why){if(!g[id])g[id]=why;};
  if(SEG.wrap!=='card'){ off('hdrPos','нема картки (wrap=плоско)'); off('cardFloor','нема картки'); }
  else if(SEG.hdrPos==='in'){
    off('hdrBg','заголовок у картці — фон дає картка');
    off('hdrMode','заголовок у картці — липнути нікуди');
  }
  if(SEG.wrap==='card'&&THEME!=='dark') off('cardFloor','підлога править лише темну (A45)');
  if(!g.hdrMode&&SEG.hdrMode!=='sticky'){ off('stickyTop','hdrMode=у потоці'); off('fitSticky','hdrMode=у потоці'); }
  if(g.hdrMode){ off('stickyTop','заголовок у картці'); off('fitSticky','заголовок у картці'); }
  if(SEG.comp!=='ring'){ off('ringSz','comp=таблиця'); off('ringNum','comp=таблиця'); off('ringSide','comp=таблиця'); }
  if(SEG.chev!=='on'){ off('chevSz','chev=нема'); off('chevOp','chev=нема'); }
  if(SEG.tierHome==='none'){ off('tierStyle','tierHome=нема'); off('tierLab','tierHome=нема'); }
  if(SEG.tierHome==='none'||SEG.tierStyle!=='ink'){ ['otcS','otcL','iwS','iwL'].forEach(function(x){off(x,'tierStyle≠колір');}); }
  if(SEG.tierHome==='none'||SEG.tierStyle!=='plate'){ ['tagBdS','tagBdL'].forEach(function(x){off(x,'tierStyle≠плита');}); }
  if(SEG.divider!=='line'){ off('divL','divider=нема'); off('divR','divider=нема'); off('lastDiv','divider=нема'); off('fitDiv','divider=нема'); }
  /* e · rowH — не «скасований», а МЕРТВИЙ: підлога нижча за вміст. Оголошуємо це,
     інакше оператор крутить повзунок і судить відсутність ефекту як властивість дизайну. */
  if(MEASH&&MEASH>NUM.rowH+0.5) off('rowH','мертвий: вміст дає '+Math.round(MEASH)+'px');
  return g;
}
function applyGates(){
  var g=gates();

    var id=lv.dataset.lv,w=g[id],ex=lv.querySelector('.why');
    lv.classList.toggle('off',!!w);
    if(w){ if(!ex){ex=document.createElement('div');ex.className='why';lv.appendChild(ex);} ex.textContent='⟂ '+w; }
    else if(ex){ ex.remove(); }
    var b=lv.querySelector('label b'); if(b)b.classList.toggle('dead',id==='rowH'&&!!w);
  });
}

      st='transform:rotate(135deg);transform-origin:center',
      off=(75-0.75*pct).toFixed(2);
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">'
    +'<circle cx="'+c+'" cy="'+c+'" r="'+r+'" pathLength="100" fill="none" stroke="var(--ringTrack)" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="75 100" style="'+st+'"/>'
    +(pct>0?'<circle cx="'+c+'" cy="'+c+'" r="'+r+'" pathLength="100" fill="none" stroke="var(--accent)" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="75 100" stroke-dashoffset="'+off+'" style="'+st+'"/>':'')
    +'</svg>';
}
/* g · один будівник тира на всі три доми — інакше формат розповзається по гілках
   і «той самий» тир виглядає по-різному праворуч і в meta-рядку. */
function tierHTML(p){
  var a=p.oTC,b=p.iW,sep=(SEG.tierLab==='slash')?'/':'·';
  if(SEG.tierLab==='pref'){a='OTC '+a;b='IW '+b;}
  if(SEG.tierStyle==='plate')
    return '<span class="jr-tag">'+a+'</span><span class="jr-tag">'+b+'</span>';
  return '<span class="jr-tg jr-otc">'+a+'</span><span class="jr-dot">'+sep+'</span><span class="jr-tg jr-iw">'+b+'</span>';
}
function renderJournal(){
  var clean=SEG.addr==='ext'?cleanExt:cleanDonor, h='', n=0;
  var SRC=(SEG.dataMix==='real')?PH_REAL:PH_MIX;
  var above=(SEG.wrap==='card'&&SEG.hdrPos==='above');
  for(var g=0;g<NUM.groups;g++){
    var hdr='<div class="jr-hdr">'+dstr(g*2)+'<span class="n">'+NUM.rows+'</span></div>',
        grpOpen='<div class="jr-grp">';
    h+= above ? hdr+grpOpen : grpOpen+hdr;
    for(var i=0;i<NUM.rows;i++){
      var p=SRC[(g*7+i*3+n)%SRC.length]; n++;
      /* інваріант журналу: зданий візит не буває порожнім → filled >= 1 (v2-фікс) */
      var f=1+Math.round(rnd(g*31+i*7)*82), pct=Math.round(f/83*100), full=f>=83;
      var e=clean(p.addr), sp=SEG.addrSplit==='on'?splitAddr(e):{core:e,note:''};
      var mtxt = (SEG.metaLine==='note'&&sp.note) ? sp.note+' · '+p.city : p.city;
      var metaH = '<span class="jr-meta"><span class="jr-mt">'+mtxt+'</span>'
        +(SEG.tierHome==='meta'
          ? '<span class="jr-mtier"><span class="jr-dot">·</span>'+tierHTML(p)+'</span>' : '')
        +'</span>';
      var ring = SEG.comp==='ring'
        ? '<span class="jr-ring">'+ringSVG(pct,NUM.ringSz)
          +(SEG.ringNum==='none'?'':'<span class="rn">'+(SEG.ringNum==='pct'?pct:f)+'</span>')+'</span>' : '';
      var tail='';
      if(SEG.tierHome==='tail') tail+=tierHTML(p);
      if(SEG.cnt==='on')       tail+='<span class="jr-cnt'+(full?' full':'')+'">'+f+'/83</span>';
      /* шеврон — сусід .jr-tail, не її вміст: інакше tierHome=нема + cnt=нема ховає й шеврон */
      h+='<button class="jr-row pressable">'+ring
        +'<span class="jr-txt"><span class="jr-name">'+sp.core+'</span>'+metaH+'</span>'
        +(tail?'<span class="jr-tail">'+tail+'</span>':'')
        +(SEG.chev==='on'?CHEV:'')+'</button>';
    }
    h+='</div>';
  }
  JR.innerHTML=h;
  measureRow(); applyGates();
  if(ISL)ISL.remeasure();
}
/* e · вимір, а не арифметика в голові: rowH мертвий тоді й лише тоді,
   коли фактичний бокс вищий за оголошену підлогу. */
function measureRow(){var r=JR.querySelector('.jr-row');MEASH=r?r.offsetHeight:0;}
/* b · якір лівого роздільника беремо заміром зі стейджа */
function fitDiv(){var r=JR.querySelector('.jr-row'),t=JR.querySelector('.jr-txt');
  if(!r||!t)return;
  var v=Math.round(t.getBoundingClientRect().left-r.getBoundingClientRect().left);
  if(!(v>=0))v=NUM.padX;
  NUM.divL=v;var i=document.querySelector('input[data-k="divL"]');
  if(i){i.value=v;document.getElementById('o_divL').textContent=v;}applyVars();}

/* ══════════ ISLC — фабрика (b28 р.2640; K/FMUL/GAP залочені b17_4) ══════════ */
function makeISLC(root){
  var isl=root.querySelector('.isl'),sp=root.querySelector('.isl-spacer'),
      head=root.querySelector('.isl-head'),SC=root.querySelector('.home-scroll'),ta=root.querySelector('.toparea');
  if(!isl||!sp||!head||!SC||!ta)return null;
  var brand=head.querySelector('.isl-brand'), K=0.28,FMUL=1.35,GAP=10;
  var C={padT:0,headH:0,tierH:0,bord:0,expH:0},ticking=false,tgtP=0,curP=0,rafD=0;
  function clearInline(){brand.style.opacity='';brand.style.visibility='';isl.style.transform='';}
  function writeC(p){if(p<=0){clearInline();return;}
    isl.style.transform='translate3d(0,'+(-(C.headH||54)*p).toFixed(2)+'px,0)';
    brand.style.opacity=Math.max(0,1-p*FMUL).toFixed(3);
    brand.style.visibility=(p>=.999?'hidden':'visible');}
  function dampStep(){rafD=0;var d=tgtP-curP;
    if(Math.abs(d)<0.0015){curP=tgtP;}else{curP+=d*K;rafD=requestAnimationFrame(dampStep);}writeC(curP);}
  function resetDamp(){if(rafD){cancelAnimationFrame(rafD);rafD=0;}tgtP=0;curP=0;}
  function remeasure(){var cs=getComputedStyle(isl);
    C.padT=parseFloat(cs.paddingTop)||0;
    C.bord=(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);
    C.headH=head.offsetHeight;C.tierH=ta.offsetHeight;
    C.expH=C.padT+C.headH+C.tierH+C.bord;sp.style.height=(C.expH+GAP)+'px';}
  function apply(){ticking=false;tgtP=Math.max(0,Math.min(1,Math.max(0,SC.scrollTop)/(C.headH||54)));
    if(!rafD)rafD=requestAnimationFrame(dampStep);}
  SC.addEventListener('scroll',function(){if(ticking)return;ticking=true;requestAnimationFrame(apply);},{passive:true});
  remeasure();
  return {C:C,remeasure:remeasure,guard:function(){if(SC.scrollHeight-SC.clientHeight<24){resetDamp();clearInline();}}};
}
var ISL=null;
function fitSticky(){if(!ISL)return;ISL.remeasure();
  var v=Math.round(ISL.C.expH-ISL.C.headH);NUM.stickyTop=v;
  var r=document.querySelector('input[data-k="stickyTop"]');
  if(r){r.value=v;document.getElementById('o_stickyTop').textContent=v;}applyVars();}

/* ══════════ ДЕВАЙС · ТЕМА · ЗУМ ══════════ */
var FR=document.getElementById('frame'),HOST=document.getElementById('frameHost'),ZOOM=1;
var DEVS={xs:{w:375,h:812,sat:44},p15:{w:393,h:852,sat:59}};
function applyDev(){var d=DEVS[DEV];
  SB.style.width=d.w+'px';SB.style.height=d.h+'px';SB.style.setProperty('--sat',d.sat+'px');
  FR.classList.toggle('dev-xs',DEV==='xs');FR.classList.toggle('dev-p15',DEV==='p15');
  autoFit();if(ISL)ISL.remeasure();}
function autoFit(){var avail=document.getElementById('stageWrap').clientWidth-8;
  setZoom(Math.min(1,avail/(DEVS[DEV].w+12)));}
function setZoom(z){ZOOM=Math.max(.45,Math.min(2,z));
  FR.style.transform='scale('+ZOOM.toFixed(3)+')';
  document.getElementById('zi').textContent=Math.round(ZOOM*100)+'%';
  /* v2-фікс: хост тримає СКЕЙЛЕНУ висоту → під фреймом нема мертвого простору */
  HOST.style.width=Math.ceil((DEVS[DEV].w+12)*ZOOM)+'px';
  HOST.style.height=Math.ceil((DEVS[DEV].h+12)*ZOOM)+'px';}
function setTheme(t){THEME=t;SB.setAttribute('data-theme',t);syncPanel();applyVars();}
function applyPreset(id){var P=PRESETS[id];
  for(var k in P.SEG)SEG[k]=P.SEG[k];
  for(var m in P.NUM)NUM[m]=P.NUM[m];
  if(P.INK){['light','dark'].forEach(function(t){for(var q in P.INK[t])INK[t][q]=P.INK[t][q];});}
  syncPanel();applyVars();renderJournal();
  PIDS.forEach(function(x){document.getElementById(x).classList.toggle('hot',x===id);});}

function writeBet(){var o=document.getElementById('betOut');if(!o)return;
  o.value='JRv3 '+DEV+' | '+Object.keys(NUM).map(function(k){return k+'='+NUM[k];}).join(' ')
    +' | '+Object.keys(SEG).map(function(k){return k+'='+SEG[k];}).join(' ')
    +' | INK.light '+JSON.stringify(INK.light)+' INK.dark '+JSON.stringify(INK.dark);}

document.getElementById('tgDev').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  [].forEach.call(this.children,function(x){x.classList.remove('on');});b.classList.add('on');DEV=b.dataset.d;applyDev();});
document.getElementById('tgTheme').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  [].forEach.call(this.children,function(x){x.classList.remove('on');});b.classList.add('on');setTheme(b.dataset.t);});
PIDS.forEach(function(x){document.getElementById(x).onclick=function(){applyPreset(x);};});
document.getElementById('zIn').onclick=function(){setZoom(ZOOM+.1);};
document.getElementById('zOut').onclick=function(){setZoom(ZOOM-.1);};
document.getElementById('zRst').onclick=function(){setZoom(1);};
document.getElementById('panelTg').onclick=function(){var c=document.getElementById('cats'),hid=c.style.display==='none';
  c.style.display=hid?'':'none';this.textContent=hid?'▾ панель':'▴ панель';
  setTimeout(function(){if(ISL)ISL.remeasure();},60);};
document.getElementById('bet').onclick=function(){writeBet();var o=document.getElementById('betOut');
  try{navigator.clipboard.writeText(o.value);}catch(e){}
  if(o.select)o.select();var b=this;b.textContent='✓';setTimeout(function(){b.textContent='📋';},900);};
var QI=document.getElementById('q'),SR=document.getElementById('srch');
function qsync(){SR.classList.toggle('has-q',!!QI.value);}
QI.addEventListener('input',qsync);
document.getElementById('clrBtn').addEventListener('click',function(){QI.value='';qsync();QI.focus();});
['pointerdown','pointerup','pointercancel','pointerleave'].forEach(function(ev){
  document.addEventListener(ev,function(e){var t=e.target.closest&&e.target.closest('.pressable');if(!t)return;
    t.classList.toggle('is-pressed',ev==='pointerdown');},true);});
document.getElementById('cityrow').innerHTML=
  ['Всі','Дніпро','Новомосковськ','Павлоград','Кам\'янське'].map(function(c,i){
    return '<button class="chip pressable'+(i===0?' on':'')+'">'+c+'</button>';}).join('');

buildPanel();applyDev();applyVars();applyPreset('p3');
ISL=makeISLC(document.querySelector('.app'));
if(ISL){ISL.remeasure();ISL.guard();}
window.addEventListener('resize',function(){autoFit();if(ISL)ISL.remeasure();});
</script>
