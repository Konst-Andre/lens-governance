  Крок 6 (H6.1): Р-50 · ЛОК-РЕГІСТР. Стенд дозволяє крутити будь-що, тому положення
     повзунка і залочене значення на екрані НЕ РОЗРІЗНЯЛИСЬ, і порт міг узяти за канон
     залишок експерименту. Тепер літерали valuesLOCK §11/§12 живуть у об'єкті LOCK
     і показуються БІЛЯ ВАЖЕЛЯ трьома станами: «= ЛОК» · «ЛОК N» (розбіжність,
     друкується КАНОН, не живе) · «нема ЛОКу». Третій стан обов'язковий: без нього
     відсутність значка на geo/act/mat читалась би як «збігається», хоча в valuesLOCK
     цих родин немає взагалі (інший простір імен, §2 ⟂ ST.mat).
     Регістр сам може протухнути — рівно як літерал стелі 1.20 (О-39), — тому панель
     друкує покриття «ЛОК N/M важелів».
     Мертві важелі вилучені з рядка 📋 (Р-50 п.2): у шіті це h% і всі dd*, у дропдауні
     rad і вся ніша. Раніше рядок віддавав h72%, яке в режимі шіта нічого не робить.
     ebDefaults приведено до Р-46 (card.w 600→700 · card.gap 3→2 · jr.gap 0→2) —
     це не перегляд чисел, а виконання device-локу 09.08.2026: стенд стартував не з канону.
     Гейт незмінний: ✓9 · ⚠1 · ✗3.
  Крок 4 (H5.5): ВАЖЕЛІ ЯРУСУ. П'ята вкладка панелі; літерали Кроку 2 стали
     CSS-змінними, які пише applyVars. Спліт (рішення оператора, мікроскоп п.1):
     геометрія й типографіка — на дві РОДИНИ (картка ⟂ журнал), чорнило — на
     родину × ТЕМУ (A39). Кегль по темах не розщеплено свідомо: у стенді geo
     ніколи не був темозалежним, а нерівний кегль між темами ніхто не судить.
     Чорнило зроблено ЗМІННОЮ, а не новим правилом теми: правило дало б дві нові
     ✗ по A69 і зламало б очікуване число гейта. Семпли журналу 3 → 6 у ДВОХ
     групах дат (4+2): без другої групи режим «перший у групі» вироджувався в
     «лише рядок 1». Заміри друкуються в UI (П-25) і нормалізовані на зум (Д-29).
     Гейт незмінний: ✓9 · ⚠1 · ✗3.
  Крок 2 (H5.4): eyebrow мережі — ДВА класи .eb-card ⟂ .eb-jr (Р-44). Один клас
     на два каскади заборонено: різниця контейнерів у боксовій моделі, не в числах.
     Числа 12/600/muted/uppercase/.42px — з Р-44; margin 3px — ставка до Кроку 4.
     Гейт незмінний: ✓9 · ⚠1 · ✗3 (нових dark-правил і голих класів немає).
  Крок 1 (H5.4): додано сцену 5 «список» — картка дошки + рядок журналу з b32.0,
     перенесені ЦІЛІСНИМ вузлом (Д-Е). База сцен 1-4 недоторкана: сітка, NETS,
     P1L, applyVars і cardHTML звірені md5 — байт-в-байт із Кроком 0.
     Гейт: ✓9 · ⚠1 · ✗3 (було ✗1). Дві нові ✗ — .jr-grp і .jr-row::after,
     успадкований борг A69 самого b32.0, не регрес стенда. НЕ лікуються тут.
  Крок 0 (H5.3): фундамент = копія netpick_stagebench_v3_b6 (device✓); старт піднято
  на P1L = розшифровка локу H3.9 §1. Далі — кроки 1..5 §4 H5_2, кожен на девайс окремо.
  БАЗА (недоторкана): вузол B netpick — K_MARK судиться, О-32, актив обирається.
  дім: Project (живий стенд) · сесія H3.7 · 06.08.2026
  b3 (06.08.2026): Д-8 авторські переноси+авто-фіт · Д-9 тап обирає мережу
     · Д-10 plMerge/plBord · Д-11 стелі · Д-12 kNet (О-36)
  b2 (06.08.2026): Д-1 data:-префікс · Д-3 мертвий shadow · Д-4/Д-5 min-content підлога

  варіант анатомії: phone-single-frame (маніфест §4-варіанти) — відповідь оператора «iPhone»
  база (Д-В, провенанс): StockCheck_port_b31.html
     р.653-657  .netbtn 44/R12
     р.662-672  .ntile 35/R12, bscale 1.55, --ntile-gl
     р.45-48    токени світлої · р.85-88 токени темної
     PH: 965 аптек, 16 мереж — лічильники справжні, не синтетичні
  ассети: nets_assets_v2.js вклеєно конкатенацією (П-40 — у контекст не читалось)

<style>
:root{
  --bg:#eef3f1; --bg-soft:#e4ece9; --card:#ffffff; --surface-2:#f4f8f6; --surface-3:#eef4f1;
  --text:#182c28; --text-2:#3c574f; --muted:#6b8c84; --border:#d4e5df; --border-subtle:#e1ebe7;
  --ok:#1f9d57; --crit:#c0392b; --warn:#c8811b;
  --accent:hsl(162 82% 27%); --accent-soft:hsl(162 64% 88%); --accent-ink:hsl(162 82% 16%);
  /* ── Крок 1 (H5.4) · ТОКЕНИ ДОНОРА, світла. Дослівно з b32.0 р.37/43 і р.488-495.
     Д-Ж: перенесений CSS звіряється за списком var(--…) — 64 знайдено, 12 уже було,
     52 принесено. --Lbase/--Dbase у списку немає навмисно: вони оголошені всередині
     самого правила .hist і приходять разом із ним, не з блока токенів. ── */
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --hcRadius:20px; --hcPad:12px; --hcGap:9px;
  --ringSize:62px; --ringStroke:5; --numSize:23px; --numWeight:800; --statusSize:11px;
  --addrSize:15px; --addrWeight:650; --citySize:12.5px; --anchorMut:46; --statusY:1px;
  --ringTrack:#dbe8e2; --cardShadow:0 1px 3px rgba(20,50,42,.08),0 4px 14px rgba(20,50,42,.05);
  --fillFullH:150; --fillFullS:55; --fillFullL:46; --fillPartH:175; --fillPartS:60; --fillPartL:46;
  --statusH:160; --statusS:58; --statusL:37;
  --hcOtcH:160; --hcOtcS:55; --hcOtcL:40; --hcIwH:210; --hcIwS:48; --hcIwL:44;
  --dimMix:16; --dimSat:70; --dimOp:60;
}
[data-theme="dark"]{
  --bg:#0d1512; --bg-soft:#151e1a; --card:#18221e; --surface-2:#1c2723; --surface-3:#212d28;
  --text:#e8f0ec; --text-2:#a7c0b8; --muted:#7c968d; --border:#2a3833; --border-subtle:#222e29;
  --ok:#33c06f; --crit:#e0685c; --warn:#e0a94a;
  --accent:hsl(163 46% 46%); --accent-soft:hsl(163 37% 17%); --accent-ink:hsl(163 46% 68%);
  /* Крок 1 · ті самі токени в темних значеннях — b32.0 р.90-94 дослівно. */
  --statusY:0px; --ringTrack:#2a3833; --cardShadow:none;
  --fillFullH:155; --fillFullS:55; --fillFullL:50; --fillPartH:168; --fillPartS:55; --fillPartL:50;
  --statusH:163; --statusS:55; --statusL:55;
  --hcOtcH:162; --hcOtcS:46; --hcOtcL:55; --hcIwH:210; --hcIwS:48; --hcIwL:60;
  --dimMix:30; --dimSat:60; --dimOp:50;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"Manrope",system-ui,sans-serif;background:#101418;color:#dfe7e4;
  display:flex;flex-direction:column;height:100dvh;-webkit-user-select:none;user-select:none}
*{-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}

/* ── СТЕЙДЖ ────────────────────────────────────────────────────────── */
#stageWrap{flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:flex-start;
  justify-content:center;padding:6px;background:
  repeating-conic-gradient(#171c21 0% 25%,#141a1f 0% 50%) 50%/16px 16px}
#frameBox{transform-origin:top center}
.frame{position:relative;background:#000;border-radius:44px;padding:10px;
  box-shadow:0 0 0 2px #2a3138,0 18px 40px rgba(0,0,0,.55)}
.screenbox{position:relative;overflow:hidden;border-radius:36px;background:var(--bg);
  color:var(--text);display:flex;flex-direction:column}
.sbar{height:var(--sbH);flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:700;letter-spacing:.2px;position:relative;z-index:3}
/* Д-6 (b2): було 􀙇􀛨􀋨 — приватні гліфи SF Symbols. Поза нативним iOS вони
   падають у .notdef і рамка перестає читатись як телефон. Малюємо явно. */
.sbar-r{display:flex;align-items:center;gap:5px;color:var(--text)}
.sbar-r svg{display:block}
.batt{width:24px;height:11.5px;border-radius:3px;border:1px solid currentColor;opacity:.9;
  position:relative;display:block;padding:1.5px}
.batt::after{content:"";position:absolute;right:-3px;top:3.5px;width:1.6px;height:4px;
  border-radius:0 1px 1px 0;background:currentColor}
.batt i{display:block;height:100%;width:81%;border-radius:1.2px;background:currentColor}
.notch{position:absolute;left:50%;transform:translateX(-50%);background:#000;z-index:4}
.notch.xs{top:0;width:154px;height:30px;border-radius:0 0 18px 18px}
.notch.p15{top:9px;width:120px;height:32px;border-radius:18px}
.hind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:132px;height:5px;
  border-radius:3px;background:var(--text);opacity:.32;z-index:5}
.scene{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:10px 14px calc(var(--saB) + 12px)}
.sc-h{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin:2px 0 10px}

/* ── ПЛИТКА МЕРЕЖІ — предмет судження ──────────────────────────────── */
/* Д-4 (b2): 1fr має min-content підлогу — «Бажаємо здоров\'я» розпирало колонку
   й давало горизонтальний скрол на XS (на 15 Pro ховалось за 18px запасу).
   minmax(0,1fr) знімає підлогу; перенос слова робить overflow-wrap нижче. */
#grid{display:grid;gap:var(--gY) var(--gX);align-items:stretch;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.ncard{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;
  padding:var(--pad);border-radius:calc(var(--rad) + var(--pad));
  background:var(--tileBg);border:1px solid var(--tileBd);position:relative;
  box-shadow:var(--tileSh,none);   /* Д-3 (b2): важіль shadow був мертвий — писався в --shadow, який ніхто не читав */
  transition:background .16s,border-color .16s,box-shadow .16s,transform .16s}
/* Д-20 (b4): позиційований ::after малюється ПІСЛЯ непозиційованих дітей, тобто
   біле світло гребеня накривало верх білої плити і верх знака. На темній це
   підмішувало білого просто в знак. Тепер порядок керований важелем ridgeOver:
   ro-0 (дефолт) — плита над гребенем, П-25 недоторканий;
   ro-1 — гребінь поверх усього, капсула світиться як одне тіло. */
.ncard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,var(--ridge)),rgba(255,255,255,0) 42%)}
/* ПЛИТА під знаком — БІЛА В ОБОХ ТЕМАХ (П-25, реєстр §5). НЕ важіль. */
/* Д-10 (b3): plMerge=0 → #FFFFFF, тобто П-25 дотримано за замовчуванням.
   Ненульове значення — КАНДИДАТ НА ВИНЯТОК, який судиться оком, а не приймається мовчки. */
.plate{width:var(--plate);height:var(--plate);border-radius:var(--rad);
  background:var(--plateBg,#FFFFFF);display:grid;place-items:center;overflow:hidden;flex:none;
  border:var(--plBdW,0px) solid var(--plBd,transparent);
  position:relative;z-index:var(--plateZ,1);
  padding:calc(var(--plate) * var(--sgPad) / 100)}
/* Д-24 (b6) · KNET БУВ ПРИЛАДОМ НА ОДНУ ШКАЛУ З ШІСТНАДЦЯТИ.
   Було: `.ncard.is-sel{--kThis:var(--kSel)}` — змінна --kSel одна на кадр і несла k
   ОБРАНОЇ мережі, а селектор чіпляв лише обрану картку. Наслідок: оператор крутив
   kNet, бачив реакцію однієї плитки, решта 15 стояли на k=1 — і весь блок kNets §1
   самері H3.8 заміряний під цим дефектом.
   Стало: applyVars() пише 16 змінних `--k-<SLUG>` на :root кадру, cardHTML дає картці
   СТАТИЧНИЙ інлайн `--kThis:var(--k-SLUG)`. Інлайн статичний → рух повзунка міняє
   змінну, DOM не перебудовується (К-10 не порушено). Одне джерело замість двох. */
.plate img{width:100%;height:100%;object-fit:contain;display:block;
  transform:scale(calc(var(--kMark) * var(--kThis,1)));transform-origin:center}
/* Д-17 (b4): гліф не читав --kThis — kNet мовчки нічого не робив на Фармасторі,
   тобто важіль був живий на 15 мережах із 16 і мертвий саме на тій, що не растр. */
.plate .glyphwrap{width:100%;height:100%;display:grid;place-items:center;
  transform:scale(calc(var(--kMark) * var(--kThis,1)))}
/* Д-7 (b2): два рядки зарезервовані завжди — інакше картка з однорядковим
   підписом коротша, і ряд сітки читається як збій вирівнювання, а не як дані. */
/* Д-8: hyphens:none — переноси більше не обчислюються, вони задані в даних.
   min-height рахується від БАЗОВОГО --lblSz, а не від зменшеного авто-фітом,
   інакше картки з дрібнішим шрифтом просідали б і ряд ламався б удруге. */
.nlbl{font-size:var(--lblSz);line-height:1.18;font-weight:650;text-align:center;color:var(--text);
  width:100%;min-width:0;overflow:hidden;hyphens:none;overflow-wrap:normal;
  min-height:calc(var(--lblSz) * 2.36);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.nlbl span{display:block;white-space:nowrap}
.ncnt{font-size:var(--cntSz);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* активний стан — НЕЙТРАЛЬНИМИ засобами (П-24). Колір мережі за плиту не виходить. */
/* Д-22 (b4): раніше --actBd/--actBg рахувались ОДИН раз на кадр із поточного режиму,
   а режим стояв класом на картці. На S3 це давало чотири комірки з однаковими
   значеннями й різними підписами: «A рамка» ніколи не показувала режим A.
   Гілкування перенесене сюди — apply() пише всі варіанти, клас обирає.
   Наслідок: liftA більше не має гілки `mode==="b"?100:…` (Д-13). */
/* b5 · КАНАЛИ АКТИВУ. Чотири зашиті режими були чотирма ставками автора:
   п'яту комбінацію оператор не міг зібрати в принципі. Тепер кожен канал
   незалежний, а «режим» = іменований набір каналів, який зберігається в слот.
   Гібрид «тон+підйом» тут не нова конструкція, а дві ручки, підняті разом. */
.ncard.is-act{background:var(--actBg);border-color:var(--actBd);border-width:var(--ringW);
  padding:calc(var(--pad) - var(--ringW) + 1px);
  transform:translateY(calc(var(--actLift) * -1px)) scale(var(--actScale))}
.ncard.is-act .plate{box-shadow:0 0 0 var(--plRingW) var(--plRing)}
.ncard.is-act .nlbl{color:var(--actLbl)}
.ncard.is-act::before{content:"";position:absolute;top:-5px;right:-5px;width:17px;height:17px;
  opacity:var(--actChk,0);pointer-events:none;
  border-radius:50%;background:var(--accent);z-index:2;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12l5 5L20 6'/></svg>");
  background-size:11px;background-repeat:no-repeat;background-position:center}
/* b5: правила .m-c / .m-d видалені — їхня робота перейшла в канали chk і lift. */

/* ── S2 ізольована ─────────────────────────────────────────────────── */
.iso{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:8px}
.iso-row{display:flex;align-items:flex-end;gap:22px}
.iso-cap{font-size:10px;color:var(--muted);text-align:center;margin-top:6px;font-weight:700}
.mini{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background:#FFFFFF;flex:none;padding:calc(35px * var(--sgPad) / 100)}
.mini img{width:100%;height:100%;object-fit:contain;
  transform:scale(calc(var(--kMark) * var(--kThis,1)))}
.netbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border)}
.ntile{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(180deg,rgb(89,170,109),rgb(66,158,89));
  box-shadow:0 2px 5px rgba(20,50,42,.10)}
[data-theme="dark"] .ntile{background:linear-gradient(180deg,rgb(77,153,96),rgb(68,136,85));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.10)}
.ntile{--ntile-gl:#ffffff}
[data-theme="dark"] .ntile{--ntile-gl:rgb(233,241,235)}
.bscale{display:grid;place-items:center;transform:scale(1.55)}
/* b6 · межа kNet на гліфі. `.mini` — це mini-ассет Фармастора, тобто ПРЕДМЕТ тюну:
   він мусить їхати за kNet нарівні з mini-растрами решти 15 мереж, інакше на стенді
   підіймеш Фармастор і не побачиш, що станеться з кнопкою в продукті.
   `.netbtn` НЕ чіпаємо свідомо: його підпис каже «живий b31», тобто це КОНТРОЛЬ —
   поточний стан продукту, з яким порівнюєш. Якби він їхав разом, база порівняння
   зникла б, а підпис став би брехнею (К-8: область дії оголошена в ярлику). */
.mini .bscale{transform:scale(calc(1.55 * var(--kThis,1)))}

/* ── S3 актив ──────────────────────────────────────────────────────── */
.actrow{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.actcell{display:flex;flex-direction:column;align-items:center;gap:6px}

/* ══════════════════════════════════════════════════════════════════════════
   КРОК 1 (H5.4) · ВУЗОЛ «СПИСОК» — перенесено з StockCheck_port_b32_0.html
   ЦІЛІСНИМ вузлом (метод Д-Е): розмітка + CSS + токени + @media-близнюки.
   Зрізи донора: р.501-575 (картка) · р.589-604 (dim + .card.tr + близнюки)
                 р.747-796 (журнал).
   НЕ взято: р.576-588 (.ro-flag / #s-fill.ro) — це екран заповнення, у списку
   такого стану не існує.
   ЄДИНА правка донора: .list втратив margin:0 14px. Число: .scene стенда вже
   несе padding:10px 14px (р.72) → донор дав би 28. Еталон «14…14» заміряний
   лінійкою 03.08 і названий у шапці CSS журналу b32.0.
   ГЕЙТ: два ✗ H3 (.jr-grp, .jr-row::after) — успадкований борг A69 САМОГО b32.0,
   не регрес стенда. Свідомо НЕ лікуються тут: стенд мусить бути копією того,
   що судиться, а не чистішим за нього. Очікуваний підсумок ✓9 · ⚠1 · ✗3.
   ══════════════════════════════════════════════════════════════════════════ */
/* Крок 1: бічні поля знято — їх дає .scene стенда (14). Вертикальні теж:
   сцена сама тримає padding-bottom із safe-area. gap лишається донорським. */
.list{display:flex;flex-direction:column;gap:var(--hcGap)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--hcRadius);
  padding:var(--hcPad);box-shadow:var(--cardShadow);position:relative;overflow:hidden;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"id rt" "foot foot";
  column-gap:12px;row-gap:10px;align-items:start;transition:transform .12s ease}
.card.is-pressed{transform:scale(.985)}
[data-theme="dark"] .card{background:linear-gradient(180deg,#1a251f,#161f1b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.22)}
.idcol{grid-area:id;min-width:0}
.addr{font-size:var(--addrSize);font-weight:var(--addrWeight);color:var(--text);line-height:1.22;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.city{font-size:var(--citySize);color:var(--muted);margin-top:2px}
.tier{margin-top:7px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600}
.tier .dot{color:var(--muted);font-weight:400}
.tier .otc{color:hsl(var(--hcOtcH) calc(var(--hcOtcS)*1%) calc(var(--hcOtcL)*1%))}
.tier .iw{color:hsl(var(--hcIwH) calc(var(--hcIwS)*1%) calc(var(--hcIwL)*1%))}
.rt{grid-area:rt;display:flex;flex-direction:column;align-items:center;gap:3px}
.ring{position:relative;width:var(--ringSize);height:var(--ringSize);flex:0 0 auto}
.ring svg{display:block}
.ring circle{fill:none}
@keyframes pulseF{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.ring.pulsing{animation:pulseF 460ms cubic-bezier(.34,1.56,.64,1)}
.amid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1}
.ring.arcm .amid{justify-content:center;padding-bottom:calc(var(--ringSize)*.15)}
.fig{font-size:var(--numSize);font-weight:var(--numWeight);color:var(--text);line-height:.95;font-variant-numeric:tabular-nums}
.den{font-size:calc(var(--numSize)*.42);color:var(--muted);font-weight:600;line-height:1}
.arcword{position:absolute;left:0;right:0;bottom:calc(var(--ringSize)*.02);text-align:center;
  font-size:calc(var(--statusSize)*.92);font-weight:700;letter-spacing:.2px;white-space:nowrap;
  color:hsl(var(--statusH) calc(var(--statusS)*1%) calc(var(--statusL)*1%));transform:translate(0,var(--statusY))}
.arcword.chk{color:var(--accent-ink)}
[data-theme="dark"] .arcword.chk{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .arcword.chk{color:var(--accent)}}
.newmark{font-size:calc(var(--numSize)*1.1);font-weight:300;color:var(--muted);line-height:1}
.foot{grid-area:foot;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border-top:1px solid var(--border-subtle);padding-top:9px}
.anchor,.date{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* ===== BADGE «Історія · N» (§5.2 порт · valuesLOCK device✓ b14) — тихий soft-fill chip, L/D split ===== */
:root{
  --bH:30px; --bPadX:10px; --bRad:10px; --bGap:5px; --bIcon:14px; --bChev:13px; --bFont:12px;
  --Lfill:37; --Lbord:20; --Lshadow:18; --Lgrad:14; --LvalL:70;
  --Dfill:44; --Dridge:18; --Dbord:55; --DvalL:70;
  --LaccAmt:0; --DaccAmt:10; --accS:20; --accL:42;
  --bDisOp:46; --bPress:.88;}
.hist{display:inline-flex;align-items:center;gap:var(--bGap);height:var(--bH);padding:0 var(--bPadX);
  border-radius:var(--bRad);font:800 var(--bFont)/1 var(--font);border:1px solid;background:transparent;
  cursor:pointer;flex:0 0 auto;-webkit-appearance:none;white-space:nowrap;transition:transform 280ms var(--spring)}
/* ☀ LIGHT (default) — нейтр-fill + lift(повний) + sheen + border + txt-L (+accent overlay=0) */
.hist{
  --Lbase:color-mix(in srgb, var(--bg-soft) calc(var(--Lfill)*1%), var(--card));
  background:
    linear-gradient(180deg, rgba(255,255,255, calc(var(--Lgrad)*.01)), rgba(255,255,255,0)),
    color-mix(in srgb, hsl(162 calc(var(--accS)*1%) calc(var(--accL)*1%)) calc(var(--LaccAmt)*1%), var(--Lbase));
  border-color:color-mix(in srgb, hsl(162 calc(var(--accS)*1%) calc(var(--accL)*1%)) calc(var(--LaccAmt)*1%),
     color-mix(in srgb, var(--muted) calc(var(--Lbord)*1%), var(--border)));
  color:color-mix(in srgb, var(--accent-ink) calc(var(--LaccAmt)*1%),
     color-mix(in srgb, var(--text) calc(var(--LvalL)*1%), var(--muted)));
  box-shadow:0 calc(var(--Lshadow)*0.04px) calc(var(--Lshadow)*0.2px) rgba(20,50,42, calc(var(--Lshadow)*0.004));}
/* ☾ DARK — tone-lift + ridge + border + txt-L (+accent overlay=шепіт teal) */
[data-theme="dark"] .hist, :root:not([data-theme="light"]) .hist{
  --Dbase:color-mix(in srgb, var(--surface-3) calc(var(--Dfill)*1%), var(--card));
  background:color-mix(in srgb, hsl(163 calc(var(--accS)*1%) calc(var(--accL)*1%)) calc(var(--DaccAmt)*1%), var(--Dbase));
  border-color:color-mix(in srgb, hsl(163 calc(var(--accS)*1%) calc(var(--accL)*1%)) calc(var(--DaccAmt)*1%),
     color-mix(in srgb, var(--border) calc(var(--Dbord)*1%), var(--border-subtle)));
  color:color-mix(in srgb, var(--accent-ink) calc(var(--DaccAmt)*1%),
     color-mix(in srgb, var(--text) calc(var(--DvalL)*1%), var(--muted)));
  box-shadow:inset 0 1px 0 rgba(255,255,255, calc(var(--Dridge)*.01));}
.hist .h-ico{display:inline-flex;width:var(--bIcon);height:var(--bIcon);flex:0 0 auto}
.hist .h-ico svg{width:100%;height:100%;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hist .h-sep{margin:0 3px;opacity:.5;font-weight:600}
.hist .h-n{font-weight:800;font-variant-numeric:tabular-nums}
.hist .h-chev{display:inline-flex;width:var(--bChev);height:var(--bChev);opacity:.55;margin-left:1px;flex:0 0 auto}
.hist .h-chev svg{width:100%;height:100%;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hist.dis{opacity:calc(var(--bDisOp)*.01);pointer-events:none;cursor:default}
.hist.pressing{transform:scale(var(--bPress));transition-duration:80ms}
@media (prefers-reduced-motion:reduce){.hist{transition-duration:.01ms!important}}
/* §5.2 перенесена: dim БЕЗ whole-card opacity → ринг тримається на arcLift, текст-привид на dimOp */
:root{--arcLift:.82}
.card.tr{filter:saturate(calc(var(--dimSat)*1%));
  background:color-mix(in srgb,var(--card) calc(100% - var(--dimMix)*1%),var(--bg))}
[data-theme="dark"] .card.tr{background:color-mix(in srgb,#18221e calc(100% - var(--dimMix)*1%),var(--bg))}
.card.tr .idcol,.card.tr .foot{opacity:calc(var(--dimOp)*1%)}
.card.tr .rt{opacity:var(--arcLift)}
.trbadge{display:inline-flex;align-items:center;gap:4px;font:700 10px/1 var(--font);color:var(--muted);white-space:nowrap}
.trbadge .ck{color:var(--accent-ink);font-weight:800;font-size:11px}
[data-theme="dark"] .trbadge .ck{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trbadge .ck{color:var(--accent)}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .card{background:linear-gradient(180deg,#1a251f,#161f1b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.22)}
  :root:not([data-theme="light"]) .card.tr{background:color-mix(in srgb,#18221e calc(100% - var(--dimMix)*1%),var(--bg))}
}

/* ── журнал: b32.0 р.747-796 без правок ── */
.jr{padding:0 0 8px;margin:0}
/* b29.6 · ЕТАЛОН — картка ДОШКИ, не острів. Замір лінійкою (03.08.2026, XS/375):
   .list 14…14 · .card 14…14 · .isl 12…12 → Δ картка−острів = 2/2. Саме ця
   вкладеність у 2px і читається як «плавний перехід». Журнал рівнявся на 12,
   тобто на рівність з островом — стан, якого на Home ніколи не було.
   Знято обидва бічні поля: .jr більше не компенсує контейнер (від'ємний margin
   на flex-item тут ефекту не давав — заміряно, jr показував 14…14), .jr-grp
   більше не додає свої 12. Група успадковує 14 від .list = піксель-у-піксель
   як .card. Мертве правило margin:0 -14px знято НАВМИСНО: одного дня воно
   могло б ожити й тихо поїхати на 0…0. */
.jr-grp{margin:0 0 12px;border-radius:16px;overflow:hidden;
  background:var(--card);border:1px solid var(--border-subtle)}
[data-theme="dark"] .jr-grp{border-color:var(--border)}
.jr-hdr{display:flex;align-items:baseline;gap:8px;margin:10px 0 7px;padding:3px 14px;
  font:800 11px/1.1 var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.jr-hdr .n{margin-left:auto;font:700 10.5px/1 var(--font);letter-spacing:0;text-transform:none;
  color:color-mix(in srgb,var(--muted) 78%,var(--bg));font-variant-numeric:tabular-nums}
.jr-row{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;
  padding:10px 14px;background:transparent;border:none;position:relative;
  font-family:var(--font);text-align:left;cursor:pointer}
/* divL/divR розщеплені (П-10) — але обидва якорі заміряні й дали 14:
   ліва сторона стоїть на початку тексту (padding-left рядка, дуга праворуч),
   права — на паддінгу картки. Було 16/18 — асиметрія без якоря. */
.jr-row::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:1px;
  background:color-mix(in srgb,var(--border) 73%,transparent)}
[data-theme="dark"] .jr-row::after{background:color-mix(in srgb,var(--border) 82%,transparent)}
.jr-grp .jr-row:last-child::after{display:none}
.jr-row.is-pressed{background:color-mix(in srgb,var(--accent) 9%,transparent)}
/* ringSide=right через flex order — DOM стабільний, рядок не перебудовується */
.jr-ring{flex:0 0 auto;position:relative;width:28px;height:28px;display:grid;place-items:center;order:5}
.jr-ring svg{display:block;position:absolute;inset:0}
.jr-ring .rn{position:relative;font:800 9.24px/1 var(--font);color:var(--text-2);
  font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.jr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center;order:2}
/* nameFit=повністю — еліпсиса НЕМА свідомо: обрізане ядро гірше за перенесене (анти-правило QR B59) */
.jr-name{font:700 14px/1.28 var(--font);white-space:normal;color:var(--text)}
/* D-7: overflow:hidden потрібен еліпсису орієнтира і він же різав inline-бокс тира.
   Розщеплення: .jr-mt несе текст+еліпсис, .jr-mtier — сусідній flex:none бокс. */
.jr-meta{font:600 11.5px/1.3 var(--font);display:flex;align-items:center;gap:5px;min-width:0;
  color:color-mix(in srgb,var(--muted) 90%,var(--bg))}
.jr-mt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.jr-mtier{flex:0 0 auto;display:flex;align-items:center;gap:5px}
/* З-7: тир успадковує представлення активної картки — ті самі --hcOtc*/--hcIw*, що .tier */
.jr-tg{font:700 11px/1.2 var(--font);white-space:nowrap;letter-spacing:.1px}
.jr-otc{color:hsl(var(--hcOtcH) calc(var(--hcOtcS)*1%) calc(var(--hcOtcL)*1%))}
.jr-iw{color:hsl(var(--hcIwH) calc(var(--hcIwS)*1%) calc(var(--hcIwL)*1%))}
.jr-dot{color:color-mix(in srgb,var(--muted) 90%,var(--bg));font-weight:400;opacity:.75}
/* шеврон нейтральний за задумом: колір у рядку вже семантичний канал (OTC/IW/дуга) */
.jr-chev{width:15px;height:15px;flex:none;opacity:.44;color:var(--muted);order:9}
.jr-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
/* ══ КРОК 2 (H5.4) · NETWORK EYEBROW — Р-44 (H5_1 §1, чинне рішення оператора) ══
   ДВА КЛАСИ, НЕ ОДИН. Це не дубль і не косметика: контейнери мають різну боксову
   модель, і саме на цьому впав v2 (§1.3 H5_2).
     .idcol — звичайний блок: усі сусіди (.addr/.city/.tier) блокові, відступ між
              ярусами робить margin, бо margin між блоками — єдиний канал, який
              тут працює.
     .jr-txt — flex-колонка з gap:2px: інлайновий вузол усередині неї СТАЄ
              flex-item, тобто вже поводиться як блок. Задавати йому блоковість
              не треба, а margin-bottom склався б із gap і подвоїв би відступ.
     ⚠ теги в цьому коментарі названі словами навмисно: цитата розмітки в
       коментарі ламає лічильник балансу H2 (wsd 3.11).
   У v2 спліт зробили по ЗМІННИХ (--ebSz/--ebSzJ) — числа були різні, а бокс той
   самий, тому яруси злиплись у рядок. Розщеплювати треба було модель, не число.
   ЧИСЛА: 12px/600/muted/uppercase — Р-44 §1.1 дослівно. letter-spacing .42px
   = .035em, середина вилки .03–.04em.
   ⚠ margin-bottom:3px — СТАВКА, не замір (сусіди в .idcol дають 2 і 7, узято між).
     У канон без заміру не піде; важіль ebGapB — Крок 4. */
/* Крок 4 · числа Кроку 2 стали важелями. Фолбеки в var() навмисні: шорткат font
   з невизначеною змінною валиться цілком, і ярус лишився б без кегля взагалі.
   Чорнило — тільки muted із прозорістю (Р-44 п.4), через color-mix, а не opacity:
   opacity зробила б окремий шар композиції на елементі, який ми ж і судимо.
   Відступ журналу ДОДАЄТЬСЯ до gap батька (2px): важіль 3 = ефективні 5. */
.eb-card{font:var(--ebWC,600) var(--ebSzC,12px)/1.15 var(--font);
  color:color-mix(in srgb,var(--muted) var(--ebInkC,100%),transparent);
  text-transform:var(--ebCsC,uppercase);letter-spacing:var(--ebTrC,.42px);
  margin-bottom:var(--ebGapC,3px)}
.eb-jr{font:var(--ebWJ,600) var(--ebSzJ,12px)/1.15 var(--font);
  color:color-mix(in srgb,var(--muted) var(--ebInkJ,100%),transparent);
  text-transform:var(--ebCsJ,uppercase);letter-spacing:var(--ebTrJ,.42px);
  margin-bottom:var(--ebGapJ,0px)}
/* ══ КРОК 3 (H5.5) · КОНТЕЙНЕР О-47 ═══════════════════════════════════════
   Донори з b32.0, перенесені ЦІЛІСНИМ вузлом (Д-Е): .isl р.609-631 (обидві форми
   теми) · .sheet/.sheet-scrim/.grip р.216-224 + @media-близнюки р.942-943.
   ДВІ адаптації, обидві вимушені й названі:
     1) position:fixed → absolute. У продукті шіт кріпиться до вьюпорта; у стенді
        вьюпорт — не телефон, а вікно браузера, і fixed виїхав би за рамку. Якорем
        стає скрінбокс, який уже position:relative.
     2) env(safe-area-inset-top) → var(--sbH). У продукті верхнє поле дає OS; тут
        статус-бар — намальований елемент відомої висоти. Намір той самий: скло
        починається під годинником.
   Дропдаун донора НЕ має — у b32.0 його не існує. Він будується тут і навмисно
   бере ТІ САМІ токени, що шіт: інакше кандидат програвав би за матеріал, а не
   за форму (мікроскоп п.1). Тем-залежних правил у нього немає — лише токени,
   тому й нових ✗ по A69 він не додає.
   Свайпу немає: у b32.0 touchstart/sh-grip = 0, і вносити жест сюди означало б
   судити те, чого в продукті нема. Грип лишається як візуальний афорданс. */
#ov{position:absolute;inset:0;z-index:2;pointer-events:none}
/* ⚠ ДЕФЕКТ (device-зловлено): тут стояло правило на дітей шару через #ov.
   Селектор з id має вагу 1,0,0 і перебивав донорське правило скрима (0,1,0) —
   тобто НЕВИДИМИЙ закритий скрим отримував pointer-events:auto, лежав поверх
   острівця й ковтав кожен тап. Кнопка була жива, до неї просто ніщо не доходило.
   Урок: зручне «увімкнути події всім дітям» через id глушить точкові правила
   донора, і жоден детектор цього не бачить — jsdom клікає елемент напряму, повз hit-testing.
   Тепер події вмикаються поіменно. */
.isl{pointer-events:auto}
.sheet{pointer-events:auto}
.scene.lock{overflow:hidden}
.isl{position:absolute;top:0;left:12px;right:12px;border-radius:0 0 24px 24px;overflow:hidden;
  padding-top:calc(var(--sbH) + 10px);
  background:rgba(245,249,247,.82);
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);
  border:1px solid rgba(20,50,42,.137);border-top-color:transparent;
  box-shadow:0 5px 16px -6px rgba(20,50,42,.18),0 2px 6px rgba(20,50,42,.08)}
[data-theme="dark"] .isl{background:rgba(38,51,46,.82);border-color:rgba(255,255,255,.091);
  border-top-color:transparent;box-shadow:0 6px 18px -8px rgba(0,0,0,.40)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .isl{background:rgba(38,51,46,.82);border-color:rgba(255,255,255,.091);border-top-color:transparent;box-shadow:0 6px 18px -8px rgba(0,0,0,.40)}}
.isl-brand{display:flex;align-items:center;gap:9px;padding:0 12px 10px;overflow:hidden;min-height:0}
.sc-brand{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.sc-wm{font:800 24px/1 var(--font);letter-spacing:-1.2px;white-space:nowrap}
.sc-wm .s1{color:var(--text)} .sc-wm .s2{color:var(--accent)}
.isl-actions{display:flex;align-items:center;gap:8px;flex:none}
/* Кебаб — донор р.653-658, у стенді МЕРТВИЙ (без обробника). Він тут не заради
   краси: без нього кнопка мереж стоїть на 52px правіше, ніж у продукті, а до неї
   прив'язаний дропдаун. Тригер мусить стояти там, де він стоїть у білді. */
.isl-menu{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border)}
.isl-menu svg{width:19px;height:19px;display:block;color:var(--text-2)}
.isl-spacer{flex:none;height:64px}
/* шіт — донор */
.sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,calc(var(--o47Scrim,42) / 100));
  opacity:0;pointer-events:none;transition:opacity .22s ease}
.sheet-scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);
  border-radius:var(--o47Rad,20px) var(--o47Rad,20px) 0 0;
  padding:8px 0 calc(10px + var(--saB));transform:translateY(100%);
  max-height:92%;display:flex;flex-direction:column;
  transition:transform var(--o47Dur,260ms) cubic-bezier(.32,.72,0,1)}
/* Крок 5 · Р-48. Висота шіта БІЛЬШЕ НЕ ВІДСОТОК екрана. Замір показав, що поріг
   появи третього ряду — те саме число в px на обох пристроях (xs 409–414,
   p15 409–417), а % лише перевиражав його через різні висоти екранів. Тому
   висоту тепер задає вміст: ніша має стелю в px, шіт росте під неї, а 92% тут
   лишається запобіжником на випадок майбутньої сітки з більшою кількістю рядів. */
[data-theme="dark"] .sheet{background:var(--card)}
.sheet.on{transform:translateY(0);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
[data-theme="dark"] .sheet.on{box-shadow:0 -8px 30px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet{background:var(--card)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet.on{box-shadow:0 -8px 30px rgba(0,0,0,.5)}}
.grip{width:38px;height:4px;border-radius:4px;background:var(--border);margin:6px auto 8px}
/* Крок 5 · НІША. Скрол переїхав із .sh-body у .sh-well: обрізає ряд саме ніша
   своїм краєм, а не невидима межа тіла шіта — інакше радіус ніші ніколи не
   з'явився б у кадрі, бо вміст ріс би на всю висоту. */
.sh-body{padding:0 14px;position:relative}
/* Заглиблення, а не підйом (Р-49). Плитка залочена проти --bg: на острівці вона
   +9 світліша за тло і підіймається, а на --card шіта виявляється на ~3 темнішою
   і стає ямкою. Піднімати плитку не можна — це другий вигляд того самого
   предмета; опускаємо контейнер, і локнуті числа P1L працюють недоторканими. */
.sh-well{max-height:var(--wellH,420px);overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--wellBg,var(--bg));border-radius:var(--wellRad,14px);
  padding:var(--wellPad,10px)}
/* Fade тоном, не блюром (A45): на OLED розмиття читається як disabled і б'є по
   растру знака, який і так на порозі розпізнавання. Живе на .sh-body, бо
   absolute усередині скрол-контейнера їхав би разом із вмістом. */
.sh-body::after{content:"";position:absolute;left:14px;right:14px;bottom:0;
  height:var(--fadePx,0px);pointer-events:none;
  border-radius:0 0 var(--wellRad,14px) var(--wellRad,14px);
  background:linear-gradient(180deg,rgba(0,0,0,0),var(--wellBg,var(--bg)))}
/* дропдаун — новий кандидат на тих самих токенах */
.ddown{position:absolute;right:12px;top:var(--o47DdTop,64px);width:var(--o47DdW,86%);
  background:var(--card);border:1px solid var(--border);border-radius:var(--o47DdRad,16px);
  box-shadow:0 12px 32px -8px rgba(20,50,42,.28);
  max-height:var(--o47H,72%);overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;
  transform-origin:top right;transform:scale(.94);opacity:0;pointer-events:none;
  transition:transform var(--o47Dur,260ms) cubic-bezier(.32,.72,0,1),opacity var(--o47Dur,260ms) ease}
.ddown.on{transform:scale(1);opacity:1;pointer-events:auto}
</style>

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function mk(key,name,min,max,step,hint,get,set,cls){
  var w=el("div","lv"+(cls?" "+cls:""));
  w.innerHTML='<b>'+name+'</b>';
  var i=document.createElement("input");
  i.type="range";i.min=min;i.max=max;i.step=step;i.value=get();
  var v=el("span","val",fmt(get(),step));
  i.addEventListener("input",function(){set(parseFloat(i.value));v.textContent=fmt(parseFloat(i.value),step);apply();});
  i.title=hint;w.appendChild(i);w.appendChild(v);w.dataset.k=key;
  return w;
}
function fmt(v,s){return s<1?v.toFixed(2).replace(/0$/,""):String(v);}

   він показував би стан на момент побудови панелі й брехав би рівно під час тюну.
   Тема перемальовує панель цілком (sgTheme → buildPanel), тож per-theme ЛОКи
   (ebInk, ніша тон) окремої обробки не потребують. */
var LOCK_ROWS=[];
function addLock(row,get,lockVal,note){
  var b=el("span","lk");

  LOCK_ROWS.push({b:b,get:get,v:lockVal,note:note||"нема ЛОКу"});

}
/* Покриття шукається за ОЗНАКОЮ «важіль має data-k», не за списком імен: список

function lockPassNone(){
  var rows=document.querySelectorAll(".fam .lv[data-k]");
  for(var i=0;i<rows.length;i++){
    if(rows[i].querySelector(".lk")) continue;
    var b=el("span","lk no"); b.textContent="нема ЛОКу";
    rows[i].insertBefore(b,rows[i].querySelector(".val"));
    LOCK_ROWS.push({b:b,get:null,v:null,note:"нема ЛОКу"});

}
function lkPaint(r){
  if(r.v==null||!r.get){r.b.className="lk no";r.b.textContent=r.note;return 0;}
  var eq=Math.abs(r.get()-r.v)<1e-9;
  r.b.className="lk "+(eq?"eq":"ne");
  /* Розбіжність друкує КАНОН, а не живе: живе вже стоїть у .val праворуч,
     а бракує оператору саме числа, якого на екрані немає. */
  r.b.textContent=eq?"= ЛОК":("ЛОК "+r.v);
  return 1;
}
function syncLocks(){
  var have=0,i;
  for(i=0;i<LOCK_ROWS.length;i++) have+=lkPaint(LOCK_ROWS[i]);
  var c=document.getElementById("lkCover");
  if(c) c.textContent="ЛОК "+have+"/"+LOCK_ROWS.length;
}

/* Д-1 (b2): nets_assets_v2.js зберігає СИРИЙ base64 без схеми — усі 30 значень
   починаються з "UklGR" (RIFF/WebP). Підставлений просто в src він не є URL.
   Префікс живе ТУТ, в одному резолвері, а не в 30 місцях і не в самому ассет-файлі:
   ассет-файл машинно-генерований, будь-яка правка в ньому вмирає при перегенерації. */
var DURI="data:image/webp;base64,";
function markSrc(sl){var a=(typeof NET_ASSETS!=="undefined")&&NET_ASSETS[sl];return a?DURI+a.mark:"";}
function miniSrc(sl){var a=(typeof NET_ASSETS!=="undefined")&&NET_ASSETS[sl];return a?DURI+a.mini:"";}

function plateHTML(net,sz){
  if(net.glyph){
    var g=GLYPH.replace(/CLR/g,FARMASTOR_INK).replace('width="14" height="14"',
      'width="'+Math.round(sz*.62)+'" height="'+Math.round(sz*.62)+'"');
    return '<span class="plate"><span class="glyphwrap">'+g+'</span></span>';
  }
  return '<span class="plate"><img alt="" src="'+markSrc(net.slug)+'"></span>';
}
function lblHTML(net){return net.ln.map(function(l){return '<span>'+l+'</span>';}).join("");}
/* b5: жодного інлайн-стилю і жодного класу режиму. Клас `is-sel` тримає kNet
   через --kSel, `is-act` вмикає канали, `chk` — галочку. Наслідок: зміна
   будь-якого важеля більше не потребує перебудови 16 base64-картинок. */
function cardHTML(net,act,idx){
  /* Д-24: інлайн СТАТИЧНИЙ — він лише називає, з якої змінної картка читає свою k.
     Саме значення живе в --k-<SLUG> на скоупі кадру, тож рух повзунка = зміна змінної,
     а не новий HTML. Клас is-sel лишається (він тримає рамку вибору), але kNet більше
     не залежить від нього. */
  return '<div class="ncard'+(idx!=null&&idx===isoIdx?" is-sel":"")
    +(act?" is-act":"")+'"'
    +' style="--kThis:var(--k-'+net.slug+',1)"'
    +(idx!=null?' data-i="'+idx+'"':'')+'>'+plateHTML(net,ST.plate)
    +'<div class="nlbl">'+lblHTML(net)+'</div><div class="ncnt">'+net.n+'</div></div>';
}
/* Д-8: авто-фіт ПЕР-КАРТКОВИЙ. Зменшення шрифту в одній плитці фізично не може
   зачепити сусідню — це і є відповідь на «фіксиш одну, ламається інша». */
function fitLabels(){
  var base=ST.lblSz, floor=Math.max(7,base-3.5);
  [].forEach.call(document.querySelectorAll(".nlbl"),function(w){
    var fs=base,g=0; w.style.fontSize=fs+"px";
    while(g++<16){
      var over=false,c=w.children;
      for(var i=0;i<c.length;i++){ if(c[i].scrollWidth>w.clientWidth+0.5){over=true;break;} }
      if(!over||fs<=floor)break;
      fs-=0.5; w.style.fontSize=fs+"px";
    }
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   КРОК 1 (H5.4) · JS-ВУЗОЛ «СПИСОК» — з StockCheck_port_b32_0.html
   Перенесено КОМПОНЕНТОМ, не рядками-функціями: кожна функція приїхала разом

   розрив цього ланцюга дав чорні диски замість кілець у стенді v2 (§1.2 H5_2).
   НЕ перенесено свідомо:
     · animRing / ARC / _homeSnap / arcDur / arcOff / reduceOn — моушн кільця.
       Крок 1 статичний; моушн не судиться і тягнув би за собою другий предмет.
     · homeModel / visitModel / journalGroups / journalHTML / __jrPreview —
       моделі даних. Тут замість них хардкод-семпли (нижче), БЕЗ DEV_SEED.
   ══════════════════════════════════════════════════════════════════════════ */
function esc(s){return(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
/* У продукті TOTAL = MSL.length. MSL — це 83 SKU з DATA-блока b31; у стенді
   цього блока немає й бути не повинно, тому число стоїть константою. Воно
   входить у кожен відсоток дуги, тож розходження з продуктом було б видиме. */
var TOTAL=83;
/* S.city у продукті ховає рядок міста (перемикач зрізу). У стенді стану S нема,
   тому прапорець локальний і сцені 5 належить. false = місто показане. */

/* Крок 2 · присутність ярусу. Спосіб побачити ЦІНУ ярусу: Д-30 каже, що eyebrow
   росте по вертикалі, і приріст видно лише перемиканням у тому ж пікселі.
   Крок 4: прапорець переїхав у ST.eb.on — інакше він не потрапляв би в 📋 (К-9),
   хоч і міняє все, що судиться. */
function ebCard(n){return ST.eb.on&&n?'<div class="eb-card">'+esc(n)+'</div>':'';}
/* show рахує ebRepeat і приходить ззовні: рядок сам не знає ані своєї групи,
   ані попередника. Правило показу — властивість списку, не рядка. */
function ebJr(n,show){return show&&n?'<span class="eb-jr">'+esc(n)+'</span>':'';}

function hPct(f){return Math.round(f/TOTAL*100);}
function hFill(f){var q=(f>=TOTAL)?'Full':'Part';
  return 'hsl(var(--fill'+q+'H) calc(var(--fill'+q+'S)*1%) calc(var(--fill'+q+'L)*1%))';}
/* ring/arc geometry LOCKED §6.4: ringSize 62 · stroke 5 · arc rotate135 gap90° · pathLength100 */
function ringSVG(f){
  var d=62,w=5,r=(d-w)/2,cx=d/2,style='transform:rotate(135deg);transform-origin:center',
      target=(75-0.75*hPct(f)).toFixed(2);
  var track='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" pathLength="100" stroke="var(--ringTrack)" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="75 100" style="'+style+'"/>';
  var fill=f>0?'<circle class="arcfill" cx="'+cx+'" cy="'+cx+'" r="'+r+'" pathLength="100" stroke="'+hFill(f)+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="75 100" stroke-dashoffset="'+target+'" style="'+style+'"/>':'';
  return '<svg width="'+d+'" height="'+d+'">'+track+fill+'</svg>';
}
function heroHTML(p){
  if(p.state==='transferred')
    return '<div class="rt"><div class="ring arcm">'+ringSVG(p.filled)+
      '<div class="amid"><span class="fig">'+p.filled+'</span><span class="den">/'+TOTAL+'</span></div>'+
      '<span class="arcword chk">✓✓</span></div><span class="trbadge">перенесено</span></div>';
  if(p.state==='new')
    return '<div class="rt"><div class="ring arcm">'+ringSVG(0)+'<div class="amid"><span class="newmark">—</span></div></div></div>';
  return '<div class="rt"><div class="ring arcm">'+ringSVG(p.filled)+
    '<div class="amid"><span class="fig">'+p.filled+'</span><span class="den">/'+TOTAL+'</span></div>'+
    '<span class="arcword">'+hPct(p.filled)+'%</span></div></div>';
}

/* jrRing — ОКРЕМА функція, не перевантаження ringSVG(f): та зашита під d=62/w=5
   і заливку hFill(f) для картки Home. Спільне ім'я мовчки перебило б кільце дошки. */
function jrRing(pct,sz){
  var w=Math.max(2.4,sz*.115),r=(sz-w)/2,c=sz/2,
      st='transform:rotate(135deg);transform-origin:center',
      off=(75-0.75*pct).toFixed(2);
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">'
    +'<circle cx="'+c+'" cy="'+c+'" r="'+r+'" pathLength="100" fill="none" stroke="var(--ringTrack)" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="75 100" style="'+st+'"/>'
    +(pct>0?'<circle cx="'+c+'" cy="'+c+'" r="'+r+'" pathLength="100" fill="none" stroke="var(--accent)" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="75 100" stroke-dashoffset="'+off+'" style="'+st+'"/>':'')
    +'</svg>';
}

/* Правило показу ярусу в рядку. Перший рядок групи показує мітку ЗАВЖДИ в обох
   економних режимах: без неї група починалась би з безіменної адреси. */
function ebShow(rows,i){
  if(!ST.eb.on) return false;
  var m=ST.eb.rep;
  if(m==="all") return true;
  if(i===0) return true;
  if(m==="grp") return false;
  return rows[i].net!==rows[i-1].net;

var o47Open=false, cardHpx=143, wellHpx=420;
/* well=true лише для шіта: у дропдауні ніші немає, і саме тому її токени не

     +'<div class="isl-actions"><button class="netbtn pressable" id="netBtn" aria-label="Мережа">'

function o47Set(open){

function render(){

  var kSel=ST.kNets[NETS[isoIdx].slug]||1;
  if(scene===1){
    h='<div class="sc-h">Мережа · 16 · 965 аптек</div><div id="grid">';
    NETS.forEach(function(n,i){h+=cardHTML(n,i===isoIdx,i);});
    h+='</div>';
  }else if(scene===2){
    var n=NETS[isoIdx];
    h='<div class="sc-h">ізольована · '+n.label+(kSel!==1?' · kNet '+kSel.toFixed(2):'')+'</div><div class="iso">'
      +'<div class="iso-row">'
      +'<div>'+cardHTML(n,false,isoIdx)+'<div class="iso-cap">mark 224² @ '+ST.plate+'px</div></div>'
      +'<div><span class="mini" style="--kThis:var(--k-'+n.slug+',1)">'+(n.glyph
          ?'<span class="ntile"><span class="bscale">'+GLYPH.replace(/CLR/g,"var(--ntile-gl)")+'</span></span>'
          :'<img alt="" src="'+miniSrc(n.slug)+'">')+'</span>'
      +'<div class="iso-cap">mini 112² @ 35px</div></div>'
      +'<div><span class="netbtn"><span class="ntile"><span class="bscale">'
      +GLYPH.replace(/CLR/g,"var(--ntile-gl)")+'</span></span></span>'
      +'<div class="iso-cap">netBtn 44px<br>(живий b31)</div></div>'
      +'</div>'
      +'<div>'+cardHTML(n,true,isoIdx)+'<div class="iso-cap">той самий, активний</div></div>'
      +'</div>';
  }else if(scene===3){
    /* b5 · S3 = поточний набір каналів + три ТВОЇ слоти. Кожна комірка несе
       власний скоуп змінних (data-slot), тому чотири набори живуть одночасно —
       це те, чого не могла зробити конструкція b4 з одним значенням на кадр. */
    var n3=NETS[isoIdx],cells="";
    cells+='<div class="actcell" data-slot="cur">'+cardHTML(n3,true,isoIdx)
          +'<div class="actcap">поточний</div></div>';
    ["A","Б","В"].forEach(function(nm,i){
      var sl=SLOTS[theme][i];
      cells+='<div class="actcell'+(sl?"":" empty")+'" data-slot="'+i+'">'
        +(sl?cardHTML(n3,true,isoIdx):'<div class="slotempty">порожньо<br>⤓'+nm+'</div>')
        +'<div class="actcap">'+nm+'</div></div>';
    });
    h='<div class="sc-h">актив · '+n3.label+' · П-24</div>'
      +'<div class="actrow">'+cells+'</div>'
      +'<div style="margin-top:14px" class="actcell">'+cardHTML(n3,false,isoIdx)
      +'<div class="actcap">неактивний — контроль</div></div>';
  }else if(scene===5){
    /* Сцена 5 · СПИСОК. Порядок як у продукті: картка дошки, під нею група
       журналу. Обидва контейнери НЕ несуть бічних полів — їх дає .scene (14),
       рівно як .list дає їх у білді. Заголовок групи статичний: jrDate() не
       переносився (дата тут — дані семпла, не обчислення). */
    h=sc5Body();
  }else if(scene===6){
    /* Крок 3 · S6 = той самий контент, що S5, плюс острівець над ним. Нових даних
       не вигадуємо: скло судиться тільки над реальним контентом (маніфест §2-п.6),
       а реальний контент у цьому файлі вже є і вже device✓. */
    h='<div class="isl-spacer" id="islSpacer"></div>'+sc5Body();
  }else{
    h='<div class="diagwarn">S4 · ДІАГНОСТИКА, НЕ ПРОДУКТ. У StockCheck плита під знаком '
      +'біла в обох темах (П-25). Темна плита існує лише щоб побачити білі залишки '
      +'джерела — О-32 Лінда-Фарм. Не переносити в білд.</div><div class="diag">';
    NETS.forEach(function(n){ if(!n.glyph) h+='<img alt="'+n.label+'" src="'+markSrc(n.slug)+'">'; });
    h+='</div>';
  }
  sc.innerHTML=h;
  renderOv();
  applyVars();
}

/* Д-23 (b5) · КОРІНЬ ЗАВИСАННЯ. У b4 цей слухач стояв УСЕРЕДИНІ render(), а
   render() кликався з apply(). #scene — той самий елемент завжди, innerHTML
   міняє лише дітей. Отже кожен рендер навішував ЩЕ ОДИН слухач, жоден не
   знімався, і кількість подвоювалась на кожен тап: 10 тапів = 1024 повні
   перебудови сітки з 16 base64-картинок по 224². Звідси затримка, зависання
   і вбитa вкладка. Тут слухач заводиться РІВНО ОДИН РАЗ, поза рендером. */
/* Тригер РІВНО ОДИН — кнопка мереж. Жодного «ще й тап по сцені для зручності»:
   саме на вигаданому тригері впав стенд v1. Закриття: скрим або вибір мережі. */
document.getElementById("ov").addEventListener("click",function(e){
  if(e.target.closest("#netBtn")){ o47Set(!o47Open); return; }
  if(e.target.closest("#scrim")){ o47Set(false); return; }
  var c=e.target.closest(".ncard[data-i]"); if(!c)return;
  isoIdx=+c.dataset.i; buildPanel(); syncSel(); applyVars(); o47Set(false);
});
document.getElementById("scene").addEventListener("click",function(e){
  var cell=e.target.closest(".actcell[data-slot]");
  if(cell && scene===3){
    var sv=cell.dataset.slot;
    if(sv!=="cur" && SLOTS[theme][+sv]){
      ST.act[theme]=JSON.parse(JSON.stringify(SLOTS[theme][+sv]));
      buildPanel(); rebuild(); return;
    }
  }
  var c=e.target.closest(".ncard[data-i]"); if(!c)return;
  isoIdx=+c.dataset.i;
  buildPanel();                    // kNet належить обраній мережі — рядок оновлюється
  if(scene===1){ syncSel(); applyVars(); }   // на сітці міняється лише клас
  else rebuild();                            // S2/S3 показують інший знак — контент інший
});

/* b5: перемикання вибору БЕЗ перебудови DOM. Саме тут гине друга половина
   гальм: клас на двох елементах замість 16 нових <img> з data:-URL. */
function syncSel(){
  [].forEach.call(document.querySelectorAll("#grid .ncard"),function(c){
    var sel=+c.dataset.i===isoIdx;
    c.classList.toggle("is-sel",sel);
    c.classList.toggle("is-act",sel);
  });
}

/* b5 · РОЗЧЕПЛЕННЯ. applyVars() чіпає ЛИШЕ CSS-змінні — жодного innerHTML.
   rebuild() перебудовує сцену і кличеться тільки там, де змінився КОНТЕНТ.
   Правило п.9 harness-шаблону: input ≠ rebuild. Ім'я apply() збережене, бо
   на нього зав'язані всі повзунки; тепер воно означає «оновити змінні». */
function rebuild(){ render(); }
function apply(){ applyVars(); syncLocks(); }   // Р-50: маркер живе синхронно з важелем
function applyVars(){
  var f=FR[dev],sb=document.getElementById("sbox"),fr=document.getElementById("frame");
  document.documentElement.setAttribute("data-theme",theme);
  sb.style.width=f.w+"px"; sb.style.height=f.h+"px";
  sb.style.setProperty("--sbH",f.sb+"px"); sb.style.setProperty("--saB",f.sa+"px");
  document.getElementById("notch").className="notch "+f.notch;

  var A=ST.act[theme],M=ST.mat[theme],r=sb.style;
  r.setProperty("--cols",ST.cols);
  r.setProperty("--plate",ST.plate+"px");
  r.setProperty("--rad",ST.rad+"px");
  r.setProperty("--gX",ST.gX+"px");
  r.setProperty("--gY",ST.gY+"px");
  r.setProperty("--pad",ST.pad+"px");
  r.setProperty("--lblSz",ST.lblSz+"px");
  r.setProperty("--cntSz",ST.cntSz+"px");
  r.setProperty("--kMark",ST.kMark);
  r.setProperty("--kThis",1);   /* підлога для всього, що не картка й не mini */
  /* Д-24 · шістнадцять шкал замість однієї. Один прохід на кадр, 16 записів змінних —
     жодного innerHTML. --kSel більше не існує: два джерела однієї величини і були
     коренем дефекту. */
  NETS.forEach(function(n){ r.setProperty("--k-"+n.slug, ST.kNets[n.slug]||1); });
  /* Крок 4 · ЯРУС. Геометрія спільна на обидві теми, чорнило береться з набору
     ПОТОЧНОЇ теми (A39) — саме тому тут, а не окремим правилом [data-theme]:
     нове темозалежне правило коштувало б двох ✗ по A69 (гейт H3). */
  var E=ST.eb, EI=E.ink[theme];
  r.setProperty("--ebSzC",E.card.sz+"px"); r.setProperty("--ebWC",E.card.w);
  r.setProperty("--ebTrC",E.card.tr+"px"); r.setProperty("--ebGapC",E.card.gap+"px");
  r.setProperty("--ebCsC",E.card.cs==="up"?"uppercase":"none");
  r.setProperty("--ebInkC",EI.c+"%");
  r.setProperty("--ebSzJ",E.jr.sz+"px");   r.setProperty("--ebWJ",E.jr.w);
  r.setProperty("--ebTrJ",E.jr.tr+"px");   r.setProperty("--ebGapJ",E.jr.gap+"px");
  r.setProperty("--ebCsJ",E.jr.cs==="up"?"uppercase":"none");
  r.setProperty("--ebInkJ",EI.j+"%");
  var O=ST.o47;
  r.setProperty("--o47H",O.h+"%");
  r.setProperty("--o47Rad",O.rad+"px");
  r.setProperty("--o47Scrim",O.scrim);
  r.setProperty("--o47Dur",O.dur+"ms");
  r.setProperty("--o47DdW",O.ddW+"%");
  r.setProperty("--o47DdRad",O.ddRad+"px");
  /* Верх дропдауна не важіль, а ЗАМІР: він прив'язаний до фактичного низу кнопки,
     інакше кандидат «прив'язаний до тригера» був би прив'язаний до числа з голови. */
  var nb=document.getElementById("netBtn"), ovl=document.getElementById("ov");
  if(nb&&ovl){
    var s=curScale()||1;
    var top=(nb.getBoundingClientRect().bottom-ovl.getBoundingClientRect().top)/s+O.ddGap;
    r.setProperty("--o47DdTop",Math.round(top)+"px");
  }
  /* Крок 5 · геометрія ніші. cardH — ЗАМІР із живої картки, не сума паддінгів
     з голови (Д-1): у неї входить дворядкова мінімальна висота підпису
     (lblSz*2.36) і рядок лічильника, чиї метрики тягне шрифт, а не токен. */
  var c0=document.querySelector("#grid .ncard");
  if(c0){ var csc=curScale()||1; cardHpx=c0.getBoundingClientRect().height/csc; }
  wellHpx = 2*cardHpx + ST.gY + O.peek + 2*O.wellPad;
  r.setProperty("--wellH",wellHpx.toFixed(1)+"px");
  r.setProperty("--wellRad",O.wellRad+"px");
  r.setProperty("--wellPad",O.wellPad+"px");
  r.setProperty("--fadePx",O.fade+"px");
  var wt=O.well[theme].tone;
  var wbase="color-mix(in srgb,var(--bg) "+Math.min(100,wt)+"%,var(--card))";
  r.setProperty("--wellBg", wt>100
    ? "color-mix(in srgb,#000 "+(wt-100)+"%,"+wbase+")"
    : wbase);
  r.setProperty("--plateZ", M.ro?"auto":"1");
  /* Д-10: плита — біла при plM=0 (П-25 дотримано), інакше тягнеться до кольору картки */
  r.setProperty("--plateBg", M.plM===0 ? "#FFFFFF"
    : "color-mix(in srgb,var(--tileBg) "+M.plM+"%,#FFFFFF)");
  r.setProperty("--plBdW", M.plB===0 ? "0px" : "1px");
  r.setProperty("--plBd", "color-mix(in srgb,var(--border) "+M.plB+"%,transparent)");
  r.setProperty("--sgPad",ST.sgPad);
  r.setProperty("--ringW",A.ringW+"px");
  r.setProperty("--diagBg","rgb("+ST.diagBg+","+ST.diagBg+","+ST.diagBg+")");

  if(theme==="light"){
    r.setProperty("--tileBg","color-mix(in srgb,var(--card) "+(M.bg*2.5)+"%,var(--bg))");
    r.setProperty("--tileBd","color-mix(in srgb,var(--border) "+M.bd+"%,transparent)");
    r.setProperty("--ridge","0");
    /* Д-3: тінь тепер їде в --tileSh, який .ncard реально читає. */
    r.setProperty("--tileSh", M.sh===0 ? "none"
      : "0 "+(M.sh/6).toFixed(1)+"px "+(M.sh/2.2).toFixed(1)+"px rgba(20,50,42,"+(M.sh/110).toFixed(3)+")");
  }else{
    r.setProperty("--tileBg","color-mix(in srgb,#ffffff "+(M.bg/10).toFixed(1)+"%,var(--bg))");
    r.setProperty("--tileBd","color-mix(in srgb,var(--border) "+M.bd+"%,transparent)");
    r.setProperty("--ridge",(M.ridge/100).toFixed(3));
    r.setProperty("--tileSh","none");   /* A45: на OLED drop-shadow невидима — глибина робиться тоном+гребенем */
  }
  /* активний — нейтральні: акцент продукту, НЕ колір мережі (П-24).
     b5: канали пишуться незалежно. Жодного гілкування «режиму» — режим більше
     не існує як сутність, є набір каналів. */
  actVars(r,A);
  /* S3 · три слоти отримують ВЛАСНІ набори змінних у власному скоупі —
     тому чотири комбінації живуть на екрані одночасно й чесно. */
  if(scene===3){
    [0,1,2].forEach(function(i){
      var cell=document.querySelector('.actcell[data-slot="'+i+'"]');
      if(cell&&SLOTS[theme][i]) actVars(cell.style,SLOTS[theme][i]);
    });
  }

  /* ebMeasure ПІСЛЯ fitFrame: масштаб перераховується саме там, а замір на нього
     ділиться — інакше перше число після зміни зуму було б від попереднього кадру. */
  fitLabels(); syncSel(); inkOut(); capOut(); fitFrame(); ebMeasure(); o47Measure(); syncCopy();
}

/* канали → змінні. Одна функція на всі скоупи: кадр, комірка слота. */
function actVars(r,A){
  r.setProperty("--ringW", (A.bd==="off"?0:A.ringW)+"px");
  r.setProperty("--actBd", A.bd==="off" ? "transparent"
    : A.bd==="neu" ? "color-mix(in srgb,var(--border) "+A.ringA+"%,transparent)"
                   : "color-mix(in srgb,var(--accent) "+A.ringA+"%,transparent)");
  r.setProperty("--actBg", A.tone>0
    ? "color-mix(in srgb,var(--accent-soft) "+A.tone+"%,var(--tileBg))"
    : "var(--tileBg)");
  r.setProperty("--actLift", A.lift);
  r.setProperty("--actScale", (A.scale/100).toFixed(3));
  r.setProperty("--plRingW", A.plR+"px");
  r.setProperty("--plRing", A.plR?"var(--accent)":"transparent");
  r.setProperty("--actLbl", A.lbl?"var(--accent)":"var(--text)");
  r.setProperty("--actChk", A.chk?1:0);
}

/* b6 · К-12 — СТЕЛЯ, ЩО ЗАЛЕЖИТЬ ВІД ІНШИХ ВАЖЕЛІВ, РАХУЄТЬСЯ, А НЕ ПИШЕТЬСЯ ЧИСЛОМ.
   Ассети нарізані в бокс 224². Скільки з них реально доїде до сітківки:
     бокс_css = plate − 2·(plate·signPad/100)  → множимо на DPR екрана.
   Понад 224 device-px браузер домальовує проміжні пікселі — краї м'якшають.
   Це не заборона: 10–15% апскейлу оком не ловиться. Тому число подається як
   ДІАГНОСТИКА («ось що зараз відбувається»), а не як стоп (К-11).
   Гліф — вектор: інструкція «намалюй прямокутник», виконується під будь-який розмір
   з нуля. Стелі для нього не існує, і рядок каже саме це, а не мовчить. */
function kMaxNative(){
  var box=ST.plate*(1-2*ST.sgPad/100);
  var dpr=window.devicePixelRatio||1;
  return {k:224/(box*dpr), box:box, dpr:dpr};
}
function capOut(){
  var o=document.getElementById("capOut"); if(!o)return;
  var n=NETS[isoIdx];
  if(n.glyph){ o.textContent="вектор — стелі немає"; o.className=""; return; }
  var m=kMaxNative(), k=(ST.kNets[n.slug]||1)*ST.kMark, up=k/m.k;
  o.textContent="≤ "+m.k.toFixed(2)+" (plate "+ST.plate+"·dpr "+m.dpr+") · зараз "
    +(up<=1 ? "запас "+Math.round((1-up)*100)+"%" : "апскейл +"+Math.round((up-1)*100)+"%");
  o.className = up<=1 ? "ink-ok" : up<=1.30 ? "ink-warn" : "ink-bad";
}

/* П-25: інструмент заміру друкує число в UI, бо на телефоні консолі немає.
   Ефективне чорнило = fill × k², бо площа росте квадратом масштабу. */
function inkOut(){
  var o=document.getElementById("inkOut"); if(!o)return;
  var slug=NETS[isoIdx].slug, t=FILL[slug];
  if(!t){o.textContent="гліф — вектор, площа не міряється";o.className="";return;}
  var k=(ST.kNets[slug]||1)*ST.kMark, eff=t[0]*k*k, d=(eff/FILL_MED-1)*100;
  var cls=Math.abs(d)<=20?"ink-ok":Math.abs(d)<=40?"ink-warn":"ink-bad";
  o.textContent=eff.toFixed(3)+" · медіана "+FILL_MED.toFixed(3)+" · "
    +(d>0?"+":"")+d.toFixed(0)+"%";
  o.className=cls;
}

/* Крок 4 · ЗАМІР ЯРУСУ (П-25 — число друкується в UI, бо консолі на телефоні немає).
   Нормалізація Д-29: сире px ділиться на поточний масштаб кадру, інакше на FIT
   інструмент брехав би рівно настільки, наскільки зменшено стейдж.
   Ширина тексту міряється Range, а не боксом елемента: обидва яруси розтягнуті
   на всю колонку (один блоковий, другий — flex-item із stretch), тож бокс дав би
   ширину контейнера, а не мітки. Міняти для заміру геометрію судимого елемента
   не можна — інструмент викривив би те, що міряє. */
/* Захист: якщо середовище не вміє міряти Range (jsdom — не вміє, Safari — вміє),
   замір мовчки віддає 0, а не валить applyVars разом із усім стендом. Прилад,
   здатний зупинити те, що він міряє, — гірший за відсутній прилад. */
function txtW(e,s){
  if(!e||!document.createRange)return 0;
  var r=document.createRange();r.selectNodeContents(e);
  if(typeof r.getBoundingClientRect!=="function")return 0;
  return r.getBoundingClientRect().width/s;}
/* П-25 · чи ВЛАЗИТЬ сітка — це число, а не смак. 16 мереж у 3 колонки = 6 рядків;
   якщо вони не вміщаються в стелю контейнера, кандидат відпадає механічно.
   Д-1: висота береться з фактичного боксу, а не рахується з паддінгів у голові. */
function o47Measure(){
  var o=document.getElementById("o47Out"); if(!o)return;
  var o2=document.getElementById("o47Well");
  var g=document.getElementById("grid"), box=document.getElementById("o47box");
  if(!g||!box){o.textContent="сцена 6 не активна";o.className="";
               if(o2){o2.textContent="—";o2.className="";} return;}
  var s=curScale()||1, f=FR[dev], O=ST.o47;
  /* Порядок кадру: applyVars може відпрацювати ДО renderOv, коли картки ще нема
     і cardHpx лишається дефолтним. Тому замір спершу перекладає геометрію на
     фактичну картку і лише потім читає бокс — читання rect змусить браузер
     злічити лейаут заново, тож bh уже враховує свіжу --wellH. */
  var c0=document.querySelector("#grid .ncard");
  if(c0&&O.kind==="sheet"){
    cardHpx=c0.getBoundingClientRect().height/s;
    wellHpx=2*cardHpx+ST.gY+O.peek+2*O.wellPad;
    var sbx=document.getElementById("sbox");
    if(sbx) sbx.style.setProperty("--wellH",wellHpx.toFixed(1)+"px");
  }
  var gh=g.getBoundingClientRect().height/s;
  var bh=box.getBoundingClientRect().height/s;
  var fits=gh<=bh-2;
  o.textContent="сітка "+gh.toFixed(0)+"px · контейнер "+bh.toFixed(0)+"px ("
    +Math.round(bh/f.h*100)+"% екрана) · "+(fits?"влазить":"скрол "+Math.round(gh-bh)+"px");
  o.className=fits?"ink-ok":"ink-warn";
  if(!o2)return;
  if(O.kind!=="sheet"){o2.textContent="ніші немає — режим дропдауна";o2.className="";return;}
  /* Поріг = висота шіта при peek=0, тобто рівно та межа, де третій ряд ще не
     показався. Вимірене вікно з двох пристроїв — 409…417px; якщо порахований
     поріг у нього не влучає, модель хибна і числа нижче судити не можна. */
  var thr=bh-O.peek;
  var ok=(thr>=405&&thr<=420);
  o2.textContent="картка "+cardHpx.toFixed(1)+" · ніша "+wellHpx.toFixed(0)
    +" · шіт "+bh.toFixed(0)+"px = "+(bh/FR.xs.h*100).toFixed(1)+"% xs / "
    +(bh/FR.p15.h*100).toFixed(1)+"% p15 · поріг(peek0) "+thr.toFixed(0)+"px"
    +(ok?" ✓ у вікні 409-417":" ✗ поза вікном 409-417");
  o2.className=ok?"ink-ok":"ink-bad";
}
function ebMeasure(){
  var o1=document.getElementById("ebRowOut"), o2=document.getElementById("ebWOut");
  if(!o1||!o2)return;
  var s=curScale()||1, f=FR[dev], row=document.querySelector(".jr-row");
  if(!row){o1.textContent="сцена 5 не активна";o2.textContent="—";
           o1.className="";o2.className="";return;}
  var h=row.getBoundingClientRect().height/s, avail=f.h-f.sb-f.sa;
  o1.textContent=h.toFixed(1)+"px · у "+avail+"px влазить "+Math.floor(avail/h);
  o1.className = h<=48 ? "ink-ok" : h<=62 ? "ink-warn" : "ink-bad";
  var wc=0,wj=0,box=0,e;
  e=document.querySelector(".eb-card"); if(e) wc=txtW(e,s);
  [].forEach.call(document.querySelectorAll(".eb-jr"),function(x){wj=Math.max(wj,txtW(x,s));});
  e=row.querySelector(".jr-txt"); if(e) box=e.getBoundingClientRect().width/s;
  o2.textContent=(wc?wc.toFixed(0):"—")+" · "+(wj?wj.toFixed(0):"—")+"px"
    +(box&&wj?" = "+Math.round(wj/box*100)+"% ширини рядка":"");
  o2.className="";
}

/* ── МАСШТАБ ────────────────────────────────────────────────────────── */
function fitFrame(){
  var wrap=document.getElementById("stageWrap"),box=document.getElementById("frameBox"),
      f=FR[dev],fw=f.w+20,fh=f.h+20,s;
  if(zMode==="fit"){ s=Math.min((wrap.clientWidth-14)/fw,(wrap.clientHeight-14)/fh); }
  else { s=zVal; }
  box.style.transform="scale("+s+")";
  box.style.width=fw+"px"; box.style.height=(fh*s)+"px";
  var b=document.getElementById("zBadge"),p=Math.round(s*100);
  b.textContent=(zMode==="fit"?"FIT ":"")+p+"%";
  b.className="zbadge"+(p<99?" warn":"");
  b.title=p<99?"масштаб < 100% — судити РОЗМІР не можна, лише композицію":"1:1 — розмір судиться чесно";
}
addEventListener("resize",fitFrame);

/* ── КЕРУВАННЯ ──────────────────────────────────────────────────────── */
function seg(id,fn){
  document.getElementById(id).addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b)return;
    fn(b.dataset.v,b,this);
  });
}
function segOn(box,b){[].forEach.call(box.children,function(c){c.classList.remove("on");});b.classList.add("on");}
seg("sgScene",function(v,b,box){segOn(box,b);scene=+v;buildPanel();rebuild();});
/* eb міняє КОНТЕНТ (зʼявляється вузол), тому rebuild, а не apply — п.9 шаблону. */
seg("sgEb",   function(v,b,box){segOn(box,b);ST.eb.on=+v;rebuild();});
/* тема міняє вміст S3: слоти зберігаються окремо на кожну тему (A39) */
seg("sgTheme",function(v,b,box){segOn(box,b);theme=v;buildPanel();rebuild();});
seg("sgDev",  function(v,b,box){segOn(box,b);dev=v;apply();});
seg("sgZoom", function(v,b,box){
  if(v==="fit"){zMode="fit";segOn(box,b);}
  else if(v==="one"){zMode="man";zVal=1;segOn(box,b);}
  else{ if(zMode==="fit"){zMode="man";zVal=curScale();}
        zVal=Math.max(.4,Math.min(2.2,zVal+(v==="plus"?.1:-.1)));
        [].forEach.call(box.children,function(c){c.classList.remove("on");}); }
  fitFrame();
});
function curScale(){var m=/scale\(([\d.]+)\)/.exec(document.getElementById("frameBox").style.transform);return m?+m[1]:1;}

document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  segOn(this,b); famOn=b.dataset.f;
  ["geo","sign","act","mat","eb","o47"].forEach(function(f){
    document.getElementById("fam-"+f).classList.toggle("on",f===famOn);});
});

document.getElementById("btnHide").onclick=function(){
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("showPanel").classList.add("on"); fitFrame();
};
document.getElementById("showPanel").onclick=function(){
  document.getElementById("panel").classList.remove("hidden");
  this.classList.remove("on"); fitFrame();
};

/* hold-to-compare — компенсація втрати дуал-фрейма (маніфест §4) */
var hb=document.getElementById("btnHold");
function holdOn(e){e.preventDefault();if(holdSnap)return;
  holdSnap=JSON.parse(JSON.stringify(ST));ST=JSON.parse(JSON.stringify(P0));
  /* Крок 4: утримання судить ЗНАЧЕННЯ, а не склад екрана. on і rep міняють
     розмітку, а hold викликає лише apply() — тож вони переносяться з поточного
     стану. Інакше контроль тихо не показував би те, що обіцяє. */
  ST.eb.on=holdSnap.eb.on; ST.eb.rep=holdSnap.eb.rep;
  apply();}
function holdOff(){if(!holdSnap)return;ST=holdSnap;holdSnap=null;buildPanel();apply();}
hb.addEventListener("touchstart",holdOn,{passive:false});
hb.addEventListener("touchend",holdOff);hb.addEventListener("touchcancel",holdOff);
hb.addEventListener("mousedown",holdOn);hb.addEventListener("mouseup",holdOff);
hb.addEventListener("mouseleave",holdOff);

/* Крок 4: rebuild(), а не apply() — пресет несе ще й on/rep, тобто склад
   розмітки. З apply() кнопка міняла б числа й лишала старий склад рядків. */
document.getElementById("btnReset").onclick=function(){
  ST=JSON.parse(JSON.stringify(P0));buildPanel();rebuild();};
document.getElementById("btnP1").onclick=function(){
  ST=JSON.parse(JSON.stringify(P1));buildPanel();rebuild();};

/* К-9 (b5) · РЯДОК 📋 — ЦЕ КОНТРАКТ ЗІ СТАНОМ, А НЕ ТЕКСТ.
   Кожен лист ST мусить бути тут. Важіль, якого немає в копії, працює на екрані
   ідеально й гине рівно в момент передачі результату — тобто помилка невидима
   саме там, де вона дорого коштує. Матриця перевіряє це машинно: тягне ключі
   з літерала P0 і вимагає кожен у тілі цієї функції. */
/* Крок 4 · К-9 для ярусу. Родина пишеться одним токеном kегль/вага/трек/кейс/gap,
   чорнило — окремо по темах, бо саме воно розщеплене (A39). ФАКТИЧНИЙ відступ
   журналу = gap важеля + 2 (проміжок батька), тому в рядку стоїть «+2». */
/* Р-50 п.2 · рядок 📋 несе рівно ті важелі, що працюють у поточному режимі.
   Було: друкувались усі, і h72% їхало в самері як значуще число, хоча в шіті
   висота рахується формулою. Саме на такому залишку порт бере хибний канон. */
function o47Str(){
  var O=ST.o47, sh=(O.kind==="sheet");
  if(!sh) return "дроп h"+O.h+"% scrim"+O.scrim+" dur"+O.dur
    +" | dd w"+O.ddW+"% gap"+O.ddGap+" rad"+O.ddRad;
  return "шіт rad"+O.rad+" scrim"+O.scrim+" dur"+O.dur
    +" | well peek"+O.peek+" rad"+O.wellRad+" pad"+O.wellPad+" fade"+O.fade
    +" tone.L"+O.well.light.tone+" tone.D"+O.well.dark.tone

function ebFamStr(f){return f.sz+"/"+f.w+"/"+f.tr+"/"+(f.cs==="up"?"UP":"as")+"/g"+f.gap;}
function ebStr(){
  var E=ST.eb;
  return "on"+E.on+" rep="+E.rep
    +" C="+ebFamStr(E.card)
    +" J="+ebFamStr(E.jr)+"(+2)"
    +" ink.L="+E.ink.light.c+"/"+E.ink.light.j
    +" ink.D="+E.ink.dark.c+"/"+E.ink.dark.j;
}
function actStr(A){
  return A.bd+"/w"+A.ringW+"/a"+A.ringA+"/t"+A.tone
        +"/chk"+A.chk+"/lift"+A.lift+"/sc"+A.scale+"/plR"+A.plR+"/lbl"+A.lbl;
}
function copyStr(){
  var A=ST.act,M=ST.mat;
  var kn=Object.keys(ST.kNets).filter(function(k){return ST.kNets[k]!==1;})
          .map(function(k){return k+":"+ST.kNets[k].toFixed(2);});
  var sl=["A","Б","В"].map(function(nm,i){
    var L=SLOTS.light[i],D=SLOTS.dark[i];
    return (L||D) ? nm+"{L="+(L?actStr(L):"—")+" D="+(D?actStr(D):"—")+"}" : "";
  }).filter(Boolean);
  return "NETMARK v3.7 · Крок6 | "+dev+" | cols="+ST.cols+" plate="+ST.plate+" rad="+ST.rad
   +" gX="+ST.gX+" gY="+ST.gY+" pad="+ST.pad+" lbl="+ST.lblSz+" cnt="+ST.cntSz
   +" || K_MARK="+ST.kMark.toFixed(2)+" signPad="+ST.sgPad
   +" kNets["+(kn.length?kn.join(" "):"усі 1.00")+"]"
   +" || ACT.L="+actStr(A.light)+" ACT.D="+actStr(A.dark)
   +" || MAT.L=bg"+M.light.bg+"/bd"+M.light.bd+"/sh"+M.light.sh
      +"/plM"+M.light.plM+"/plB"+M.light.plB+"/ro"+M.light.ro
   +" MAT.D=bg"+M.dark.bg+"/bd"+M.dark.bd+"/ridge"+M.dark.ridge
      +"/plM"+M.dark.plM+"/plB"+M.dark.plB+"/ro"+M.dark.ro
   +(sl.length?" || slots "+sl.join(" "):"")
   +" || EB "+ebStr()
   +" || O47 "+o47Str()
   +" || diagBg="+ST.diagBg;
}
function syncCopy(){document.getElementById("copyOut").value=copyStr();}
document.getElementById("btnCopy").onclick=function(){
  var s=copyStr(),o=document.getElementById("copyOut");
  o.value=s;o.select();
  try{navigator.clipboard.writeText(s);}catch(e){}
  try{document.execCommand("copy");}catch(e){}
  this.textContent="📋 скопійовано";var t=this;setTimeout(function(){t.textContent="📋 копія значень";},1200);
};
