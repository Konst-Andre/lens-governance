<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Lens · HARNESS-4 — бренд-family</title>
<style>
:root{
  --bg:#eef3f2; --bg-soft:#e3ebe9; --card:#fff; --card-2:#f4f8f7;
  --border:#d3dedb; --border-2:#bfcecb; --ink:#1a1b1e; --muted:#74827d;
  --ok:#2e9e5c; --accent:#2A8C84; --accent-text:#237770;
  --glass-bg:rgba(212,227,225,.73); --dot:#6DD8D0; --floor:#e2e9e7;
  --brand-acc:#237770;
}
[data-theme="dark"]{
  --bg:#0a0e14; --bg-soft:#11161e; --card:#232a35; --card-2:#2b3340;
  --border:#333b46; --border-2:#46505d; --ink:#e6edf3; --muted:#8b949e;
  --ok:#3bc572; --accent:#2A8C84; --accent-text:#34A097;
  --glass-bg:rgba(19,31,38,.73); --dot:#6DD8D0; --floor:var(--card-2);
  --brand-acc:#6DD8D0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,"Manrope",system-ui,sans-serif;background:#5b6167;color:#e8ecef;
  padding:12px 12px 0;line-height:1.4;font-size:14px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
h1{font-size:15px;margin:0 0 3px;flex-shrink:0}
.sub{color:#aeb4ba;font-size:11.5px;margin:0 0 10px;flex-shrink:0}

/* ===== СТЕЙДЖ (окрема зона скролу) ===== */
.stage{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}

/* --- PHONE mode: scaled full device --- */
.fwrap{position:relative;width:100%;overflow:hidden;border-radius:30px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.device{position:absolute;top:0;left:0;transform-origin:top left;
  display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* --- BAR mode: true-px top zone (glyph judged at real size) --- */
.barwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0 0 18px 18px;
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
.barzone{display:flex;flex-direction:column;background:var(--bg)}

.tlabel{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.5px;color:#8b929a;
  margin:0 0 -8px 4px;position:relative;z-index:2}

/* ===== статус-бар: ОВЕРЛЕЙ у барі, фон бару тече ПІД ним ===== */
.app-bar{position:relative;z-index:5;padding:12px 16px 10px;
  background:linear-gradient(180deg,
     color-mix(in srgb,var(--accent) var(--tint,7%),var(--card)),
     color-mix(in srgb,var(--floor) var(--grad,34%),color-mix(in srgb,var(--accent) var(--tint,7%),var(--card))));
  border-bottom:1px solid color-mix(in srgb,var(--border) var(--seam,78%),transparent);
  box-shadow:0 var(--drop,11px) calc(var(--drop,11px) + 6px) -8px rgba(0,0,0,.18)}
.app-bar::after{content:"";position:absolute;inset:0 0 auto 0;height:6px;
  background:linear-gradient(180deg,rgba(255,255,255,var(--ridge,.02)),transparent);pointer-events:none}
[data-theme="dark"] .app-bar{--tint:5%;--grad:38%;--seam:88%;--ridge:.09;--drop:5px;
  box-shadow:0 5px 10px -8px rgba(0,0,0,.5)}
.app-bar.sb{padding-top:calc(var(--sbh,44px) + 6px)}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--sbh,44px);z-index:6;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px calc(var(--sbh,44px)*0.30);font-size:14px;font-weight:700;color:var(--ink);pointer-events:none}
.statusbar .rgt{display:flex;gap:5px;align-items:center}
.statusbar .rgt i{width:22px;height:11px;border:1.4px solid var(--ink);border-radius:3px;display:inline-block;opacity:.8;position:relative}
.statusbar .rgt i::after{content:"";position:absolute;inset:1.5px;background:var(--ink);border-radius:1px;opacity:.85}

.bar-top{display:flex;align-items:center;gap:10px}
.sr-pill{flex:1;min-width:0;max-width:240px;display:flex;align-items:center;gap:8px;
  background:color-mix(in srgb,var(--bg-soft) 70%,var(--card));border:1px solid var(--border);
  border-radius:20px;padding:5px 10px 5px 5px;color:var(--ink);font:inherit;box-shadow:inset 0 1.5px 2px rgba(0,0,0,.10)}
[data-theme="dark"] .sr-pill{box-shadow:inset 0 1.5px 2px rgba(0,0,0,.37),inset 0 -1px 0 rgba(255,255,255,.09)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.sr-nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chev-ico{flex-shrink:0;color:var(--muted)}
.icon-btn{width:34px;height:34px;flex-shrink:0;border-radius:11px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--bg-soft) 70%,var(--card));display:grid;place-items:center;color:var(--muted);box-shadow:inset 0 1.5px 2px rgba(0,0,0,.10)}
[data-theme="dark"] .icon-btn{box-shadow:inset 0 1.5px 2px rgba(0,0,0,.37),inset 0 -1px 0 rgba(255,255,255,.09)}

.timestamp{display:flex;align-items:center;gap:6px;margin-top:7px;padding-left:2px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.ts-txt{font-size:12px;font-weight:500;color:var(--muted)}

/* контент-заповнення */
.content{flex:1;overflow:hidden;padding:12px 16px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.content.bz{flex:none;padding:12px 16px 16px}
.row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;
  display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.row .rail{width:4px;align-self:stretch;border-radius:3px;background:var(--accent);opacity:.55}
.row .lines{flex:1;min-width:0}
.row .l1{height:11px;width:62%;background:var(--ink);opacity:.82;border-radius:4px}
.row .l2{height:9px;width:40%;background:var(--muted);opacity:.5;border-radius:4px;margin-top:7px}
.row .pct{font-size:15px;font-weight:800;color:var(--accent-text)}

/* glass таббар знизу (тільки phone mode) */
.tabbar{height:calc(50px + var(--hi,34px));flex-shrink:0;position:relative;
  padding:6px 20px var(--hi,34px);display:flex;justify-content:space-around;align-items:flex-start;
  background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.tabbar .hi{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
  width:120px;height:5px;border-radius:3px;background:var(--ink);opacity:.32}
.tb{width:26px;height:26px;color:var(--muted);opacity:.7}
.tb.act{color:var(--accent);opacity:1}

/* ===== ЛОК-АП ===== */
.brand-lockup{display:flex;align-items:center;gap:var(--gap,9px);min-width:0;flex-shrink:0;
  transform:translateX(var(--lockX,0px))}
.brand-lockup.stacked{flex-direction:column;gap:2px;align-items:flex-start}
.qr-tile{width:var(--tsz,30px);height:var(--tsz,30px);flex-shrink:0;position:relative;overflow:hidden;
  border-radius:calc(var(--tsz,30px) * var(--tr,.30));display:grid;place-items:center;
  transform:translateY(var(--tileY,0px))}
.qr-tile.solid{background:var(--tcol)}
.qr-tile.tint{background:color-mix(in srgb,var(--tcol) 15%,var(--card))}
.qr-tile.outline{background:transparent;box-shadow:inset 0 0 0 1.6px var(--tcol)}
.qr-tile.gradient{background:linear-gradient(150deg,color-mix(in srgb,var(--tcol) 62%,#fff),var(--tcol) 92%)}
/* --- glass (з контролем: gTint/gSpec/gRim/gBlur) --- */
.qr-tile.glass{background:color-mix(in srgb,var(--tcol) calc(var(--gTint,.30)*100%),transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tcol) calc(var(--gRim,.4)*100%),transparent);
  backdrop-filter:blur(var(--gBlur,8px));-webkit-backdrop-filter:blur(var(--gBlur,8px))}
.qr-tile.glass::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,var(--gSpec,.5)),rgba(255,255,255,0) 46%)}
[data-theme="dark"] .qr-tile.glass::before{
  background:linear-gradient(155deg,rgba(255,255,255,calc(var(--gSpec,.5)*.6)),rgba(255,255,255,0) 46%)}
/* elevation — light=drop(--el px) / dark=tone(--ed 0-5 → inset highlight)  [A45/A66] */
[data-theme="light"] .qr-tile.solid,[data-theme="light"] .qr-tile.tint,[data-theme="light"] .qr-tile.gradient{
  box-shadow:0 var(--el,2px) calc(var(--el,2px)*2) -1px rgba(0,0,0,.22)}
[data-theme="dark"] .qr-tile.solid,[data-theme="dark"] .qr-tile.gradient{
  box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--ed,2) * .06)),inset 0 -1px 0 rgba(0,0,0,.28)}
[data-theme="dark"] .qr-tile.tint{
  box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--ed,2) * .045)),inset 0 -1px 0 rgba(0,0,0,.22)}
.qr-tile svg{display:block;width:var(--gi,66%);height:var(--gi,66%);position:relative;z-index:1}

.brand-wm{font-weight:var(--ww,800);letter-spacing:var(--wt,-.5px);color:var(--ink);line-height:1;font-size:var(--ws,17px);white-space:nowrap;display:inline-flex;align-items:center}
.brand-wm em{font-style:normal;position:relative}
/* Lens-fill (п.4) — заливка/підкладка під словом Lens */
.suf.lf-tint{background:color-mix(in srgb,var(--sufc) 16%,transparent);padding:1px 5px;border-radius:6px}
.suf.lf-solid{background:var(--sufc);color:var(--card);padding:1px 6px;border-radius:7px}
.suf.lf-pill{background:var(--sufc);color:#fff;padding:2px 9px;border-radius:999px}

/* ===== LOUPE (магніфіковано — бачиш+тюниш гліф) ===== */
.loupe-card{border-radius:18px;padding:14px 16px 20px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.loupe-card.lt{background:#eef3f2}.loupe-card.dk{background:#0f141b}
.lp-lbl{font-size:10px;font-weight:800;letter-spacing:.5px;opacity:.55}
.loupe-card.lt .lp-lbl{color:#1a1b1e}.loupe-card.dk .lp-lbl{color:#e6edf3}
.lp-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:12px}
.lp-big{flex-shrink:0}
.lp-lock{transform-origin:left center}

/* family-proof */
.family{display:none;flex-direction:column;gap:12px;padding:14px;background:#20252c;border-radius:16px}
.family.on{display:flex}
.family .fnote{font-size:11px;color:#9aa1a8;line-height:1.5}
.fcell{padding:12px 14px;border-radius:12px;display:flex;align-items:center;flex-wrap:wrap;gap:16px}
.fcell.lt{background:#eef3f2}.fcell.dk{background:#0f141b}

/* ===== ПАНЕЛЬ ===== */
.panel{background:#2c3138;border-radius:14px 14px 0 0;padding:12px;flex-shrink:0;
  max-height:44dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.panel.collapsed{max-height:none}
.panel.collapsed .prow,.panel.collapsed .togline,.panel.collapsed #levers,.panel.collapsed #dump{display:none}
.tabs{display:flex;gap:6px;position:sticky;top:0;z-index:3;background:#2c3138;margin:-12px -12px 10px;padding:12px 12px 8px;align-items:center}
.caret{flex-shrink:0;width:34px;padding:7px 0;border-radius:9px;border:none;background:#3a4048;color:#cfd4d9;font-size:13px;font-weight:800}
.tab{flex:1;padding:7px;border-radius:9px;border:none;background:#3a4048;color:#cfd4d9;font:inherit;font-weight:700;font-size:12px}
.tab.on{background:var(--accent);color:#fff}
.prow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pbtn{padding:6px 9px;border-radius:8px;border:1px solid #454b53;background:#333941;color:#dfe3e7;font:inherit;font-size:11px;font-weight:600}
.pbtn.copy{background:var(--accent);border-color:var(--accent);color:#fff;margin-left:auto}
.grp-t{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#8b929a;margin:9px 0 5px}
.grp-t.glass{color:#8fd8cf}
.acc-hdr{display:flex;gap:10px;margin:2px 0 7px}
.acc-sw{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#c3c9cf;
  background:#242a31;border-radius:8px;padding:4px 8px}
.acc-sw i{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);flex-shrink:0}
.acc-sw b{font-variant-numeric:tabular-nums;color:#fff;font-weight:800}
.acc-pre{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px}
.apb{padding:5px 9px;border-radius:8px;border:1px solid #454b53;background:#333941;color:#dfe3e7;font:inherit;font-size:11px;font-weight:600}
.apb.star{background:#2f4d49;border-color:#3f6b64;color:#8fe6dc}
.lev{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.lev.off{opacity:.4}
.lev .lk{width:22px;flex-shrink:0;background:none;border:none;font-size:13px;padding:0}
.lev label{width:92px;flex-shrink:0;color:#c3c9cf}
.lev input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
.lev .val{width:46px;text-align:right;color:#fff;font-weight:700;font-variant-numeric:tabular-nums;font-size:11px}
.lev .radios{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.lev .radios button{padding:4px 7px;border-radius:7px;border:1px solid #454b53;background:#333941;color:#cbd0d5;font:inherit;font-size:11px}
.lev .radios button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.togline{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 2px;font-size:12px;color:#c3c9cf;align-items:center}
.togline label{display:flex;align-items:center;gap:5px}
.seg{display:flex;gap:4px;background:#242a31;border-radius:9px;padding:3px}
.seg button{border:none;background:none;color:#aeb4ba;font:inherit;font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px}
.seg button.on{background:var(--accent);color:#fff}
#dump{width:100%;margin-top:8px;height:0;padding:0;border:none;border-radius:8px;background:#1c2026;color:#9fe0d8;font:11px monospace;transition:height .15s;overflow:hidden}
#dump.on{height:230px;padding:8px}
</style>
</head>
<body>
<h1>HARNESS-4 v6 · бренд-family + accent-split (D3, A66.1)</h1>
<p class="sub">v6: акцент «QR» = керований HSL per-theme. Loupe = обидві теми поруч. Light #237770 LOCK · dark = S-важіль (неон↓).</p>

<div class="stage" id="stage"></div>

<div class="panel">
  <div class="tabs">
    <button class="tab" data-tab="light">Light</button>
    <button class="tab on" data-tab="both">Both</button>
    <button class="tab" data-tab="dark">Dark</button>
    <button class="caret" id="caret">▾</button>
  </div>
  <div class="prow" id="presets"></div>
  <div class="togline">
    <div class="seg" id="modeSeg">
      <button data-mode="loupe" class="on">Loupe</button>
      <button data-mode="bar">Bar 1:1</button>
      <button data-mode="phone">Phone</button>
    </div>
    <label><input type="checkbox" id="sbSim" checked> Статус-бар</label>
    <label><input type="checkbox" id="famRow"> Family</label>
    <label>Девайс:
      <select id="devSel" style="font:inherit;font-size:11px;background:#333941;color:#dfe3e7;border:1px solid #454b53;border-radius:6px;padding:2px 4px">
        <option value="p15">15 Pro 393×852</option><option value="xs">XS 375×812</option>
      </select></label>
  </div>
  <div id="levers"></div>
  <div class="prow" style="margin:8px 0 0"><button class="pbtn copy" id="copyAll">📋 Copy ALL state</button></div>
  <textarea id="dump" readonly></textarea>
</div>

<script>
const S={
  tab:'both', mode:'loupe', sbSim:true, fam:false, dev:'p15',
  tsz:30, tr:.30, gap:5, gi:68,              // tile geom (QR-instance v5 lock)
  el:2.5, ed:3.5,                            // elevation light(px) / dark(0-5 tone)
  gStroke:2.2,                               // glyph stroke width (device✓ 2→2.2)
  fill:'tint', glyph:'qr3d',                 // tile look (tint побив glass; qr3d)
  gTint:.30, gSpec:.5, gRim:.4, gBlur:8,     // glass sub-controls
  layout:'inline',                           // replace | inline | tileLens | stacked
  ws:17, ww:800, wt:-.5,                     // wordmark
  dotMode:'drop', dotOff:0,                  // dot presence + horizontal nudge
  accentText:'prefix',                       // «QR» тіловий акцент (D3-коректно)
  lensFill:'none',                           // none | tint | solid | pill
  lockX:0, tileY:0,                          // lockup shift X / tile optical Y
  /* --- accent-color split (v6): HSL per theme --- */
  lAccH:178, lAccS:55, lAccL:32,             // light accent #257E7B (Konst-lock; near #237770)
  dAccH:172, dAccS:40, dAccL:45,             // dark accent #45A194 (Konst-lock; grounded, неон↓)
  locks:{}
};
/* HSL→hex для dump/readout (device-hardcode-ready) */
function hslHex(h,s,l){h=(h%360)/360;s/=100;l/=100;
  const a=s*Math.min(l,1-l),
    f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));},
    t=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return '#'+t(f(0))+t(f(8))+t(f(4));}
const accHexL=()=>hslHex(S.lAccH,S.lAccS,S.lAccL);
const accHexD=()=>hslHex(S.dAccH,S.dAccS,S.dAccL);
/* per-theme --brand-acc inject (керований стан, НЕ статичний CSS var) */
const accVar=t=> t==='dark'
  ? `--brand-acc:hsl(${S.dAccH} ${S.dAccS}% ${S.dAccL}%);`
  : `--brand-acc:hsl(${S.lAccH} ${S.lAccS}% ${S.lAccL}%);`;
const DEV={ p15:{w:393,h:852,sbh:59,hi:34}, xs:{w:375,h:812,sbh:44,hi:0} };
const PRODUCTS=[ {p:'QR',c:'#2A8C84',g:'qr3'},{p:'KPI',c:'#4C6FE0',g:'bars'},{p:'Drive',c:'#E0912A',g:'gauge'},{p:'ВТМ',c:'#A24CC8',g:'receipt'} ];

/* ---- glyphs (tile). c=color, sw=stroke ---- */
function glyph(type,sw){const c='var(--gcol)';
  // finder square helper: outer ring + inner dot
  const F=(x,y,s)=>`<rect x="${x}" y="${y}" width="7.5" height="7.5" rx="1.6" fill="none" stroke="${c}" stroke-width="${s}"/><rect x="${x+2.4}" y="${y+2.4}" width="2.7" height="2.7" rx=".7" fill="${c}"/>`;
  if(type==='scan') // generic (fallback, НЕ QR-марка)
    return `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="${c}" stroke-width="${sw+.4}"/><rect x="9.3" y="9.3" width="5.4" height="5.4" rx="1.1" fill="${c}"/></svg>`;
  if(type==='qr3')  // clean QR×3 — 3 finder patterns
    return `<svg viewBox="0 0 24 24">${F(2,2,sw)}${F(14.5,2,sw)}${F(2,14.5,sw)}</svg>`;
  if(type==='qr3d'){ // QR×3 + компактний дата-кластер (bottom-right)
    const d=(x,y,s)=>`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx=".5" fill="${c}"/>`;
    return `<svg viewBox="0 0 24 24">${F(2,2,sw)}${F(14.5,2,sw)}${F(2,14.5,sw)}${d(14.5,14.5,3)}${d(19,14.5,3)}${d(14.5,19,3)}${d(19.5,19.5,2)}</svg>`;}
  if(type==='qr3r') // rounded QR×3 (м'якша мова)
    return `<svg viewBox="0 0 24 24"><g style="--rx:2.6">${F(2,2,sw).replace(/rx="1.6"/,'rx="2.6"')}${F(14.5,2,sw).replace(/rx="1.6"/,'rx="2.6"')}${F(2,14.5,sw).replace(/rx="1.6"/,'rx="2.6"')}</g></svg>`;
  // product glyphs (family-proof)
  if(type==='bars')
    return `<svg viewBox="0 0 24 24"><rect x="3.5" y="13" width="4" height="8" rx="1" fill="${c}"/><rect x="10" y="7" width="4" height="14" rx="1" fill="${c}"/><rect x="16.5" y="10" width="4" height="11" rx="1" fill="${c}"/></svg>`;
  if(type==='gauge')
    return `<svg viewBox="0 0 24 24"><path d="M4 18 A9 9 0 0 1 20 18" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/><line x1="12" y1="18" x2="16.5" y2="11.5" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/><circle cx="12" cy="18" r="1.7" fill="${c}"/></svg>`;
  if(type==='receipt')
    return `<svg viewBox="0 0 24 24"><path d="M6 3 h12 v16 l-2-1.4 -2 1.4 -2-1.4 -2 1.4 -2-1.4 V3 Z" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"/><line x1="9" y1="8" x2="15" y2="8" stroke="${c}" stroke-width="${sw-.3}" stroke-linecap="round"/><line x1="9" y1="11.5" x2="15" y2="11.5" stroke="${c}" stroke-width="${sw-.3}" stroke-linecap="round"/></svg>`;
  return glyph('qr3',sw);
}
/* ---- lockup ---- */
function lockup(prefix,tileCol,textAcc,small,forceGlyph){
  const g = forceGlyph || S.glyph;
  const gcol = (S.fill==='solid'||S.fill==='gradient') ? 'var(--card)' : tileCol;
  const gv=`--tint,`; // noop guard
  const tv=`--tsz:${small?24:S.tsz}px;--tr:${S.tr};--el:${S.el}px;--ed:${S.ed};--gi:${S.gi}%;`
    +`--tcol:${tileCol};--gcol:${gcol};--tileY:${small?0:S.tileY}px;`
    +`--gTint:${S.gTint};--gSpec:${S.gSpec};--gRim:${S.gRim};--gBlur:${S.gBlur}px`;
  const tile=`<div class="qr-tile ${S.fill}" style="${tv}">${glyph(g,S.gStroke)}</div>`;
  const A=(on)=>on?textAcc:'var(--ink)';
  const dotCol = S.accentText==='dot'?textAcc:'var(--muted)';
  const dot = S.dotMode==='dot' ? `<em style="color:${dotCol};left:${S.dotOff}px">·</em>` : '';
  const pfx = `<span style="color:${A(S.accentText==='prefix')}">${prefix}</span>`;
  // suffix with optional Lens-fill
  const lf = small ? 'none' : S.lensFill;
  const sufTextCol = (lf==='solid'||lf==='pill') ? '' : `color:${A(S.accentText==='suffix')};`;
  const suf = `<span class="suf ${lf!=='none'?'lf-'+lf:''}" style="${sufTextCol}--sufc:${textAcc}">Lens</span>`;
  let inner;
  if(S.layout==='replace')      inner = `${dot}${suf}`;
  else if(S.layout==='tileLens')inner = `${suf}`;
  else                          inner = `${pfx}${dot||(S.dotMode==='drop'?' ':'')}${suf}`;
  const wm=`<div class="brand-wm" style="--ws:${small?15:S.ws}px;--ww:${S.ww};--wt:${S.wt}px">${inner}</div>`;
  return `<div class="brand-lockup ${S.layout==='stacked'?'stacked':''}" style="--gap:${S.gap}px;--lockX:${small?0:S.lockX}px">${tile}${wm}</div>`;
}
/* ---- shared bar innards ---- */
function barTop(){
  return `<div class="bar-top">${lockup('QR','var(--accent)','var(--brand-acc)',false)}
    <button class="sr-pill"><div class="avatar">Б</div><span class="sr-nm">Бутуліна Владислава</span><svg class="chev-ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
    <div class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></div>
  </div>
  <div class="timestamp"><span class="live-dot"></span><span class="ts-txt">Оновлено 26.05</span></div>`;
}
function statusbar(){return S.sbSim ? `<div class="statusbar"><span>9:41</span><span class="rgt">5G <i></i></span></div>` : '';}
function rowsHTML(n){
  const data=[['Тонометр Мікролайф','97%'],['Небулайзер OMRON','72%'],['Глюкометр Contour','—']].slice(0,n);
  return data.map(r=>`<div class="row"><div class="rail"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div><div class="pct">${r[1]}</div></div>`).join('');
}
/* ---- PHONE frame (scaled full device) ---- */
function frame(theme){
  const d=DEV[S.dev];
  const tabIco=['M4 6h16M4 12h16M4 18h10','M12 2v20M2 12h20','M4 20V10M10 20V4M16 20v-8M20 20v-4','M12 15a3 3 0 100-6 3 3 0 000 6z'];
  const tabs=tabIco.map((p,i)=>`<svg class="tb ${i===0?'act':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${p}"/></svg>`).join('');
  return `<div class="device" data-theme="${theme}" style="width:${d.w}px;height:${d.h}px;--sbh:${d.sbh}px;--hi:${d.hi}px;${accVar(theme)}">
    <header class="app-bar ${S.sbSim?'sb':''}">${statusbar()}${barTop()}</header>
    <div class="content">${rowsHTML(3)}</div>
    <div class="tabbar">${tabs}<div class="hi"></div></div>
  </div>`;
}
/* ---- LOUPE: isolated big tile + zoomed lockup ---- */
function bigTile(tileCol,sz){
  const gcol=(S.fill==='solid'||S.fill==='gradient')?'var(--card)':tileCol;
  const tv=`--tsz:${sz}px;--tr:${S.tr};--el:${S.el}px;--ed:${S.ed};--gi:${S.gi}%;`
    +`--tcol:${tileCol};--gcol:${gcol};--gTint:${S.gTint};--gSpec:${S.gSpec};--gRim:${S.gRim};--gBlur:${S.gBlur}px`;
  return `<div class="qr-tile ${S.fill}" style="${tv}">${glyph(S.glyph,S.gStroke)}</div>`;
}
function loupe(theme){
  return `<div class="loupe-card ${theme==='light'?'lt':'dk'}" data-theme="${theme}" style="${accVar(theme)}">
    <span class="lp-lbl">${theme.toUpperCase()} · гліф ${S.tsz}px real ↔ magnified</span>
    <div class="lp-row">
      <div class="lp-big">${bigTile('var(--accent)',118)}</div>
      <div class="lp-lock" style="zoom:1.7">${lockup('QR','var(--accent)','var(--brand-acc)',false)}</div>
    </div>
  </div>`;
}
/* ---- BAR-1:1 top zone (true px) ---- */
function topZone(theme){
  const d=DEV[S.dev];
  return `<div class="barzone" data-theme="${theme}" style="width:${d.w}px;--sbh:${d.sbh}px;${accVar(theme)}">
    <header class="app-bar ${S.sbSim?'sb':''}">${statusbar()}${barTop()}</header>
    <div class="content bz">${rowsHTML(2)}</div>
  </div>`;
}
function famBlock(){
  if(!S.fam) return '';
  const cell=(t,cls)=>`<div class="fcell ${cls}" data-theme="${t}" style="${accVar(t)}">${PRODUCTS.map(x=>lockup(x.p,x.c,x.c,true,x.g)).join('')}</div>`;
  return `<div class="family on"><span class="fnote">Family-proof — рамка КОНСТАНТНА, змінна = префікс+колір+ГЛІФ (QR/KPI/Drive/ВТМ різні гліфи; кольори ілюстративні):</span>${cell('light','lt')}${cell('dark','dk')}</div>`;
}
function renderStage(){
  if(S.mode==='loupe'){
    stage.innerHTML = loupe('light')+loupe('dark')+famBlock();
  } else if(S.mode==='bar'){
    stage.innerHTML =
      `<div class="tlabel">LIGHT · ${DEV[S.dev].w}px 1:1</div><div class="barwrap">${topZone('light')}</div>`
     +`<div class="tlabel">DARK · ${DEV[S.dev].w}px 1:1</div><div class="barwrap">${topZone('dark')}</div>`
     +famBlock();
  } else {
    stage.innerHTML = `<div class="fwrap" id="fw-l">${frame('light')}</div><div class="fwrap" id="fw-d">${frame('dark')}</div>${famBlock()}`;
    fitDevices();
  }
}
function fitDevices(){
  const d=DEV[S.dev];
  ['fw-l','fw-d'].forEach(id=>{
    const w=document.getElementById(id); if(!w)return;
    const dev=w.querySelector('.device'); const k=w.clientWidth/d.w;
    dev.style.transform=`scale(${k})`; w.style.height=(d.h*k)+'px';
  });
}
window.addEventListener('resize',()=>{if(S.mode==='phone')fitDevices();});

/* ---- levers ---- */
const LEVERS=[
  {g:'Плитка — геом (Both)'},
  {k:'tsz',lbl:'tileSz',t:'range',min:22,max:40,step:1,unit:'px',th:'both'},
  {k:'tr',lbl:'radius',t:'range',min:0,max:.5,step:.02,unit:'',th:'both'},
  {k:'gi',lbl:'glyph inset',t:'range',min:54,max:82,step:2,unit:'%',th:'both'},
  {k:'gStroke',lbl:'glyph stroke',t:'range',min:1.2,max:2.8,step:.1,unit:'',th:'both'},
  {k:'gap',lbl:'clear-gap',t:'range',min:4,max:16,step:1,unit:'px',th:'both'},
  {k:'lockX',lbl:'lock зсув X',t:'range',min:-8,max:16,step:1,unit:'px',th:'both'},
  {k:'tileY',lbl:'tile опт-Y',t:'range',min:-3,max:3,step:.5,unit:'px',th:'both'},
  {g:'Плитка — вигляд'},
  {k:'fill',lbl:'fill',t:'radio',opts:[['tint','tint'],['solid','solid'],['outline','outline'],['gradient','gradient'],['glass','glass']],th:'both'},
  {k:'glyph',lbl:'гліф',t:'radio',opts:[['qr3','QR×3'],['qr3d','QR×3+data'],['qr3r','QR×3 round'],['scan','scan']],th:'both'},
  {k:'el',lbl:'elev (light)',t:'range',min:0,max:5,step:.5,unit:'px',th:'light'},
  {k:'ed',lbl:'elev (dark)',t:'range',min:0,max:5,step:.5,unit:'',th:'dark'},
  {g:'Glass-контроль (fill=glass)',cls:'glass',glassOnly:true},
  {k:'gTint',lbl:'glassTint',t:'range',min:.1,max:.55,step:.05,unit:'',th:'both',glassOnly:true},
  {k:'gSpec',lbl:'glassSpec',t:'range',min:0,max:.7,step:.05,unit:'',th:'both',glassOnly:true},
  {k:'gRim',lbl:'glassRim',t:'range',min:0,max:.6,step:.05,unit:'',th:'both',glassOnly:true},
  {k:'gBlur',lbl:'glassBlur',t:'range',min:0,max:16,step:1,unit:'px',th:'both',glassOnly:true},
  {g:'Вордмарк (Both)'},
  {k:'layout',lbl:'layout',t:'radio',opts:[['replace','tile=QR'],['inline','QR·Lens'],['tileLens','tile+Lens'],['stacked','stacked']],th:'both'},
  {k:'lensFill',lbl:'Lens fill',t:'radio',opts:[['none','none'],['tint','tint'],['solid','solid'],['pill','pill']],th:'both'},
  {k:'dotMode',lbl:'крапка ·',t:'radio',opts:[['dot','show'],['drop','drop']],th:'both'},
  {k:'dotOff',lbl:'dot зсув',t:'range',min:-6,max:6,step:1,unit:'px',th:'both'},
  {k:'ws',lbl:'size',t:'range',min:14,max:22,step:1,unit:'px',th:'both'},
  {k:'ww',lbl:'weight',t:'range',min:600,max:800,step:100,unit:'',th:'both'},
  {k:'wt',lbl:'tracking',t:'range',min:-1.2,max:.5,step:.1,unit:'px',th:'both'},
  {g:'Акцент-таргет (Both)'},
  {k:'accentText',lbl:'акцент на',t:'radio',opts:[['none','плитка'],['dot','крапка'],['prefix','QR'],['suffix','Lens']],th:'both'},
  {g:'Акцент-колір · split (A66.1: dark неон = S-важіль)'},
  {t:'acchdr'},
  {t:'accpre',th:'dark'},
  {k:'lAccH',lbl:'lAccH',t:'range',min:150,max:195,step:1,unit:'°',th:'light'},
  {k:'lAccS',lbl:'lAccS',t:'range',min:20,max:75,step:1,unit:'%',th:'light'},
  {k:'lAccL',lbl:'lAccL',t:'range',min:20,max:44,step:1,unit:'%',th:'light'},
  {k:'dAccH',lbl:'dAccH',t:'range',min:150,max:195,step:1,unit:'°',th:'dark'},
  {k:'dAccS',lbl:'dAccS',t:'range',min:12,max:70,step:1,unit:'%',th:'dark'},
  {k:'dAccL',lbl:'dAccL',t:'range',min:44,max:74,step:1,unit:'%',th:'dark'}
];
/* dark-accent presets — мої ставки (light лишається #237770 LOCK). ⭐=рекомендація */
const ACCENT_PRESETS={
  'Neon (=зараз)':{dAccH:176,dAccS:58,dAccL:64},
  '⭐ Calm':{dAccH:176,dAccS:40,dAccL:60},
  'Muted':{dAccH:176,dAccS:28,dAccL:55},
  'Bright-calm':{dAccH:174,dAccS:46,dAccL:66}
};
const PRESETS={
  'P1 QR×3 tint':{tsz:30,tr:.30,gi:66,gStroke:2.0,gap:9,el:2,ed:2,fill:'tint',glyph:'qr3',layout:'replace',ws:17,ww:800,wt:-.5,dotMode:'drop',dotOff:0,accentText:'none',lensFill:'none',lockX:0,tileY:0},
  'P2 QR×3 grad':{tsz:30,tr:.30,gi:64,gStroke:2.0,gap:9,el:2.5,ed:3,fill:'gradient',glyph:'qr3',layout:'replace',ws:17,ww:800,wt:-.5,dotMode:'drop',dotOff:0,accentText:'none',lensFill:'none',lockX:0,tileY:0},
  'P3 inline+data':{tsz:28,tr:.28,gi:66,gStroke:1.9,gap:8,el:2,ed:2,fill:'solid',glyph:'qr3d',layout:'inline',ws:17,ww:800,wt:-.5,dotMode:'dot',dotOff:0,accentText:'none',lensFill:'none',lockX:0,tileY:0},
  'P4 outline':{tsz:30,tr:.32,gi:70,gStroke:2.2,gap:10,el:0,ed:0,fill:'outline',glyph:'qr3',layout:'inline',ws:17,ww:700,wt:-.4,dotMode:'dot',dotOff:0,accentText:'dot',lensFill:'none',lockX:0,tileY:0},
  'P5 glass+Lens':{tsz:31,tr:.34,gi:64,gStroke:2.0,gap:9,el:0,ed:3,fill:'glass',glyph:'qr3',layout:'replace',ws:17,ww:800,wt:-.5,dotMode:'drop',dotOff:0,accentText:'none',lensFill:'pill',lockX:0,tileY:0,gTint:.30,gSpec:.5,gRim:.4,gBlur:8},
  'P6 stacked':{tsz:34,tr:.30,gi:66,gStroke:2.0,gap:6,el:2,ed:2,fill:'solid',glyph:'qr3d',layout:'stacked',ws:15,ww:800,wt:-.3,dotMode:'dot',dotOff:0,accentText:'none',lensFill:'none',lockX:0,tileY:0}
};

const levers=document.getElementById('levers'), presets=document.getElementById('presets'), stage=document.getElementById('stage');
function visible(l){
  if(l.glassOnly && S.fill!=='glass') return false;
  return S.tab==='both'?true:(l.th==='both'||l.th===S.tab);
}
function accHdrHTML(){const hl=accHexL(),hd=accHexD();
  return `<div class="acc-hdr">
    <span class="acc-sw"><i style="background:${hl}"></i>L <b id="accHexL">${hl}</b></span>
    <span class="acc-sw"><i style="background:${hd}"></i>D <b id="accHexD">${hd}</b></span>
  </div>`;}
function accPreHTML(){return `<div class="acc-pre">${Object.keys(ACCENT_PRESETS).map(n=>`<button class="apb ${n[0]==='⭐'?'star':''}" data-accpre="${n}">${n}</button>`).join('')}</div>`;}
function updateAccSw(){const hl=accHexL(),hd=accHexD();
  const eL=document.getElementById('accHexL'),eD=document.getElementById('accHexD');
  if(eL){eL.textContent=hl;eL.previousElementSibling.style.background=hl;}
  if(eD){eD.textContent=hd;eD.previousElementSibling.style.background=hd;}}
function renderPanel(){
  levers.innerHTML=LEVERS.map(l=>{
    if(l.g){ if(l.glassOnly && S.fill!=='glass') return ''; return `<div class="grp-t ${l.cls||''}">${l.g}</div>`; }
    if(l.t==='acchdr')return accHdrHTML();
    if(l.t==='accpre'){return visible(l)?accPreHTML():'';}
    if(!visible(l))return '';
    const lo=!!S.locks[l.k], lk=`<button class="lk" data-lock="${l.k}">${lo?'🔒':'🔓'}</button>`;
    if(l.t==='range'){return `<div class="lev ${lo?'off':''}">${lk}<label>${l.lbl}</label><input type="range" data-k="${l.k}" min="${l.min}" max="${l.max}" step="${l.step}" value="${S[l.k]}" ${lo?'disabled':''}><span class="val">${S[l.k]}${l.unit}</span></div>`;}
    return `<div class="lev ${lo?'off':''}">${lk}<label>${l.lbl}</label><div class="radios">${l.opts.map(o=>`<button data-k="${l.k}" data-v="${o[0]}" class="${S[l.k]===o[0]?'on':''}" ${lo?'disabled':''}>${o[1]}</button>`).join('')}</div></div>`;
  }).join('');
}
function renderPresets(){presets.innerHTML=Object.keys(PRESETS).map(n=>`<button class="pbtn" data-preset="${n}">${n}</button>`).join('');}

/* input: НЕ перебудовуємо панель (щоб драг не зривався) — лише значення + стейдж */
levers.addEventListener('input',e=>{
  const k=e.target.dataset.k; if(!k)return;
  S[k]=parseFloat(e.target.value);
  const l=LEVERS.find(x=>x.k===k), val=e.target.parentElement.querySelector('.val');
  if(val)val.textContent=S[k]+(l?l.unit:'');
  if(k.slice(1,4)==='Acc')updateAccSw();
  renderStage();
});
levers.addEventListener('click',e=>{
  const ap=e.target.dataset.accpre;
  if(ap){const p=ACCENT_PRESETS[ap];for(const key in p){if(!S.locks[key])S[key]=p[key];}renderPanel();renderStage();return;}
  const lk=e.target.dataset.lock;
  if(lk){S.locks[lk]=!S.locks[lk];renderPanel();return;}
  const k=e.target.dataset.k,v=e.target.dataset.v;
  if(k&&v!==undefined&&!S.locks[k]){S[k]=v;renderPanel();renderStage();} // fill-change may toggle glass group → renderPanel
});
presets.addEventListener('click',e=>{const n=e.target.dataset.preset;if(!n)return;const p=PRESETS[n];for(const key in p){if(!S.locks[key])S[key]=p[key];}renderPanel();renderStage();});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');S.tab=t.dataset.tab;renderPanel();}));
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.mode=b.dataset.mode;renderStage();}));
document.getElementById('caret').addEventListener('click',e=>{
  const p=document.querySelector('.panel');const c=p.classList.toggle('collapsed');
  e.target.textContent=c?'▴':'▾';});
document.getElementById('sbSim').addEventListener('change',e=>{S.sbSim=e.target.checked;renderStage();});
document.getElementById('famRow').addEventListener('change',e=>{S.fam=e.target.checked;renderStage();});
document.getElementById('devSel').addEventListener('change',e=>{S.dev=e.target.value;renderStage();});
const dumpEl=document.getElementById('dump');
function dumpState(){const keys=['dev','mode','tsz','tr','gi','gStroke','gap','lockX','tileY','el','ed','fill','glyph','gTint','gSpec','gRim','gBlur','layout','lensFill','dotMode','dotOff','accentText','ws','ww','wt','lAccH','lAccS','lAccL','dAccH','dAccS','dAccL'];
  return `=== ★ ACCENT LOCK (v6) ===
:root{ --brand-acc:${accHexL()}; }               /* light hsl(${S.lAccH} ${S.lAccS}% ${S.lAccL}%) */
[data-theme="dark"]{ --brand-acc:${accHexD()}; } /* dark  hsl(${S.dAccH} ${S.dAccS}% ${S.dAccL}%) */

=== STATE ===
`+keys.map(k=>`${k}: ${S[k]}`).join('\n')+`\n\n=== CSS (QR-instance) ===
.qr-tile{width:${S.tsz}px;height:${S.tsz}px;border-radius:${(S.tsz*S.tr).toFixed(1)}px}
/* fill=${S.fill} · glyph=${S.glyph} · gStroke=${S.gStroke} · layout=${S.layout} */
/* lensFill=${S.lensFill} · accent=${S.accentText} · lockX=${S.lockX} · tileY=${S.tileY} */`
+(S.fill==='glass'?`\n/* glass: tint=${S.gTint} spec=${S.gSpec} rim=${S.gRim} blur=${S.gBlur}px */`:'')
+`\n.brand-wm{font-size:${S.ws}px;font-weight:${S.ww};letter-spacing:${S.wt}px}
.brand-lockup{gap:${S.gap}px}

/* --- accent split (v6) — hardcode --brand-acc --- */
:root{ --brand-acc:${accHexL()}; }               /* light hsl(${S.lAccH} ${S.lAccS}% ${S.lAccL}%) */
[data-theme="dark"]{ --brand-acc:${accHexD()}; } /* dark  hsl(${S.dAccH} ${S.dAccS}% ${S.dAccL}%) */`;}
document.getElementById('copyAll').addEventListener('click',()=>{const s=dumpState();dumpEl.classList.add('on');dumpEl.value=s;
  dumpEl.removeAttribute('readonly');dumpEl.focus();dumpEl.setSelectionRange(0,s.length);      // iOS: виділено → довгий тап «Копіювати»
  try{navigator.clipboard.writeText(s);}catch(e){}
  setTimeout(()=>dumpEl.setAttribute('readonly','readonly'),50);});

renderPresets();renderPanel();renderStage();
</script>
