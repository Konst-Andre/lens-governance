<!doctype html><html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Фармастор · Arc-fill harness v1 (§5.2 дуга-анімація)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--font:'Manrope',-apple-system,system-ui,sans-serif;--hbg:#0e1512;--hpanel:#141d19;--hbd:#243029;--hln:#8aa39b}
html,body{height:100%}
body{font-family:var(--font);background:var(--hbg);color:#dfeae5;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100%}
.bar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--hbd);background:var(--hpanel)}
.seg{display:inline-flex;background:#0c1310;border:1px solid var(--hbd);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:#9db3ab;font:700 11px/1 var(--font);padding:7px 9px;cursor:pointer}
.seg button.on{background:#1f5f4d;color:#eafff6}
.fg{margin-left:auto;font:800 12px/1 var(--font);color:#7fe3bf;background:#0c1310;border:1px solid var(--hbd);border-radius:8px;padding:7px 10px;white-space:nowrap}
.fg b{color:#e0a94a}
.fg.warn b{color:#e0685c}

.stage{flex:1 1 auto;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px 10px 26px;
  background:repeating-linear-gradient(45deg,#0c1310 0 10px,#0e1512 10px 20px)}
.app{width:375px;flex:0 0 auto;background:var(--bg);border-radius:26px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid #000;padding:22px 14px 40px;min-height:340px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}

/* ===== §6.1/§6.2/§6.4 tokens ===== */
.app[data-th="light"]{--bg:#eef3f1;--card:#fff;--surface-2:#f4f8f6;--surface-3:#eef4f1;
  --text:#182c28;--text-2:#3c574f;--muted:#6b8c84;--border:#d4e5df;--border-subtle:#e1ebe7;
  --accent:hsl(162 82% 27%);--ringTrack:#dbe8e2;--cardShadow:0 1px 3px rgba(20,50,42,.08),0 4px 14px rgba(20,50,42,.05);
  --otc:hsl(160 55% 40%);--iw:hsl(210 48% 44%);
  --fFullH:150;--fFullS:55;--fFullL:46;--fPartH:175;--fPartS:60;--fPartL:46;--stH:160;--stS:58;--stL:37}
.app[data-th="dark"]{--bg:#0d1512;--card:#18221e;--surface-2:#1c2723;--surface-3:#212d28;
  --text:#e8f0ec;--text-2:#a7c0b8;--muted:#7c968d;--border:#2a3833;--border-subtle:#222e29;
  --accent:hsl(163 46% 46%);--ringTrack:#2a3833;--cardShadow:none;
  --otc:hsl(162 46% 55%);--iw:hsl(210 48% 60%);
  --fFullH:155;--fFullS:55;--fFullL:50;--fPartH:168;--fPartS:55;--fPartL:50;--stH:163;--stS:55;--stL:55}

/* real home card context (§5.2/§6.4) */
.card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:12px;
  box-shadow:var(--cardShadow);display:grid;grid-template-columns:1fr auto;grid-template-areas:"id rt" "foot foot";
  column-gap:12px;row-gap:10px;align-items:start}
[data-th="dark"] .card{background:linear-gradient(180deg,#1a251f,#161f1b);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.22)}
.idcol{grid-area:id;min-width:0}
.addr{font-size:15px;font-weight:650;color:var(--text);line-height:1.22}
.tier{margin-top:7px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600}
.tier .dot{color:var(--muted);font-weight:400}.tier .otc{color:var(--otc)}.tier .iw{color:var(--iw)}
.foot{grid-area:foot;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--border-subtle);padding-top:9px}
.anchor{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.rt{grid-area:rt;display:flex;align-items:center}
.ringwrap{transition:transform .2s ease;transform-origin:center}
.app.loupe .card{opacity:.14;pointer-events:none}
.app.loupe .rt{position:absolute}
.app.loupe .ringwrap{transform:scale(2.85)}
.ring{position:relative;width:62px;height:62px}
.ring svg{display:block}.ring circle{fill:none}
.amid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding-bottom:9px}
.fig{font-size:23px;font-weight:800;color:var(--text);line-height:.95;font-variant-numeric:tabular-nums}
.den{font-size:9.6px;color:var(--muted);font-weight:600}
.arcword{position:absolute;left:0;right:0;bottom:1px;text-align:center;font:700 10px/1 var(--font);letter-spacing:.2px;
  color:hsl(var(--stH) calc(var(--stS)*1%) calc(var(--stL)*1%))}
.newmark{font-size:25px;font-weight:300;color:var(--muted)}
/* pulse-on-full reward */
@keyframes pulseF{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.ring.pulsing{animation:pulseF 460ms cubic-bezier(.34,1.56,.64,1)}

/* ===== panel ===== */
.panel{flex:0 0 auto;max-height:46dvh;overflow:auto;border-top:1px solid var(--hbd);background:var(--hpanel)}
.panel.closed{max-height:34px;overflow:hidden}
.ptog{width:100%;text-align:left;border:0;background:transparent;color:#b7c9c3;font:700 11px/1 var(--font);padding:10px 12px;cursor:pointer;display:flex;gap:7px}
.ptog::before{content:"▾";color:var(--hln)}.panel.closed .ptog::before{content:"▸"}
.legr{font:600 10px/1.5 var(--font);color:var(--hln);margin:2px 12px 8px;padding:8px 10px;background:#0c1310;border:1px solid var(--hbd);border-radius:8px}
.legr b{color:#bcd}
.row2{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:0 12px 10px}
.lv{display:flex;flex-direction:column;gap:3px}
.lv label{font:700 10px/1 var(--font);color:#9db3ab;display:flex;justify-content:space-between}
.lv label b{color:#7fe3bf;font-weight:800}
.lv input[type=range]{width:100%;accent-color:#2f9c7a}
.tgls{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.tgl{font:700 10.5px/1 var(--font);color:#9db3ab;background:#0c1310;border:1px solid var(--hbd);border-radius:8px;padding:7px 10px;cursor:pointer}
.tgl.on{background:#1f5f4d;color:#eafff6;border-color:#2f9c7a}
.run{display:flex;gap:8px;padding:0 12px 10px}
.run button{flex:1;border:0;font:800 12px/1 var(--font);padding:12px;border-radius:9px;cursor:pointer}
.play{background:#1f5f4d;color:#eafff6}.reset{background:#0c1310;color:#b7c9c3;border:1px solid var(--hbd)!important}
.copy{margin:0 12px 14px;width:calc(100% - 24px);border:0;background:#243c34;color:#cfeee2;font:800 12px/1 var(--font);padding:11px;border-radius:9px;cursor:pointer}
</style></head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="seg" id="segTh"><button data-th="light" class="on">☀</button><button data-th="dark">☾</button></div>
    <div class="seg" id="segDev"><button data-dev="375" class="on">XS</button><button data-dev="393">15Pro</button></div>
    <div class="seg" id="segMode"><button data-mode="sweep" class="on">B1 sweep</button><button data-mode="over">B2 over</button><button data-mode="depth">B3 depth</button></div>
    <div class="seg" id="segTgt"><button data-tgt="54" class="on">partial 54%</button><button data-tgt="100">full 100%</button></div>
    <div class="seg" id="segSize"><button data-size="card" class="on">картка</button><button data-size="loupe">лупа</button></div>
    <div class="seg" id="segSlow"><button data-slow="1" class="on">×1</button><button data-slow="2">×2</button><button data-slow="3">×3</button></div>
    <div class="fg" id="fg">frame-gap: <b>—</b></div>
  </div>

  <div class="stage">
    <div class="app" id="app" data-th="light">
      <div class="card">
        <div class="idcol"><div class="addr">вул.Робоча, 79А</div>
          <div class="tier"><span class="otc">OTC B</span><span class="dot">·</span><span class="iw">IW D</span></div></div>
        <div class="rt"><div class="ringwrap"><div class="ring" id="ring"></div></div></div>
        <div class="foot"><span class="anchor">M125 · Proxima 125396</span></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel">
    <button class="ptog" id="ptog">важелі / легенда</button>
    <div class="legr" id="legr"></div>
    <div class="grid" id="levs"></div>
    <div class="tgls" id="tgls"></div>
    <div class="run"><button class="play" id="play">▶ Заповнити</button><button class="reset" id="reset">⟲ Скинути</button></div>
    <button class="copy" id="copy">📋 копі-конфіг</button>
  </div>
</div>

<script>
var TOTAL=83, D=62, W0=5, CX=31, R=(D-W0)/2;
var TH='light',DEV='375',MODE='sweep',TGT=54,SIZE='card',SLOW=1;
var CFG={dur:900,over:60,dir:1};        // dir 1=CW · -1=CCW · over=overshoot amount %
var LAY={num:true,tick:false,pulse:true}; // count-up · gauge-tick · pulse-on-full
var raf=null, baseline=16.7;

/* ---- ring skeleton (matches product: rotate135, dasharray 75/100, gap 90° bottom) ---- */
function buildRing(){
  var st='transform:rotate(135deg);transform-origin:center';
  var svg='<svg width="'+D+'" height="'+D+'" id="svg">'+
    '<g id="ringG">'+
      '<circle cx="'+CX+'" cy="'+CX+'" r="'+R+'" pathLength="100" stroke="var(--ringTrack)" stroke-width="'+W0+'" stroke-linecap="round" stroke-dasharray="75 100" style="'+st+'"/>'+
      '<circle id="fill" cx="'+CX+'" cy="'+CX+'" r="'+R+'" pathLength="100" stroke-width="'+W0+'" stroke-linecap="round" stroke-dasharray="75 100" stroke-dashoffset="75" style="'+st+'"/>'+
      '<circle id="tick" cx="'+CX+'" cy="'+(CX-R)+'" r="0" fill="var(--fillc)" transform="rotate(225 '+CX+' '+CX+')"/>'+
    '</g></svg>'+
    '<div class="amid"><span class="fig" id="fig">—</span><span class="den" id="den"></span></div>'+
    '<span class="arcword" id="aw"></span>';
  document.getElementById('ring').innerHTML=svg;
}
function fillColor(pct){var q=pct>=100?'Full':'Part';
  return 'hsl(var(--f'+q+'H) calc(var(--f'+q+'S)*1%) calc(var(--f'+q+'L)*1%))';}

function setPct(pct,eased){
  var app=document.getElementById('app');
  var fill=document.getElementById('fill'),tick=document.getElementById('tick'),
      fig=document.getElementById('fig'),den=document.getElementById('den'),aw=document.getElementById('aw');
  app.style.setProperty('--fillc',fillColor(TGT));
  fill.setAttribute('stroke',fillColor(TGT));
  tick.setAttribute('fill',fillColor(TGT));
  // arc reveal
  var off=(75-0.75*pct).toFixed(2);
  fill.setAttribute('stroke-dashoffset',off);
  // depth: stroke-width thin→full
  var w=(MODE==='depth')?(2+3*(eased===undefined?pct/TGT:eased)):W0;
  fill.setAttribute('stroke-width',w.toFixed(2));
  // gauge-tick on leading edge (fraction pct/100 along the 270° arc)
  if(LAY.tick&&pct>0.5){tick.setAttribute('r','3.4');
    tick.setAttribute('transform','rotate('+(225+270*(pct/100)).toFixed(2)+' '+CX+' '+CX+')');}
  else tick.setAttribute('r','0');
  // number
  if(pct<=0){fig.textContent='—';fig.style.fontWeight='300';fig.style.fontSize='25px';den.textContent='';aw.textContent='';return;}
  fig.style.fontWeight='800';fig.style.fontSize='23px';
  var filled=LAY.num?Math.round(pct/100*TOTAL):Math.round(TGT/100*TOTAL);
  fig.textContent=filled;den.textContent='/'+TOTAL;aw.textContent=Math.round(LAY.num?pct:TGT)+'%';
}
function applyDir(){var g=document.getElementById('ringG');
  g.setAttribute('transform',CFG.dir<0?'translate('+D+' 0) scale(-1 1)':'');}

/* ---- easing ---- */
function easer(){
  if(MODE==='over'){var c1=1.70158*(CFG.over/40),c3=c1+1;
    return function(t){return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};}
  return function(t){return 1-Math.pow(1-t,3);}; // decel (sweep/depth)
}

/* ---- baseline (idle) then run ---- */
function measureBaseline(cb){var n=0,last=performance.now(),g=[];
  function tick(now){if(n>0)g.push(now-last);last=now;n++;
    if(n<24){requestAnimationFrame(tick);}else{g.sort(function(a,b){return a-b;});baseline=g[g.length>>1]||16.7;cb&&cb();}}
  requestAnimationFrame(tick);}

function run(){
  if(raf)cancelAnimationFrame(raf);
  applyDir();setPct(0);
  fgSet('вимір…',false);
  measureBaseline(function(){
    var dur=CFG.dur*SLOW,ease=easer(),start=null,last=null,frame=0,gaps=[];
    function tick(now){
      if(start===null){start=now;last=now;raf=requestAnimationFrame(tick);return;}
      var gap=now-last;last=now;frame++;
      if(frame>3)gaps.push(gap);
      var t=Math.min(1,(now-start)/dur),e=ease(t);
      var pct=Math.max(0,Math.min(100,e*TGT));
      setPct(pct,e);
      if(t<1){raf=requestAnimationFrame(tick);}
      else{setPct(TGT,1);report(gaps);
        if(LAY.pulse&&TGT>=100){var r=document.getElementById('ring');r.classList.remove('pulsing');void r.offsetWidth;r.classList.add('pulsing');}}
    }
    raf=requestAnimationFrame(tick);
  });
}
function report(gaps){
  if(!gaps.length){fgSet('—',false);return;}
  var max=Math.max.apply(null,gaps),dropped=0;
  for(var i=0;i<gaps.length;i++)if(gaps[i]>33)dropped++;
  var d=max-baseline;
  fgSet('max <b>'+max.toFixed(0)+'</b>ms · dropped <b>'+dropped+'</b> · Δ <b>'+(d>=0?'+':'')+d.toFixed(0)+'</b>ms',max>33||dropped>0);
}
function fgSet(html,warn){var el=document.getElementById('fg');el.innerHTML='frame-gap: '+html;
  el.classList.toggle('warn',!!warn);}

/* ---- levers ---- */
var LEVERS=[['dur','dur ms',300,2000,50],['over','over % (B2)',0,120,5]];
function buildLevs(){document.getElementById('levs').innerHTML=LEVERS.map(function(l){
  return '<div class="lv"><label>'+l[1]+' <b id="o-'+l[0]+'">'+CFG[l[0]]+'</b></label>'+
    '<input type="range" min="'+l[2]+'" max="'+l[3]+'" step="'+l[4]+'" value="'+CFG[l[0]]+'" data-k="'+l[0]+'"></div>';}).join('');
  document.getElementById('levs').addEventListener('input',function(e){var k=e.target.getAttribute('data-k');if(!k)return;
    CFG[k]=+e.target.value;document.getElementById('o-'+k).textContent=CFG[k];});}
function buildTgls(){
  var items=[['num','count-up'],['tick','gauge-tick'],['pulse','pulse-on-full'],['dir','CCW']];
  document.getElementById('tgls').innerHTML=items.map(function(it){
    var on=(it[0]==='dir')?(CFG.dir<0):LAY[it[0]];
    return '<button class="tgl'+(on?' on':'')+'" data-t="'+it[0]+'">'+it[1]+'</button>';}).join('');
  document.getElementById('tgls').addEventListener('click',function(e){var b=e.target.closest('.tgl');if(!b)return;
    var t=b.getAttribute('data-t');
    if(t==='dir'){CFG.dir=CFG.dir<0?1:-1;b.classList.toggle('on',CFG.dir<0);applyDir();}
    else{LAY[t]=!LAY[t];b.classList.toggle('on',LAY[t]);}});
}
function legend(){document.getElementById('legr').innerHTML=
  '<b>Дуга-анімація §5.2.</b> Тільки <b>stroke-dashoffset</b> (A70, без шимеру); грає ЛИШЕ по кнопці (on-state-change, не на mount). '+
  '<b>B1 sweep</b>=класичний decel · <b>B2 over</b>=spring перелітає+осідає (важіль <b>over</b>) · <b>B3 depth</b>=stroke-width тонка→повна. '+
  'Шари: <b>count-up</b> (число 0→N синхронно) · <b>gauge-tick</b> (крапка на краї) · <b>pulse-on-full</b> (reward на 100%). '+
  '<b>dir</b> CW/CCW. Окремо <b>partial 54%</b> vs <b>full 100%</b>. <b>slow-mo</b> ×1-3 = лупа ока (bake ефективні = сирий×N). '+
  '<b>frame-gap</b> трійка: max/dropped(&gt;33ms)/Δ-baseline — читай на device (dashoffset=main-thread paint).';}

/* ---- segs ---- */
function seg(id,fn){document.getElementById(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  [].forEach.call(this.children,function(c){c.classList.remove('on');});b.classList.add('on');fn(b);});}
seg('segTh',function(b){TH=b.getAttribute('data-th');document.getElementById('app').setAttribute('data-th',TH);setPct(0);});
seg('segDev',function(b){DEV=b.getAttribute('data-dev');document.getElementById('app').style.width=DEV+'px';});
seg('segMode',function(b){MODE=b.getAttribute('data-mode');setPct(0);});
seg('segTgt',function(b){TGT=+b.getAttribute('data-tgt');setPct(0);});
seg('segSize',function(b){SIZE=b.getAttribute('data-size');document.getElementById('app').classList.toggle('loupe',SIZE==='loupe');});
seg('segSlow',function(b){SLOW=+b.getAttribute('data-slow');});

document.getElementById('play').addEventListener('click',run);
document.getElementById('reset').addEventListener('click',function(){if(raf)cancelAnimationFrame(raf);setPct(0);fgSet('—',false);});
document.getElementById('ptog').addEventListener('click',function(){document.getElementById('panel').classList.toggle('closed');});
document.getElementById('copy').addEventListener('click',function(){
  var t='arc '+MODE+' · tgt'+TGT+' · dur'+CFG.dur+' · over'+CFG.over+' · dir'+(CFG.dir<0?'CCW':'CW')+
    ' · num'+(LAY.num?1:0)+' tick'+(LAY.tick?1:0)+' pulse'+(LAY.pulse?1:0)+' · slow×'+SLOW+
    ' · effDur='+(CFG.dur*SLOW);
  if(navigator.clipboard)navigator.clipboard.writeText(t).catch(function(){});
  var b=document.getElementById('copy');b.textContent='✓ '+t.slice(0,30)+'…';setTimeout(function(){b.textContent='📋 копі-конфіг';},1500);});

buildRing();buildLevs();buildTgls();legend();setPct(0);
</script>
</body></html>
