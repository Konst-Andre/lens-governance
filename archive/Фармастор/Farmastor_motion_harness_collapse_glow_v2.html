<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Motion харнес v2 · згортання + reward (dark glow / light wash)</title>
<style>
:root{
  --font:'Manrope',-apple-system,system-ui,sans-serif;
  --bg:#f4f6f5; --bg-soft:#e9eeec; --card:#fff; --surface-2:#eef2f0; --surface-3:#e3e9e6;
  --text:#131a17; --text-2:#3f4a45; --muted:#7b8781; --border:#d6ded9; --border-subtle:#e5ebe8;
  --accent:hsl(162 60% 34%); --accent-soft:hsl(162 44% 90%); --accent-ink:hsl(162 68% 24%);
  --ok:hsl(150 55% 40%); --crit:hsl(4 72% 55%); --warn:hsl(38 88% 46%);
  --groupBg:25; --counterFill:55; --ebInk:10; --tintMix:50; --valL:100; --mutL:46; --ghostOp:.34;
  --fieldW:60; --fieldH:46; --fieldRadius:15; --numW:800; --lWellBg:82; --lWellA:.28; --lWellDepth:1.2;
  --dWellDip:24; --dWellInset:5; --dWellLight:.12; --calmTint:69; --rowGap:6; --divA:1;
  /* ===== MOTION LEVERS (base values; slow-mo multiplies durations at runtime) ===== */
  --collapseDur:700ms; --collapseEase:ease-in-out;
  --popOver:4.5;   /* % overshoot (manual keyframe) */  --popDur:800ms; --popEase:ease-in-out;
  /* DARK reward — glow nimbus */
  --glowSpread:22; /* px (CSS multiplies *1px → lever writes UNITLESS) */  --glowOp:.55; --glowDur:900ms;
  /* LIGHT reward — accent fill-wash + ring flash */
  --washOp:.5; --washDur:640ms; --ringW:2; /* px (unitless) */ --ringOp:.9;
}
[data-theme="dark"]{
  --bg:#0b0f0d; --bg-soft:#101613; --card:#141a17; --surface-2:#1a221e; --surface-3:#212b26;
  --text:#eef3f0; --text-2:#b9c4bf; --muted:#7d8a84; --border:#2a352f; --border-subtle:#222b26;
  --accent:hsl(162 52% 46%); --accent-soft:hsl(162 40% 20%); --accent-ink:hsl(162 55% 74%);
  --ok:hsl(150 45% 55%);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f0d; --bg-soft:#101613; --card:#141a17; --surface-2:#1a221e; --surface-3:#212b26;
  --text:#eef3f0; --text-2:#b9c4bf; --muted:#7d8a84; --border:#2a352f; --border-subtle:#222b26;
  --accent:hsl(162 52% 46%); --accent-soft:hsl(162 40% 20%); --accent-ink:hsl(162 55% 74%); --ok:hsl(150 45% 55%);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100dvh;padding:14px 0 300px}
.wrap{max-width:440px;margin:0 auto;padding:0 12px}
.htitle{font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--text-2);margin:2px 4px 12px}
.htitle span{color:var(--muted);font-weight:600}
.cardBgHost{--cardBg:color-mix(in srgb,var(--bg) calc(var(--groupBg)*1%),var(--card))}

/* ===== brand card (real component CSS from b5 — visual truth) ===== */
.brand{margin:8px 0 0;background:var(--cardBg);border-radius:16px;position:relative;transform-origin:center top}
.brand.popping{animation:pop var(--popDur) var(--popEase)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(calc(1 + var(--popOver)/100))}100%{transform:scale(1)}}

/* DARK reward — glow nimbus (outer accent bloom; reads on near-black, dead on white → A45/A66) */
.brand::after{content:'';position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;
  box-shadow:0 0 calc(var(--glowSpread)*1px) color-mix(in srgb,var(--accent) 85%,transparent),
             inset 0 0 calc(var(--glowSpread)*0.5px) color-mix(in srgb,var(--accent) 40%,transparent)}
.brand.glowing::after{animation:glow var(--glowDur) ease-out}
@keyframes glow{0%{opacity:0}22%{opacity:var(--glowOp)}100%{opacity:0}}

/* LIGHT reward — fill-wash + inset ring flash (reads on white; separate mechanic, A66 split-by-theme) */
.brand::before{content:'';position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;z-index:0;
  background:var(--accent-soft);
  box-shadow:inset 0 0 0 calc(var(--ringW)*1px) color-mix(in srgb,var(--accent) calc(var(--ringOp)*100%),transparent)}
.brand.washing::before{animation:wash var(--washDur) ease-out}
@keyframes wash{0%{opacity:0}20%{opacity:var(--washOp)}100%{opacity:0}}
.bhdr,.bwrap{position:relative;z-index:1} /* keep content above the wash tint */

.bhdr{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;cursor:pointer}
.bhdr .arr{font-size:13px;color:var(--accent);width:14px;flex:0 0 14px}
.bhdr .bnm{font-size:15px;font-weight:800;color:var(--text);flex:1;letter-spacing:-.2px}
.bhdr .bcnt{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 9px;border-radius:9px;
  font:700 12px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text-2);
  background:color-mix(in srgb,var(--surface-2) calc(var(--counterFill)*1%),var(--card));border:1px solid var(--border-subtle);
  transition:background .3s ease,color .3s ease,border-color .3s ease}
.bhdr .bcnt.done{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
/* grid-rows collapse (animatable) */
.bwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--collapseDur) var(--collapseEase)}
.brand.done .bwrap{grid-template-rows:0fr}
.bbody{overflow:hidden;min-height:0}
.ebrow{display:flex;align-items:center;justify-content:space-between;padding:9px 14px 6px;background:var(--cardBg);
  border-top:2px solid var(--border-subtle);margin:0 7px}
.ebrow .eb{position:relative;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.2px;
  color:color-mix(in srgb,var(--accent) calc(var(--ebInk)*1%),var(--text-2));padding-left:11px}
.ebrow .eb::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:3px;background:var(--accent)}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 8px;border-radius:9px;
  font:700 11px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text-2);
  background:color-mix(in srgb,var(--surface-2) calc(var(--counterFill)*1%),var(--card));border:1px solid var(--border-subtle)}
.cnt.done{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.rows{padding:0 6px}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;position:relative;margin-bottom:calc(var(--rowGap)*1px)}
.row+.row::before{content:'';position:absolute;top:calc(var(--rowGap)*-.5px - .5px);left:8px;right:8px;height:1px;background:var(--border-subtle);opacity:var(--divA)}
.row .info{flex:1;min-width:0}
.row .rn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.2;min-width:0}
.row .rv{font-size:14px;font-weight:700;letter-spacing:-.1px;color:var(--text)}
.rn-tag{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap;flex:0 0 auto}
.row .rpk{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;padding:1.5px 7px;border-radius:7px;color:var(--text);background:var(--surface-2);border:1px solid var(--border-subtle)}
.row .ck{font-size:11px;font-weight:800;color:color-mix(in srgb,var(--ok) calc(var(--calmTint)*1%),transparent)}
.row .rm{font-size:11.5px;margin-top:3px;font-weight:500;color:color-mix(in srgb,var(--muted) calc(var(--mutL)*1%),var(--text-2))}
.row .rm .nm{color:var(--text-2);font-weight:700}
.row.settled{background:color-mix(in srgb,var(--accent-soft) calc(var(--tintMix)*1%),transparent);border-radius:12px}
.fwrap{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;position:relative}
.fld{flex:0 0 auto;width:calc(var(--fieldW)*1px);height:calc(var(--fieldH)*1px);border-radius:calc(var(--fieldRadius)*1px);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:color-mix(in srgb,var(--bg-soft) calc(var(--lWellBg)*1%),var(--card));
  box-shadow:inset 0 1px calc(var(--lWellDepth)*3px) rgba(0,0,0,var(--lWellA));border:1px solid var(--border-subtle)}
.fld .num{font-size:20px;font-weight:var(--numW);color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.fld .ph{font-size:19px;font-weight:600;color:var(--muted);opacity:var(--ghostOp)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cardBg:color-mix(in srgb,var(--bg) calc(var(--groupBg)*1%),var(--card));
}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fld{
  background:color-mix(in srgb,var(--card),#000 calc(var(--dWellDip)*1%));
  box-shadow:inset 0 2px calc(var(--dWellInset)*1px) rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,var(--dWellLight));
  border:1px solid color-mix(in srgb,var(--border),#000 20%)}}
[data-theme="dark"] .cardBgHost{--cardBg:color-mix(in srgb,var(--bg) calc(var(--groupBg)*1%),var(--card))}
[data-theme="dark"] .fld{background:color-mix(in srgb,var(--card),#000 calc(var(--dWellDip)*1%));
  box-shadow:inset 0 2px calc(var(--dWellInset)*1px) rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,var(--dWellLight));
  border:1px solid color-mix(in srgb,var(--border),#000 20%)}
[data-theme="dark"] .ebrow{border-top-color:var(--border)} [data-theme="dark"] .cnt,[data-theme="dark"] .bcnt{border-color:var(--border)}
[data-theme="dark"] .row .rpk{background:var(--surface-3);border-color:var(--border)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ebrow{border-top-color:var(--border)}
  :root:not([data-theme="light"]) .row .rpk{background:var(--surface-3);border-color:var(--border)}}

/* ===== controls ===== */
.btns{display:flex;gap:8px;margin:16px 0 8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:12px;border:none;border-radius:11px;font:800 13px/1 var(--font);cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
[data-theme="dark"] .btn.ghost{background:var(--surface-3);border-color:var(--border)}
.panel{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);
  padding:0;max-height:288px;overflow:hidden;z-index:9;transition:max-height .28s ease}
.panel.collapsed{max-height:46px}
[data-theme="dark"] .panel{background:var(--surface-2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel{background:var(--surface-2)}}
.pbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-bottom:1px solid var(--border-subtle)}
.caret{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);
  font:800 11px/1 var(--font);cursor:pointer}
[data-theme="dark"] .caret{background:var(--surface-3)}
.fgap{font:700 10.5px/1.3 var(--font);color:var(--muted);font-variant-numeric:tabular-nums;flex:1;text-align:right}
.fgap b{font-weight:800}
.pbody{padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-height:242px;overflow:auto}
.legend{font:600 11px/1.4 var(--font);color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.legend b{color:var(--accent);font-weight:800}
.grpTag{display:inline-block;font:800 9px/1 var(--font);letter-spacing:.6px;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;margin:4px 0 2px;background:var(--surface-2);color:var(--text-2)}
.grpTag.dk{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2));color:var(--accent-ink)}
.grpTag.lt{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2));color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.lev{display:flex;flex-direction:column;gap:2px}
.lev.full{grid-column:1/-1}
.lev label{font:700 10px/1 var(--font);color:var(--text-2);display:flex;justify-content:space-between}
.lev label i{color:var(--accent);font-style:normal;font-variant-numeric:tabular-nums}
.lev input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.lev select{padding:5px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:700 11px/1 var(--font)}
.slowbar{display:flex;gap:6px;align-items:center;margin:8px 0 2px}
.slowbar .sb{padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font:800 11px/1 var(--font);cursor:pointer}
.slowbar .sb.on{background:var(--accent);color:#fff;border-color:transparent}
.cpBtn{margin-left:auto;padding:6px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font:800 11px/1 var(--font);cursor:pointer}
.themebar{display:flex;gap:6px;margin:0 0 8px}
.themebar .tb{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font:700 10px/1 var(--font);cursor:pointer}
.themebar .tb.on{background:var(--accent);color:#fff;border-color:transparent}
textarea{position:fixed;opacity:0;pointer-events:none;left:-9999px}
</style>
</head>
<body>
<div class="wrap cardBgHost">
  <div class="htitle">MOTION харнес v2 · згортання + reward <span>— dark=glow · light=wash+ring. Заповни останнє → reward. Тема перемикає важелі reward.</span></div>
  <div id="stage"></div>
  <div class="btns">
    <button class="btn primary" onclick="doComplete()">Заповнити останнє</button>
    <button class="btn ghost" onclick="reset()">Скинути</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="pbar">
    <button class="caret" id="caret" onclick="togglePanel()">▾ Панель</button>
    <span class="fgap" id="fgap">frame-gap: тисни «Заповнити»…</span>
  </div>
  <div class="pbody" id="pbody">
    <div class="themebar">
      <button class="tb" data-th="auto" onclick="setTheme('auto')">Авто</button>
      <button class="tb" data-th="light" onclick="setTheme('light')">Світла</button>
      <button class="tb" data-th="dark" onclick="setTheme('dark')">Темна</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="slowbar">
      <span style="font:800 10px/1 var(--font);color:var(--text-2)">SLOW-MO:</span>
      <button class="sb on" data-sm="1" onclick="setSlow(1)">×1</button>
      <button class="sb" data-sm="2" onclick="setSlow(2)">×2</button>
      <button class="sb" data-sm="3" onclick="setSlow(3)">×3</button>
      <button class="cpBtn" onclick="copyVals()">📋 Копіювати</button>
    </div>
    <div class="grid" id="levers"></div>
  </div>
</div>
<textarea id="ta"></textarea>

<script>
/* Гавіскон (реальний relabel-gold) — 3 під-групи, 7 рядків */
const CARD={brand:'Гавіскон',subs:[
  {eb:'Таблетки',rows:[{v:'Подвійної дії',pk:'№24',fd:'',m:2},{v:'Полуниця',pk:'№16',fd:'250 мг',m:3},{v:'М’ята',pk:'№24',fd:'250 мг',m:2}]},
  {eb:'Суспензія',rows:[{v:'Подвійної дії',pk:'150 мл',fd:'',m:4},{v:'М’ятна',pk:'150 мл',fd:'',m:3}]},
  {eb:'Саше',rows:[{v:'Подвійної дії',pk:'№24',fd:'10 мл',m:2},{v:'Форте м’ятна',pk:'№20',fd:'10 мл',m:5}]},
]};
const ALL=CARD.subs.reduce((a,s)=>a.concat(s.rows),[]);
const TOT=ALL.length; // 7
let vals={};

/* levers grouped: shared | dark | light. raw:true → CSS multiplies *1px, lever writes UNITLESS (fixes glowSpread double-unit bug) */
const LEVERS=[
  {k:'--collapseDur',n:'collapse dur',min:200,max:900,step:20,unit:'ms',dur:true,grp:'shared'},
  {k:'--popDur',n:'pop dur',min:300,max:1100,step:20,unit:'ms',dur:true,grp:'shared'},
  {k:'--popOver',n:'pop overshoot',min:0,max:9,step:.5,unit:'%',grp:'shared'},
  {k:'--glowDur',n:'glow dur',min:300,max:1600,step:50,unit:'ms',dur:true,grp:'dark'},
  {k:'--glowSpread',n:'glow spread',min:0,max:44,step:2,unit:'px',raw:true,grp:'dark'},
  {k:'--glowOp',n:'glow opacity',min:0,max:1,step:.05,unit:'',grp:'dark'},
  {k:'--washDur',n:'wash dur',min:300,max:1200,step:20,unit:'ms',dur:true,grp:'light'},
  {k:'--washOp',n:'wash opacity',min:0,max:1,step:.05,unit:'',grp:'light'},
  {k:'--ringW',n:'ring width',min:0,max:6,step:.5,unit:'px',raw:true,grp:'light'},
  {k:'--ringOp',n:'ring opacity',min:0,max:1,step:.05,unit:'',grp:'light'},
];
const EASES={'spring-soft':'cubic-bezier(.34,1.56,.64,1)','spring-firm':'cubic-bezier(.22,1.2,.36,1)','ease-out':'ease-out','ease-in-out':'ease-in-out','ease':'ease'};
let curEase='ease-in-out', curPop='ease-in-out';
let slow=1;

function css(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim();}
function setVar(k,v){document.documentElement.style.setProperty(k,v);}

const LEV_BASE={}; LEVERS.forEach(l=>{ if(l.dur) LEV_BASE[l.k]=parseFloat(css(l.k)); });

function resolvedTheme(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t==='dark') return 'dark';
  if(t==='light') return 'light';
  return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
}

function applySlow(){
  LEVERS.forEach(l=>{ if(l.dur){ setVar(l.k,(LEV_BASE[l.k]*slow)+'ms'); } });
  renderLegend();
}
function setSlow(s){ slow=s; document.querySelectorAll('.sb').forEach(b=>b.classList.toggle('on',+b.dataset.sm===s)); applySlow(); }

function stageHtml(done){
  var filled=Object.keys(vals).length,total=TOT,isDone=filled===total;
  var h='<div class="brand'+(isDone&&done?' done':'')+'" id="brand">'
    +'<div class="bhdr"><span class="arr" id="arr">'+(isDone&&done?'▸':'▾')+'</span><span class="bnm">'+CARD.brand+'</span>'
    +'<span class="bcnt'+(isDone?' done':'')+'" id="bcnt">'+(isDone?'✓':filled+'/'+total)+'</span></div>'
    +'<div class="bwrap"><div class="bbody">';
  var gi=0;
  CARD.subs.forEach(function(sub){
    var sf=sub.rows.filter(function(_,i){return vals[gi+i]!==undefined;}).length,sd=sf===sub.rows.length;
    h+='<div class="ebrow"><span class="eb">'+sub.eb+'</span><span class="cnt'+(sd?' done':'')+'">'+sf+'/'+sub.rows.length+'</span></div><div class="rows">';
    sub.rows.forEach(function(r){
      var idx=gi,has=vals[idx]!==undefined;
      h+='<div class="row'+(has?' settled':'')+'">'
        +'<div class="info"><div class="rn"><span class="rv">'+r.v+'</span><span class="rn-tag"><span class="rpk">'+r.pk+'</span>'+(has?'<span class="ck">✓</span>':'')+'</span></div>'
        +'<div class="rm">'+(r.fd?r.fd+' · ':'')+'MSL <span class="nm">'+r.m+'</span></div></div>'
        +'<div class="fwrap"><div class="fld">'+(has?'<span class="num">'+vals[idx]+'</span>':'<span class="ph">'+r.m+'</span>')+'</div></div></div>';
      gi++;
    });
    h+='</div>';
  });
  h+='</div></div></div>';
  return h;
}
function paint(done){ document.getElementById('stage').innerHTML=stageHtml(done); }
function preFill(){ vals={}; ALL.forEach(function(r,i){ if(i<TOT-1) vals[i]=r.m; }); paint(false); }

/* ===== frame-gap trio (wsd 2.4 — max-gap / dropped>33 / Δ baseline) ===== */
let fgTimes=[],fgRun=false,baselineGap=0,lastRun=null;
function startFgap(){ fgTimes=[]; fgRun=true; var last=null;
  function loop(ts){ if(last!=null) fgTimes.push(ts-last); last=ts; if(fgRun) requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
}
function stopFgap(){ fgRun=false; setTimeout(reportFgap,30); }
function reportFgap(){
  if(!fgTimes.length){ return; }
  var g=fgTimes.slice(2); // drop first 2 (class-add jitter)
  var mx=Math.max.apply(null,g);
  var dropped=g.filter(function(x){return x>33;}).length;
  lastRun={mx:mx,dropped:dropped,delta:baselineGap?(mx-baselineGap):null};
  renderFgap();
}
function measureBaseline(){ var arr=[],last=null,n=0;
  function loop(ts){ if(last!=null) arr.push(ts-last); last=ts; n++; if(n<44) requestAnimationFrame(loop); else fin(); }
  function fin(){ var use=arr.slice(12); baselineGap=use.reduce(function(a,b){return a+b;},0)/use.length; renderFgap(); }
  requestAnimationFrame(loop);
}
function fgapColor(ms){ return ms<=17?'var(--ok)':(ms<=33?'var(--warn)':'var(--crit)'); }
function renderFgap(){
  var el=document.getElementById('fgap');
  var bl=baselineGap?('baseline '+baselineGap.toFixed(1)+'ms'):'baseline …';
  if(!lastRun){ el.innerHTML='frame-gap: '+bl+' · тисни «Заповнити»'; return; }
  var mc=fgapColor(lastRun.mx), dc=lastRun.dropped>0?'var(--crit)':'var(--ok)';
  var d=lastRun.delta==null?'—':(lastRun.delta>=0?'+':'')+lastRun.delta.toFixed(1)+'ms';
  el.innerHTML='max <b style="color:'+mc+'">'+lastRun.mx.toFixed(1)+'ms</b> · dropped <b style="color:'+dc+'">'+lastRun.dropped+'</b> · Δ <b>'+d+'</b> · '+bl;
}

let busy=false;
function doComplete(){
  if(busy) return;
  if(Object.keys(vals).length<TOT-1) preFill();
  vals[TOT-1]=ALL[TOT-1].m;
  paint(false);
  busy=true;
  var brand=document.getElementById('brand');
  var th=resolvedTheme();
  var rewardCls=th==='dark'?'glowing':'washing';
  var rewardDur=th==='dark'?parseFloat(css('--glowDur')):parseFloat(css('--washDur'));
  var settle=Math.max(rewardDur,parseFloat(css('--popDur')),parseFloat(css('--collapseDur'))+140*slow)+80;
  startFgap();
  requestAnimationFrame(function(){
    brand.classList.add(rewardCls,'popping');
    setTimeout(function(){ brand.classList.add('done'); document.getElementById('arr').textContent='▸'; },140*slow);
    setTimeout(function(){ brand.classList.remove(rewardCls,'popping'); busy=false; stopFgap(); },settle);
  });
}
function reset(){ busy=false; fgRun=false; preFill(); }

/* ===== levers UI (per-theme: shared + active-theme reward group) ===== */
function renderLevers(){
  var g=document.getElementById('levers'); var th=resolvedTheme(); var h='';
  // shared group
  h+='<div class="grpTag full">спільні (обидві теми)</div>';
  LEVERS.filter(l=>l.grp==='shared').forEach(l=>h+=levHtml(l));
  h+='<div class="lev"><label>collapse ease</label><select id="selEase" onchange="onEase(this,\'collapse\')">'+easeOpts(curEase)+'</select></div>';
  h+='<div class="lev"><label>pop ease</label><select id="selPop" onchange="onEase(this,\'pop\')">'+easeOpts(curPop)+'</select></div>';
  // active theme reward group
  if(th==='dark'){
    h+='<div class="grpTag dk full">DARK reward — glow німб</div>';
    LEVERS.filter(l=>l.grp==='dark').forEach(l=>h+=levHtml(l));
  }else{
    h+='<div class="grpTag lt full">LIGHT reward — wash + ring</div>';
    LEVERS.filter(l=>l.grp==='light').forEach(l=>h+=levHtml(l));
  }
  g.innerHTML=h;
}
function levHtml(l){
  var raw=l.dur?LEV_BASE[l.k]:parseFloat(css(l.k));
  return '<div class="lev"><label>'+l.n+'<i id="v'+cssId(l.k)+'">'+raw+l.unit+'</i></label>'
    +'<input type="range" min="'+l.min+'" max="'+l.max+'" step="'+l.step+'" value="'+raw+'" data-k="'+l.k+'" data-u="'+l.unit+'" data-d="'+(l.dur?1:0)+'" data-raw="'+(l.raw?1:0)+'" oninput="onLev(this)"></div>';
}
function easeOpts(cur){return Object.keys(EASES).map(function(k){return '<option'+(k===cur?' selected':'')+'>'+k+'</option>';}).join('');}
function cssId(k){return k.replace(/[^a-z]/gi,'');}
function onLev(inp){
  var k=inp.dataset.k,u=inp.dataset.u,isD=inp.dataset.d==='1',isRaw=inp.dataset.raw==='1',val=parseFloat(inp.value);
  document.getElementById('v'+cssId(k)).textContent=val+u;
  if(isD){ LEV_BASE[k]=val; setVar(k,(val*slow)+'ms'); }
  else if(isRaw){ setVar(k,val); }              // UNITLESS — CSS appends *1px (glowSpread / ringW fix)
  else{ setVar(k, u==='px'?val+'px':val); }
  renderLegend();
}
function onEase(sel,which){
  var v=EASES[sel.value];
  if(which==='collapse'){ curEase=sel.value; setVar('--collapseEase',v); }
  else{ curPop=sel.value; setVar('--popEase',v); }
  renderLegend();
}
function renderLegend(){
  var th=resolvedTheme(); var L=document.getElementById('legend');
  var rew = th==='dark'
    ? 'glow <b>'+LEV_BASE['--glowDur']+'ms</b> spread <b>'+css('--glowSpread')+'px</b> op <b>'+css('--glowOp')+'</b>'
    : 'wash <b>'+LEV_BASE['--washDur']+'ms</b> op <b>'+css('--washOp')+'</b> ring <b>'+css('--ringW')+'px</b>/'+css('--ringOp');
  L.innerHTML='ефективні (bake ×1) · <b style="color:var(--accent-ink)">'+(th==='dark'?'DARK':'LIGHT')+'</b>: '
    +'collapse <b>'+LEV_BASE['--collapseDur']+'ms</b> '+curEase+' · '
    +'pop <b>'+LEV_BASE['--popDur']+'ms</b>/'+curPop+' over <b>'+css('--popOver')+'%</b> · '+rew
    +(slow>1?' <span style="color:var(--warn)">| slow ×'+slow+' (bake=×1)</span>':'');
}
function copyVals(){
  var t='FARMASTOR collapse+reward LOCK v2 (bake ×1):\n'
    +'shared:\n'
    +'  --collapseDur:'+LEV_BASE['--collapseDur']+'ms; --collapseEase:'+EASES[curEase]+';\n'
    +'  --popDur:'+LEV_BASE['--popDur']+'ms; --popEase:'+EASES[curPop]+'; --popOver:'+css('--popOver')+';\n'
    +'dark reward (glow німб):\n'
    +'  --glowDur:'+LEV_BASE['--glowDur']+'ms; --glowSpread:'+css('--glowSpread')+'; --glowOp:'+css('--glowOp')+';\n'
    +'light reward (wash+ring):\n'
    +'  --washDur:'+LEV_BASE['--washDur']+'ms; --washOp:'+css('--washOp')+'; --ringW:'+css('--ringW')+'; --ringOp:'+css('--ringOp')+';\n'
    +'lead-before-collapse: 140ms\n'
    +(lastRun?('frame-gap(last '+resolvedTheme()+'): max '+lastRun.mx.toFixed(1)+'ms · dropped '+lastRun.dropped+' · Δ '+(lastRun.delta==null?'—':lastRun.delta.toFixed(1)+'ms')):'');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb);}else fb();
  function ok(){flash('✓ Скопійовано');}
  function fb(){var ta=document.getElementById('ta');ta.value=t;ta.select();try{document.execCommand('copy');flash('✓ Скопійовано');}catch(e){flash('копіюй вручну з консолі');console.log(t);}}
}
function flash(m){var L=document.getElementById('legend');L.innerHTML='<b>'+m+'</b>';setTimeout(renderLegend,1200);}

function togglePanel(){
  var p=document.getElementById('panel'),c=document.getElementById('caret');
  var col=p.classList.toggle('collapsed');
  c.textContent=col?'▸ Панель':'▾ Панель';
}
function setTheme(t){
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.th===t));
  renderLevers(); renderLegend();
}

/* init */
setTheme('auto');
applySlow();
renderLevers();
renderLegend();
renderFgap();
preFill();
setTimeout(measureBaseline,500);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){ renderLevers(); renderLegend(); });
</script>
</body>
